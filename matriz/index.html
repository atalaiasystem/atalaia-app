ard":["Informe del Dashboard","Dashboard report"],"Escolher arquivo":["Elegir archivo","Choose file"],"Cancelar lote":["Cancelar lote","Cancel batch"],"Excluir (cadastro por engano)":["Eliminar (registro por error)","Delete (record by mistake)"],"Excluir programação":["Eliminar programación","Delete schedule"],"Prestação de contas do contrato":["Rendición de cuentas del contrato","Contract accountability"],"Visão":["Vista","View"],"(a pessoa entrou por um aparelho que ainda não tinha usado) e":["(la persona entró desde un dispositivo que aún no había usado) y","(the person signed in from a device not used before) and"],"(o certificado de calibração e a validade ficam guardados no registro)":["(el certificado de calibración y la validez quedan guardados en el registro)","(the calibration certificate and expiry are kept in the record)"],"(sem alterar nada) bens, ambientes, unidades, chamados, programações, serviços e documentos por":["(sin cambiar nada) bienes, ambientes, unidades, solicitudes, programaciones, servicios y documentos durante","(without changing anything) assets, rooms, units, requests, schedules, services and documents for"],"1 · Identificação do estabelecimento e responsável técnico (art. 7)":["1 · Identificación del establecimiento y responsable técnico (art. 7)","1 · Establishment identification and technical lead (art. 7)"],"12 · Indicadores e avaliação da efetividade do plano (art. 7 §2 e art. 9)":["12 · Indicadores y evaluación de la efectividad del plan (art. 7 §2 y art. 9)","12 · Indicators and plan effectiveness assessment (art. 7 §2 and art. 9)"],"3 · Rastreabilidade: recebimento, instalação e garantia (art. 8 e 15)":["3 · Trazabilidad: recepción, instalación y garantía (art. 8 y 15)","3 · Traceability: receipt, installation and warranty (art. 8 and 15)"],"A assinatura fica gravada com data e hora do servidor e não pode ser trocada.":["La firma queda grabada con fecha y hora del servidor y no puede cambiarse.","The signature is saved with server date and time and cannot be changed."],"A central de alertas é montada sozinha com o que precisa de atenção agora. Os avisos são mensagens do sistema e do Gestor.":["La central de alertas se arma sola con lo que necesita atención ahora. Los avisos son mensajes del sistema y del Gestor.","The alert center builds itself from what needs attention now. Notices are messages from the system and the Manager."],"A data e a hora são do servidor e o movimento não pode ser apagado. O custo da peça usada entra no custo do chamado e do equipamento.":["La fecha y la hora son del servidor y el movimiento no puede borrarse. El costo de la pieza usada entra en el costo de la solicitud y del equipo.","Date and time come from the server and the movement cannot be deleted. The cost of the part used goes into the request and equipment cost."],"A data e a hora são registradas pelo servidor no momento em que você salvar.":["La fecha y la hora las registra el servidor en el momento en que guarde.","Date and time are recorded by the server when you save."],"A data não pode ser no futuro e o registro não pode ser alterado depois. Reprovado deixa o equipamento INDISPONÍVEL e abre chamado urgente.":["La fecha no puede ser futura y el registro no puede modificarse después. Reprobado deja el equipo NO DISPONIBLE y abre una solicitud urgente.","The date cannot be in the future and the record cannot be changed later. Failed makes the equipment UNAVAILABLE and opens an urgent request."],"A empresa pode ver e baixar todos os dados, mas não lança nada novo. Fale com a equipe Atalaia System pelo Suporte.":["La empresa puede ver y descargar todos los datos, pero no registra nada nuevo. Hable con el equipo Atalaia System por Soporte.","The company can view and download all data, but cannot add anything new. Talk to the Atalaia System team via Support."],"A empresa principal e as filiais do mesmo contratante. Os limites do plano somam todas.":["La empresa principal y las filiales del mismo contratante. Los límites del plan suman todas.","The main company and the branches of the same customer. Plan limits add them all up."],"A equipe Atalaia System só vê os dados da empresa quando você autoriza, pelo tempo pedido, e só para consultar. Cada consulta fica no Registro de acessos.":["El equipo Atalaia System solo ve los datos de la empresa cuando usted autoriza, por el tiempo pedido, y solo para consultar. Cada consulta queda en el Registro de accesos.","The Atalaia System team only sees company data when you authorize it, for the time requested, and only to view. Each view goes to the Access log."],"A lista é uma referência: confirme no município e no estado o que é exigido.":["La lista es una referencia: confirme en el municipio y en el estado lo que se exige.","The list is a reference: confirm with the city and state what is required."],"A notificação é feita no Notivisa pelo responsável. Aqui fica o registro interno, com o número, as ações e quem registrou, sem poder apagar.":["La notificación la hace el responsable en Notivisa. Aquí queda el registro interno, con el número, las acciones y quién registró, sin poder borrar.","The notification is made in Notivisa by the person in charge. The internal record stays here, with the number, actions and who recorded it, and cannot be deleted."],"A ordem de serviço é assinada depois que o chamado é concluído.":["La orden de servicio se firma después de que la solicitud se concluye.","The work order is signed after the request is closed."],"A regra mais específica vale primeiro: ambiente › tipo de equipamento › unidade › empresa toda. Sem regra, o chamado fica aberto para quem aceitar.":["La regla más específica vale primero: ambiente › tipo de equipo › unidad › toda la empresa. Sin regla, la solicitud queda abierta para quien la acepte.","The most specific rule applies first: room › equipment type › unit › whole company. Without a rule, the request stays open for whoever accepts it."],"A sede da sua empresa e os clientes que vocês atendem. Cada cliente é uma unidade, com aparelhos, PMOC e relatórios separados. Os limites do plano somam todas.":["La sede de su empresa y los clientes que ustedes atienden. Cada cliente es una unidad, con equipos, PMOC e informes separados. Los límites del plan suman todas.","Your company head office and the clients you serve. Each client is a unit, with its own units, PMOC and reports. Plan limits add them all up."],"A senha é a mesma do aplicativo. O link abre o aplicativo: digite o seu e-mail, toque em “Esqueci minha senha”, crie a nova senha pelo e-mail e volte aqui.":["La contraseña es la misma de la aplicación. El enlace abre la aplicación: escriba su e-mail, toque “Olvidé mi contraseña”, cree la nueva contraseña por el e-mail y vuelva aquí.","The password is the same as the app. The link opens the app: type your e-mail, tap “Forgot my password”, create the new password from the e-mail and come back here."],"A tela do Dashboard em gráficos e cartões coloridos, com as cores da empresa, para apresentar. Mês a mês, em PDF ou Excel":["La pantalla del Dashboard en gráficos y tarjetas de colores, con los colores de la empresa, para presentar. Mes a mes, en PDF o Excel","The Dashboard screen in charts and colored cards, in company colors, for presenting. Month by month, in PDF or Excel"],"A unidade não tem e-mail do representante de bens de terceiros cadastrado.":["La unidad no tiene registrado el e-mail del representante de bienes de terceros.","The unit has no third-party asset representative e-mail registered."],"Abra Chamados. A lista mostra prioridade, situação e prazo de cada chamado.":["Abra Solicitudes. La lista muestra prioridad, situación y plazo de cada solicitud.","Open Requests. The list shows priority, status and deadline of each request."],"Abra Climatização (PMOC) no menu e confira a saúde de cada aparelho.":["Abra Climatización (PMOC) en el menú y revise la salud de cada equipo.","Open HVAC (PMOC) in the menu and check each unit's health."],"Abra Configurações › Conta e veja Faturas do Atalaia System: mês, valor, vencimento e situação.":["Abra Configuración › Cuenta y vea Facturas de Atalaia System: mes, valor, vencimiento y situación.","Open Settings › Account and see Atalaia System invoices: month, amount, due date and status."],"Abra Configurações › Design e coloque a logo e a cor da empresa.":["Abra Configuración › Diseño y ponga el logo y el color de la empresa.","Open Settings › Design and add the company logo and color."],"Abra Normas e documentos e veja Documentos obrigatórios: em dia, vencendo, vencido ou não enviado.":["Abra Normas y documentos y vea Documentos obligatorios: al día, por vencer, vencido o no enviado.","Open Standards and documents and see Required documents: up to date, expiring, expired or not sent."],"Abra Radiologia, predial e odontologia no menu e escolha a área.":["Abra Radiología, edificio y odontología en el menú y elija el área.","Open Radiology, building and dentistry in the menu and choose the area."],"Abrir chamado, ver bens do ambiente e calibrações, sem login.":["Abrir solicitud, ver bienes del ambiente y calibraciones, sin login.","Open a request, see room assets and calibrations, without login."],"Acompanhe os vencidos e os que vencem em até 60 dias em Precisa de ação hoje.":["Siga los vencidos y los que vencen en hasta 60 días en Requiere acción hoy.","Track expired items and those due within 60 days in Needs action today."],"Administradores e colaboradores em Cadastros › Colaboradores.":["Administradores y colaboradores en Registros › Colaboradores.","Administrators and technicians in Records › Technicians."],"Agenda de calibrações e manutenções preventivas, com alertas antes do vencimento e laudos guardados por equipamento.":["Agenda de calibraciones y mantenimientos preventivos, con alertas antes del vencimiento e informes guardados por equipo.","Calibration and preventive maintenance schedule, with alerts before the due date and reports kept per equipment."],"Aguarde a confirmação de quem abriu. Se o problema voltar, ele pode reabrir.":["Espere la confirmación de quien abrió. Si el problema vuelve, puede reabrir.","Wait for confirmation from whoever opened it. If the problem comes back, they can reopen."],"Ajustar o sistema à empresa: dados, aparência, prazos, numeração, avisos, automações, LGPD e conta.":["Ajustar el sistema a la empresa: datos, apariencia, plazos, numeración, avisos, automatizaciones, LGPD y cuenta.","Fit the system to the company: data, look, deadlines, numbering, notices, automations, LGPD and account."],"Alta, média e baixa, com prazos de atendimento e solução editáveis.":["Alta, media y baja, con plazos de atención y solución editables.","High, medium and low, with editable response and resolution deadlines."],"Ambientes, bens e equipamentos, colaboradores, responsáveis e fornecedores.":["Ambientes, bienes y equipos, colaboradores, responsables y proveedores.","Rooms, assets and equipment, technicians, people in charge and suppliers."],"Ambientes: cadastre nome, setor, unidade e marque se é crítico.":["Ambientes: registre nombre, sector, unidad y marque si es crítico.","Rooms: register name, department, unit and mark if critical."],"Anexe o relatório do físico médico ou do responsável técnico, quando houver.":["Adjunte el informe del físico médico o del responsable técnico, cuando lo haya.","Attach the medical physicist or technical lead report, when available."],"Antes de decidir conserto ou troca, em auditorias e quando pedido.":["Antes de decidir reparación o cambio, en auditorías y cuando se pida.","Before deciding repair or replacement, in audits and on request."],"Antes de recarregar um aparelho que já teve recarga, peça o teste de estanqueidade: recarga repetida sem achar o vazamento joga gás na atmosfera e não resolve o problema.":["Antes de recargar un equipo que ya tuvo recarga, pida la prueba de estanqueidad: recargar de nuevo sin encontrar la fuga libera gas a la atmósfera y no resuelve el problema.","Before refilling a unit that was already refilled, ask for a leak test: refilling again without finding the leak releases gas into the air and does not fix the problem."],"Ao cadastrar o bem, digite o número da etiqueta colada no campo Patrimônio. Sem número, o sistema gera o próximo.":["Al registrar el bien, escriba el número de la etiqueta pegada en el campo Patrimonio. Sin número, el sistema genera el siguiente.","When registering the asset, type the attached label number in the Asset no. field. Without a number, the system generates the next one."],"Ao cadastrar um bem, o sistema também compara o nº de série e avisa quando o mesmo equipamento está sendo cadastrado duas vezes.":["Al registrar un bien, el sistema también compara el nº de serie y avisa cuando el mismo equipo se está registrando dos veces.","When registering an asset, the system also compares the serial no. and warns when the same equipment is being registered twice."],"Ao chegar no local, clique em Iniciar e tire a foto de antes.":["Al llegar al lugar, haga clic en Iniciar y saque la foto de antes.","On arrival, click Start and take the before photo."],"Ao confirmar, o bem passa a constar como de terceiro e o representante da unidade recebe o e-mail na hora.":["Al confirmar, el bien pasa a figurar como de terceros y el representante de la unidad recibe el e-mail al instante.","On confirming, the asset is listed as third-party and the unit representative gets the e-mail right away."],"Ao entregar um ambiente a um responsável e sempre que o termo precisar ser atualizado.":["Al entregar un ambiente a un responsable y siempre que el término deba actualizarse.","When handing a room to a person in charge and whenever the term needs updating."],"Ao marcar Encerrada, o registro fica fechado para alterações.":["Al marcar Finalizada, el registro queda cerrado a cambios.","When marked Closed, the record is locked for changes."],"Ao montar procedimentos, antes de auditorias e quando um documento vencer.":["Al armar procedimientos, antes de auditorías y cuando un documento venza.","When writing procedures, before audits and when a document expires."],"Ao mover um bem, o termo de responsabilidade dos dois ambientes aparece como “precisa atualizar”.":["Al mover un bien, el término de responsabilidad de los dos ambientes aparece como “debe actualizarse”.","When an asset moves, the responsibility term of both rooms shows “needs updating”."],"Ao registrar o serviço feito, a próxima data é calculada sozinha.":["Al registrar el servicio hecho, la próxima fecha se calcula sola.","When the service is recorded, the next date is calculated automatically."],"Aparece o ambiente com os equipamentos já cadastrados. Toque em + Cadastrar equipamento neste ambiente.":["Aparece el ambiente con los equipos ya registrados. Toque + Registrar equipo en este ambiente.","The room shows with the equipment already registered. Tap + Register equipment in this room."],"Apoio: informação documentada, dados confiáveis dos ativos e competência das pessoas.":["Apoyo: información documentada, datos confiables de los activos y competencia de las personas.","Support: documented information, reliable asset data and people's competence."],"Apontar, com critério, quais equipamentos devem ser trocados primeiro.":["Indicar, con criterio, qué equipos deben cambiarse primero.","Show, with clear criteria, which equipment should be replaced first."],"Aprovada a baixa, baixe o Termo de baixa (PDF) e colha as assinaturas.":["Aprobada la baja, descargue el Término de baja (PDF) y recoja las firmas.","Once the write-off is approved, download the Write-off term (PDF) and collect signatures."],"Ar-condicionado, VRF, UTA, fancoil e renovação de ar: saúde de cada aparelho, plano de manutenção, medições, gás refrigerante e qualidade do ar. Lei 13.589/2018 e Portaria GM/MS 3.523/1998.":["Aire acondicionado, VRF, UTA, fancoil y renovación de aire: salud de cada equipo, plan de mantenimiento, mediciones, gas refrigerante y calidad del aire. Ley 13.589/2018 y Portaria GM/MS 3.523/1998.","Air conditioning, VRF, AHU, fan coil and air renewal: health of each unit, maintenance plan, readings, refrigerant and air quality. Law 13,589/2018 and Ordinance GM/MS 3.523/1998."],"As etapas se marcam pelos próprios cadastros feitos no sistema.":["Las etapas se marcan por los propios registros hechos en el sistema.","Steps are ticked by the records made in the system."],"As faturas e os pagamentos são registrados pela equipe Atalaia System.":["Las facturas y los pagos los registra el equipo Atalaia System.","Invoices and payments are recorded by the Atalaia System team."],"Atalaia System - Sistema de Gestão de Patrimônio e Manutenção":["Atalaia System - Sistema de Gestión de Patrimonio y Mantenimiento","Atalaia System - Asset and Maintenance Management System"],"Atalaia System · Sistema de Gestão de Patrimônio e Manutenção.":["Atalaia System · Sistema de Gestión de Patrimonio y Mantenimiento.","Atalaia System · Asset and Maintenance Management System."],"Atalaia System · datas e horários registrados pelo servidor · página":["Atalaia System · fechas y horarios registrados por el servidor · página","Atalaia System · dates and times recorded by the server · page"],"Atalaia System · os horários vêm do servidor e não podem ser alterados":["Atalaia System · los horarios vienen del servidor y no pueden modificarse","Atalaia System · times come from the server and cannot be changed"],"Atalaia System: patrimônio e manutenção. Painel do Gestor e do Administrador.":["Atalaia System: patrimonio y mantenimiento. Panel del Gestor y del Administrador.","Atalaia System: assets and maintenance. Manager and Administrator Panel."],"Atender cada pedido de manutenção do começo ao fim, com fotos, prazos e confirmação de quem pediu.":["Atender cada pedido de mantenimiento de principio a fin, con fotos, plazos y confirmación de quien pidió.","Handle each maintenance request from start to finish, with photos, deadlines and requester confirmation."],"Aumente se o logo ficar pequeno ou apagado na placa. O texto se ajusta ao espaço que sobra.":["Aumente si el logo queda pequeño o apagado en la placa. El texto se ajusta al espacio que sobra.","Increase if the logo looks small or faint on the plate. The text fits the remaining space."],"Autoclave, compressor, cadeira e equipo, raio X intraoral, fotopolimerizador, ultrassom":["Autoclave, compresor, sillón y equipo, rayos X intraoral, fotopolimerizador, ultrasonido","Autoclave, compressor, dental chair and unit, intraoral X-ray, curing light, ultrasound"],"Autoclave, compressor, cadeira, raio X intraoral e pendências (RDC 1002/2025)":["Autoclave, compresor, sillón, rayos X intraoral y pendientes (RDC 1002/2025)","Autoclave, compressor, chair, intraoral X-ray and open items (RDC 1002/2025)"],"Autorizar a equipe Atalaia System a ver os dados da empresa pelo tempo pedido?":["¿Autorizar al equipo Atalaia System a ver los datos de la empresa por el tiempo pedido?","Authorize the Atalaia System team to view company data for the time requested?"],"Avaliação de desempenho: indicadores, auditoria interna e análise crítica pela direção.":["Evaluación de desempeño: indicadores, auditoría interna y análisis crítico por la dirección.","Performance evaluation: indicators, internal audit and management review."],"Aviso vermelho na ficha, no app, no painel e alerta do Dashboard":["Aviso rojo en la ficha, en la app, en el panel y alerta del Dashboard","Red notice on the sheet, in the app, on the panel and a Dashboard alert"],"Avisos e automações: e-mails, expediente, feriados, plantão e regras automáticas.":["Avisos y automatizaciones: e-mails, horario, feriados, guardia y reglas automáticas.","Notices and automations: e-mails, working hours, holidays, on-call and automatic rules."],"Ações para a segurança do paciente e Núcleo de Segurança do Paciente.":["Acciones para la seguridad del paciente y Núcleo de Seguridad del Paciente.","Patient safety actions and Patient Safety Unit."],"Baixe o Documento PMOC (PDF) e o Relatório do mês quando precisar apresentar.":["Descargue el Documento PMOC (PDF) y el Informe del mes cuando necesite presentar.","Download the PMOC document (PDF) and the Month report when you need to present."],"Bem marcado como de terceiro. O representante da unidade está sendo avisado por e-mail.":["Bien marcado como de terceros. El representante de la unidad está siendo avisado por e-mail.","Asset marked as third-party. The unit representative is being notified by e-mail."],"Bem movido sem registro aparece como de outro ambiente na auditoria.":["Un bien movido sin registro aparece como de otro ambiente en la auditoría.","An asset moved without a record shows as from another room in the audit."],"Biblioteca com as normas que se aplicam à gestão de patrimônio e manutenção, com resumo e link para a fonte oficial.":["Biblioteca con las normas que se aplican a la gestión de patrimonio y mantenimiento, con resumen y enlace a la fuente oficial.","Library of standards that apply to asset and maintenance management, with summary and link to the official source."],"Cada ambiente abre resumo, chamados, inventário e calibrações.":["Cada ambiente abre resumen, solicitudes, inventario y calibraciones.","Each room opens summary, requests, inventory and calibrations."],"Cada documento fica guardado com data de envio, validade, unidade e quem enviou. Os avisos de 60 e 30 dias saem por e-mail.":["Cada documento queda guardado con fecha de envío, validez, unidad y quién lo envió. Los avisos de 60 y 30 días salen por e-mail.","Each document is kept with upload date, expiry, unit and who uploaded it. The 60- and 30-day notices go out by e-mail."],"Cada etapa (abertura, aceite, início, conclusão, confirmação) grava data, hora do servidor e quem fez. As fotos levam número, ambiente, hora e localização.":["Cada etapa (apertura, aceptación, inicio, conclusión, confirmación) graba fecha, hora del servidor y quién lo hizo. Las fotos llevan número, ambiente, hora y ubicación.","Each step (opening, acceptance, start, completion, confirmation) saves date, server time and who did it. Photos carry number, room, time and location."],"Cada filial pode ter CNPJ, endereço, telefone e e-mail próprios. Em branco, os relatórios usam os dados da empresa.":["Cada filial puede tener CNPJ, dirección, teléfono y e-mail propios. En blanco, los informes usan los datos de la empresa.","Each branch can have its own CNPJ, address, phone and e-mail. If blank, reports use the company data."],"Cada movimento fica no histórico do bem, com quem pediu e quem aprovou.":["Cada movimiento queda en el historial del bien, con quién pidió y quién aprobó.","Each move stays in the asset history, with who requested and who approved."],"Cada pessoa pode pedir para ver ou corrigir os próprios dados (nome, e-mail, telefone, foto) pelo Suporte.":["Cada persona puede pedir ver o corregir sus propios datos (nombre, e-mail, teléfono, foto) por Soporte.","Each person can ask to see or correct their own data (name, e-mail, phone, photo) through Support."],"Cada responsável tem nome, função, WhatsApp, e-mail corporativo e substituto. O termo de cada ambiente é gerado em Termos de responsabilidade.":["Cada responsable tiene nombre, función, WhatsApp, e-mail corporativo y sustituto. El término de cada ambiente se genera en Términos de responsabilidad.","Each person in charge has name, role, WhatsApp, work e-mail and substitute. Each room's term is created in Responsibility terms."],"Cadastrar equipamentos e registrar manutenções no local, pelo celular, sem voltar ao computador.":["Registrar equipos y mantenimientos en el lugar, por el celular, sin volver a la computadora.","Register equipment and record maintenance on site, on the phone, without going back to the computer."],"Cadastre cada bem com o número da etiqueta, o nº de série e o ambiente.":["Registre cada bien con el número de etiqueta, el nº de serie y el ambiente.","Register each asset with the label number, serial no. and room."],"Cadastro de fornecedores, locadoras, comodatos, assistência técnica e empresas de calibração, com contrato e contato.":["Registro de proveedores, arrendadoras, comodatos, asistencia técnica y empresas de calibración, con contrato y contacto.","Register of suppliers, rental companies, free loans, service companies and calibration companies, with contract and contact."],"Cadastros e serviços ficam gravados com data e hora do servidor, igual ao computador.":["Registros y servicios quedan grabados con fecha y hora del servidor, igual que en la computadora.","Records and services are saved with server date and time, same as on the computer."],"Calibração ou preventiva vencendo em 30 e 7 dias: Administrador e Gestor.":["Calibración o preventiva por vencer en 30 y 7 días: Administrador y Gestor.","Calibration or preventive due in 30 and 7 days: Administrator and Manager."],"Calibrações, preventivas, corretivas e teste de segurança elétrica":["Calibraciones, preventivas, correctivas y prueba de seguridad eléctrica","Calibrations, preventive, corrective and electrical safety test"],"Casa de máquinas só para a climatização, sem materiais estranhos.":["Sala de máquinas solo para la climatización, sin materiales ajenos.","Plant room for HVAC only, no foreign materials."],"Chamado de ambiente ou bem crítico aberto pelo QR Code entra como urgente.":["Una solicitud de ambiente o bien crítico abierta por el código QR entra como urgente.","A request for a critical room or asset opened via QR code comes in as urgent."],"Chamado urgente e chamado que ninguém aceitou no prazo também avisam quem está na escala naquele horário.":["Una solicitud urgente y una que nadie aceptó en plazo también avisan a quien está de turno en ese horario.","Urgent requests and requests nobody accepted in time also notify whoever is on shift at that time."],"Chamado urgente: destaque para a manutenção e o Administrador.":["Solicitud urgente: destacada para mantenimiento y el Administrador.","Urgent request: highlighted for maintenance and the Administrator."],"Clique em Aceitar para assumir o chamado, ou Passar para outro para encaminhar a um colega.":["Haga clic en Aceptar para asumir la solicitud, o Pasar a otro para derivarla a un colega.","Click Accept to take the request, or Pass to another to forward it to a colleague."],"Clique em Concluir, tire a foto de depois e escreva o que foi feito.":["Haga clic en Concluir, saque la foto de después y escriba lo que se hizo.","Click Finish, take the after photo and write what was done."],"Clique em Finalizar: o que não foi lido fica como não localizado.":["Haga clic en Finalizar: lo que no se leyó queda como no localizado.","Click Finish: what was not scanned is marked as not found."],"Clique em Gerar lote. Os números seguem a sequência da empresa.":["Haga clic en Generar lote. Los números siguen la secuencia de la empresa.","Click Create batch. Numbers follow the company sequence."],"Clique em Responsável técnico e ART e preencha os dados do responsável e a validade da ART.":["Haga clic en Responsable técnico y ART y complete los datos del responsable y la validez de la ART.","Click Technical lead and ART and fill in the lead's data and the ART expiry."],"Clique em cada norma: resumo, artigos principais, o que é exigido e o botão que leva à tela ou ao relatório do Atalaia que atende.":["Haga clic en cada norma: resumen, artículos principales, lo que se exige y el botón que lleva a la pantalla o al informe de Atalaia que la cumple.","Click each standard: summary, main articles, what is required and the button that leads to the Atalaia screen or report that meets it."],"Clique em programar, escolha o bem, o tipo de serviço e a periodicidade.":["Haga clic en programar, elija el bien, el tipo de servicio y la periodicidad.","Click schedule, choose the asset, service type and frequency."],"Clique no ambiente para abrir resumo, chamados, inventário, calibrações, termo e relatório.":["Haga clic en el ambiente para abrir resumen, solicitudes, inventario, calibraciones, término e informe.","Click the room to open summary, requests, inventory, calibrations, term and report."],"Clique no chamado para ver a descrição, as fotos, o bem, o ambiente e a linha do tempo.":["Haga clic en la solicitud para ver la descripción, las fotos, el bien, el ambiente y la línea de tiempo.","Click the request to see the description, photos, asset, room and timeline."],"Clique no chamado para ver fotos, linha do tempo e responsável.":["Haga clic en la solicitud para ver fotos, línea de tiempo y responsable.","Click the request to see photos, timeline and assignee."],"Clique no item para abrir a ficha. “Programar” abre a programação já preenchida com a rotina sugerida que falta.":["Haga clic en el ítem para abrir la ficha. “Programar” abre la programación ya completada con la rutina sugerida que falta.","Click the item to open the sheet. “Schedule” opens the schedule already filled in with the missing suggested routine."],"Clique num ambiente para abrir o resumo: chamados, inventário, calibrações, termo de responsabilidade e relatório.":["Haga clic en un ambiente para abrir el resumen: solicitudes, inventario, calibraciones, término de responsabilidad e informe.","Click a room to open the summary: requests, inventory, calibrations, responsibility term and report."],"Clique para cadastrar uma nova filial e preencha nome, endereço e contato.":["Haga clic para registrar una nueva filial y complete nombre, dirección y contacto.","Click to register a new branch and fill in name, address and contact."],"Cobrança registrada, mas a unidade não tem e-mail do representante cadastrado.":["Cobro registrado, pero la unidad no tiene e-mail del representante registrado.","Reminder recorded, but the unit has no representative e-mail registered."],"Colocar a empresa para funcionar na ordem certa, sem esquecer nenhuma etapa de implantação.":["Poner la empresa en marcha en el orden correcto, sin olvidar ninguna etapa de implementación.","Get the company running in the right order, without missing any setup step."],"Comece por Precisa de ação hoje: chamados atrasados, sem responsável, programações e documentos vencidos. Toque em Ver para abrir cada item.":["Empiece por Requiere acción hoy: solicitudes atrasadas, sin responsable, programaciones y documentos vencidos. Toque Ver para abrir cada ítem.","Start with Needs action today: late requests, unassigned, overdue schedules and documents. Tap View to open each item."],"Comparar o que se gasta em manutenção com o valor dos equipamentos.":["Comparar lo que se gasta en mantenimiento con el valor de los equipos.","Compare maintenance spend with equipment value."],"Comprovar a capacitação da equipe técnica e dos usuários dos equipamentos.":["Comprobar la capacitación del equipo técnico y de los usuarios de los equipos.","Prove training of the technical team and equipment users."],"Confere na empresa toda, inclusive nas outras filiais, se um número de patrimônio ou de série já existe.":["Verifica en toda la empresa, incluso en las otras filiales, si un número de patrimonio o de serie ya existe.","Checks the whole company, including other branches, for an existing asset or serial number."],"Conferir se os bens estão onde o sistema diz e achar os que sumiram ou estão em outro lugar.":["Verificar si los bienes están donde el sistema dice y encontrar los que desaparecieron o están en otro lugar.","Check that assets are where the system says and find those missing or elsewhere."],"Conferência do equipamento com um padrão, feita por empresa ou técnico habilitado.":["Verificación del equipo con un patrón, hecha por empresa o técnico habilitado.","Checking equipment against a standard, done by a qualified company or technician."],"Conferência do inventário: o auditor vai ao ambiente e lê a etiqueta de cada bem com o leitor de código de barras ou com a câmera. O sistema separa localizados, de outro ambiente, sem cadastro e não localizados.":["Revisión del inventario: el auditor va al ambiente y lee la etiqueta de cada bien con el lector de código de barras o con la cámara. El sistema separa localizados, de otro ambiente, sin registro y no localizados.","Inventory check: the auditor goes to the room and scans each asset label with the barcode scanner or camera. The system splits found, from another room, unregistered and not found."],"Confira a validade e a rastreabilidade do certificado de calibração.":["Revise la validez y la trazabilidad del certificado de calibración.","Check the calibration certificate expiry and traceability."],"Confira o nº de série antes de salvar: ele identifica o bem mesmo sem etiqueta.":["Revise el nº de serie antes de guardar: identifica el bien incluso sin etiqueta.","Check the serial no. before saving: it identifies the asset even without a label."],"Confira se o segmento está preenchido em Configurações › Dados da empresa.":["Revise si el segmento está completado en Configuración › Datos de la empresa.","Check that the segment is filled in at Settings › Company data."],"Conserto de bem locado ou em comodato é de responsabilidade do dono: avise o setor responsável pelo contrato.":["La reparación de un bien alquilado o en comodato es responsabilidad del dueño: avise al sector responsable del contrato.","Repairing a rented or loaned asset is the owner's responsibility: notify the department in charge of the contract."],"Contexto e liderança: política de gestão de ativos, objetivos e papéis definidos pela direção.":["Contexto y liderazgo: política de gestión de activos, objetivos y roles definidos por la dirección.","Context and leadership: asset management policy, objectives and roles set by management."],"Controlar os equipamentos de terceiros (locação e comodato) e as empresas de assistência e calibração, com contrato.":["Controlar los equipos de terceros (alquiler y comodato) y las empresas de asistencia y calibración, con contrato.","Manage third-party equipment (rental and free loan) and service and calibration companies, with contract."],"Convites, mudanças, inativações e exclusões ficam no registro de acessos e no histórico da equipe.":["Invitaciones, cambios, inactivaciones y eliminaciones quedan en el registro de accesos y en el historial del equipo.","Invitations, changes, deactivations and deletions stay in the access log and team history."],"Copie os valores do laudo do laboratório. Deixe em branco o que não foi medido. O sistema confere com as referências (NBR 17037 / RE 9/2003) e avisa se algo estiver fora.":["Copie los valores del informe del laboratorio. Deje en blanco lo que no se midió. El sistema compara con las referencias (NBR 17037 / RE 9/2003) y avisa si algo está fuera.","Copy the values from the lab report. Leave blank what was not measured. The system checks against the references (NBR 17037 / RE 9/2003) and warns if anything is out."],"Criação e alteração das filiais ficam em Excluídos e histórico.":["La creación y modificación de las filiales quedan en Eliminados e historial.","Branch creation and changes stay in Deleted and history."],"Criação e cada alteração ficam no histórico do bem e em Excluídos e histórico.":["La creación y cada cambio quedan en el historial del bien y en Eliminados e historial.","Creation and each change stay in the asset history and in Deleted and history."],"Criticidade, cronograma, OS, SLA, indisponíveis, contingência, treinamentos, risco, indicadores com meta, tendência e análise crítica":["Criticidad, cronograma, OS, SLA, no disponibles, contingencia, capacitaciones, riesgo, indicadores con meta, tendencia y análisis crítico","Criticality, schedule, work orders, SLA, unavailable, contingency, training, risk, indicators with targets, trend and critical review"],"Cumprir o Plano de Manutenção, Operação e Controle (PMOC) dos aparelhos de ar-condicionado e acompanhar a qualidade do ar.":["Cumplir el Plan de Mantenimiento, Operación y Control (PMOC) de los aires acondicionados y seguir la calidad del aire.","Meet the Maintenance, Operation and Control Plan (PMOC) for air conditioners and track air quality."],"Código não confere. Confira se a hora do celular está automática e digite o código mais recente.":["El código no coincide. Revise si la hora del celular está en automático y escriba el código más reciente.","Code does not match. Check that the phone time is automatic and type the latest code."],"Dados pessoais da equipe da empresa não aparecem na consulta.":["Los datos personales del equipo de la empresa no aparecen en la consulta.","Personal data of the company team does not show in the view."],"Dar acesso a cada pessoa com o perfil e a unidade certos, e tirar o acesso de quem sai.":["Dar acceso a cada persona con el perfil y la unidad correctos, y quitar el acceso a quien sale.","Give each person access with the right role and unit, and remove access for whoever leaves."],"Decidir quando a equipe Atalaia System pode ver os dados da empresa para ajudar, e acompanhar os avisos dela.":["Decidir cuándo el equipo Atalaia System puede ver los datos de la empresa para ayudar, y seguir sus avisos.","Decide when the Atalaia System team can view company data to help, and follow its notices."],"Declaramos que o bem acima foi retirado do patrimônio ativo pelo motivo e com o destino informados. O registro e o histórico completo do bem continuam guardados no sistema.":["Declaramos que el bien arriba fue retirado del patrimonio activo por el motivo y con el destino informados. El registro y el historial completo del bien siguen guardados en el sistema.","We declare that the asset above was removed from active assets for the reason and with the destination stated. The record and full history of the asset remain stored in the system."],"Depois que a equipe registra o pagamento, o aviso some e, se a empresa estava em só leitura, volta ao normal na hora.":["Después de que el equipo registra el pago, el aviso desaparece y, si la empresa estaba en solo lectura, vuelve a la normalidad al instante.","Once the team records the payment, the notice goes away and, if the company was read-only, it returns to normal right away."],"Design, prazos, numeração de patrimônio, avisos, automações, modelos, grupos, perfis, conta e registro de acessos.":["Diseño, plazos, numeración de patrimonio, avisos, automatizaciones, modelos, grupos, perfiles, cuenta y registro de accesos.","Design, deadlines, asset numbering, notices, automations, templates, groups, roles, account and access log."],"Desligado: os avisos ficam só no sino do painel e do aplicativo.":["Apagado: los avisos quedan solo en la campana del panel y de la aplicación.","Off: notices stay only in the panel and app bell."],"Documentos do fornecedor (alvará, CNPJ, certificados, contrato)":["Documentos del proveedor (licencia, CNPJ, certificados, contrato)","Supplier documents (license, CNPJ, certificates, contract)"],"Duas ou mais recargas no mesmo aparelho em 6 meses indicam vazamento.":["Dos o más recargas en el mismo equipo en 6 meses indican fuga.","Two or more refills on the same unit in 6 months indicate a leak."],"Ele vai para a caixa Excluídos do Gestor, com o motivo, e continua contando na prestação de contas.":["Va a la caja Eliminados del Gestor, con el motivo, y sigue contando en la rendición de cuentas.","It goes to the Manager's Deleted box, with the reason, and still counts in accountability."],"Elogios, reclamações e sugestões pelo QR Code, com nome opcional, contados no relatório mensal.":["Elogios, reclamos y sugerencias por el código QR, con nombre opcional, contados en el informe mensual.","Compliments, complaints and suggestions via QR code, name optional, counted in the monthly report."],"Em Cadastros › Ambientes, com modelo, unidade funcional e responsável.":["En Registros › Ambientes, con modelo, unidad funcional y responsable.","In Records › Rooms, with template, functional unit and person in charge."],"Em Configurações › Dados da empresa, clique em Prestadora de serviços.":["En Configuración › Datos de la empresa, haga clic en Prestadora de servicios.","In Settings › Company data, click Service provider."],"Em Configurações › Dados da empresa, complete razão social, endereço e telefone, que saem no cabeçalho dos documentos.":["En Configuración › Datos de la empresa, complete razón social, dirección y teléfono, que salen en el encabezado de los documentos.","In Settings › Company data, fill in legal name, address and phone, shown in the document header."],"Em Equipe, defina quem é Administrador de cada filial e quem é Colaborador.":["En Equipo, defina quién es Administrador de cada filial y quién es Colaborador.","In Team, set who is Administrator of each branch and who is Technician."],"Em Normas e documentos, veja a lista de documentos que o seu segmento costuma exigir e a situação de cada um.":["En Normas y documentos, vea la lista de documentos que su segmento suele exigir y la situación de cada uno.","In Standards and documents, see the list of documents your segment usually requires and the status of each."],"Em Ocorrência, descreva o problema e tire a foto: o chamado é aberto sozinho.":["En Ocurrencia, describa el problema y saque la foto: la solicitud se abre sola.","In Issue, describe the problem and take the photo: the request opens by itself."],"Em Prazos de SLA, confira os prazos de Urgente, Média e Baixa.":["En Plazos de SLA, revise los plazos de Urgente, Media y Baja.","In SLA deadlines, check the Urgent, Medium and Low deadlines."],"Em centrais de gases, geradores e caixas d'água, registre as medições pedidas.":["En centrales de gases, generadores y tanques de agua, registre las mediciones pedidas.","At gas centers, generators and water tanks, record the requested readings."],"Em empréstimo, informe a data de devolução e registre a volta quando o bem retornar.":["En préstamo, informe la fecha de devolución y registre la vuelta cuando el bien regrese.","For a loan, enter the return date and record the return when the asset comes back."],"Empresas, contratos e equipamentos ligados ficam registrados.":["Empresas, contratos y equipos vinculados quedan registrados.","Companies, contracts and linked equipment are recorded."],"Emprestou o acesso ou esqueceu a conta aberta em outro computador? Use “Sair de todos os aparelhos”: todos precisarão entrar de novo. Depois, troque a senha.":["¿Prestó el acceso u olvidó la cuenta abierta en otra computadora? Use “Salir de todos los dispositivos”: todos deberán entrar de nuevo. Después, cambie la contraseña.","Lent your access or left the account open on another computer? Use “Sign out of all devices”: everyone will need to sign in again. Then change the password."],"Enquanto o acesso estiver ativo, o Dashboard mostra até quando vale e quantas consultas foram feitas. Toque em Encerrar agora quando quiser.":["Mientras el acceso esté activo, el Dashboard muestra hasta cuándo vale y cuántas consultas se hicieron. Toque Finalizar ahora cuando quiera.","While access is active, the Dashboard shows until when it lasts and how many views were made. Tap End now whenever you want."],"Ensaio recorrente e ensaio após reparo de equipamentos eletromédicos: inspeção visual, aterramento, isolamento, correntes de fuga e ensaio funcional. Os limites usados pelo Atalaia seguem esta norma.":["Ensayo recurrente y ensayo después de la reparación de equipos electromédicos: inspección visual, puesta a tierra, aislamiento, corrientes de fuga y ensayo funcional. Los límites usados por Atalaia siguen esta norma.","Recurrent test and post-repair test of medical electrical equipment: visual inspection, grounding, insulation, leakage currents and functional test. The limits used by Atalaia follow this standard."],"Entradas, saídas (ligadas ao chamado ou ao equipamento) e ajustes de contagem. O saldo só muda pelos movimentos, e nenhum movimento é apagado.":["Entradas, salidas (vinculadas a la solicitud o al equipo) y ajustes de conteo. El saldo solo cambia por los movimientos, y ningún movimiento se borra.","Entries, exits (linked to the request or equipment) and count adjustments. The balance changes only through movements, and no movement is deleted."],"Entre no painel com e-mail, senha e, se pedido, o código de duas etapas.":["Entre al panel con e-mail, contraseña y, si se pide, el código de dos pasos.","Sign in to the panel with e-mail, password and, if asked, the two-step code."],"Entre no painel pelo celular. No alto aparecem os botões Ler QR / etiqueta, + Bem e + Serviço.":["Entre al panel por el celular. Arriba aparecen los botones Leer QR / etiqueta, + Bien y + Servicio.","Sign in to the panel on the phone. At the top are the Scan QR / label, + Asset and + Service buttons."],"Enviar aviso ao Administrador desta unidade para fazer a ronda?":["¿Enviar aviso al Administrador de esta unidad para hacer la ronda?","Send a notice to this unit's Administrator to do the round?"],"Envie: o pedido vai para aprovação, conforme a regra da empresa.":["Envíe: el pedido va a aprobación, según la regla de la empresa.","Send: the request goes for approval, per company rule."],"Equipamento CRÍTICO com calibração ou TSE vencido fica INDISPONÍVEL sozinho":["Un equipo CRÍTICO con calibración o TSE vencido queda NO DISPONIBLE solo","CRITICAL equipment with overdue calibration or electrical safety test becomes UNAVAILABLE automatically"],"Equipamento reprovado não deve voltar ao uso antes da correção.":["Un equipo reprobado no debe volver al uso antes de la corrección.","Failed equipment must not return to use before it is fixed."],"Equipamentos e serviços de terceiros: contratos, vistorias, chamados à locadora e conferência de faturas.":["Equipos y servicios de terceros: contratos, inspecciones, solicitudes a la arrendadora y revisión de facturas.","Third-party equipment and services: contracts, inspections, requests to the rental company and invoice checks."],"Escolha o tipo, preencha o checklist, o serviço executado, as peças trocadas e os instrumentos usados, anexe as fotos de antes e depois e toque em Registrar.":["Elija el tipo, complete la lista de verificación, el servicio ejecutado, las piezas cambiadas y los instrumentos usados, adjunte las fotos de antes y después y toque Registrar.","Choose the type, fill in the checklist, the work done, the parts replaced and the instruments used, attach before and after photos and tap Record."],"Escolha uma pessoa: chamados que atendeu e abriu, rondas, auditorias e serviços no período":["Elija una persona: solicitudes que atendió y abrió, rondas, auditorías y servicios en el período","Choose a person: requests handled and opened, rounds, audits and services in the period"],"Escreva o serviço executado, registre as peças trocadas (do estoque, compradas ou do cliente) e marque os instrumentos de medição usados.":["Escriba el servicio ejecutado, registre las piezas cambiadas (del inventario, compradas o del cliente) y marque los instrumentos de medición usados.","Write the work done, record the parts replaced (from stock, bought or client's) and tick the measuring instruments used."],"Esta pessoa já entrou no sistema. Para não perder o histórico, use Inativar.":["Esta persona ya entró al sistema. Para no perder el historial, use Inactivar.","This person has already signed in. To keep the history, use Deactivate."],"Estas regras são travadas no servidor. A equipe Atalaia System só vê os dados com acesso de suporte autorizado pelo Gestor, por tempo limitado e registrado.":["Estas reglas están bloqueadas en el servidor. El equipo Atalaia System solo ve los datos con acceso de soporte autorizado por el Gestor, por tiempo limitado y registrado.","These rules are locked on the server. The Atalaia System team only sees data with support access authorized by the Manager, for a limited, logged time."],"Este chamado já foi avisado há menos de 1 hora. Tente de novo mais tarde.":["Esta solicitud ya fue avisada hace menos de 1 hora. Intente de nuevo más tarde.","This request was already notified less than 1 hour ago. Try again later."],"Este equipamento já tem esse tipo de serviço programado. Use Editar.":["Este equipo ya tiene ese tipo de servicio programado. Use Editar.","This equipment already has this type of service scheduled. Use Edit."],"Este módulo está sendo ligado ao banco de dados, um por vez, igual ao protótipo. Seu plano já inclui esta função.":["Este módulo se está conectando a la base de datos, uno por vez, igual que el prototipo. Su plan ya incluye esta función.","This module is being connected to the database, one at a time, like the prototype. Your plan already includes this feature."],"Este navegador não abre .xlsx. Salve a planilha como CSV e tente de novo.":["Este navegador no abre .xlsx. Guarde la planilla como CSV e intente de nuevo.","This browser cannot open .xlsx. Save the spreadsheet as CSV and try again."],"Evento adverso grave tem prazo de notificação: siga as regras da Anvisa.":["Un evento adverso grave tiene plazo de notificación: siga las reglas de Anvisa.","A serious adverse event has a reporting deadline: follow Anvisa rules."],"Ex.: só locados da empresa X · só próprios · completo (tudo em branco)":["Ej.: solo alquilados de la empresa X · solo propios · completo (todo en blanco)","E.g.: only rented from company X · only own · complete (all blank)"],"Excelência: análise crítica dos resultados e ações de melhoria.":["Excelencia: análisis crítico de los resultados y acciones de mejora.","Excellence: critical review of results and improvement actions."],"Extintores, iluminação de emergência, portas corta-fogo, quadros elétricos, SPDA, caixa d'água, telhado, hidrantes, bombas":["Extintores, iluminación de emergencia, puertas cortafuego, tableros eléctricos, SPDA, tanque de agua, techo, hidrantes, bombas","Extinguishers, emergency lighting, fire doors, electrical panels, lightning protection, water tank, roof, hydrants, pumps"],"Fale com a equipe do Atalaia System para mudar de plano. Tudo o que você já cadastrou continua no sistema.":["Hable con el equipo de Atalaia System para cambiar de plan. Todo lo que ya registró sigue en el sistema.","Talk to the Atalaia System team to change plans. Everything you registered stays in the system."],"Faça o serviço. Se usar peça do estoque, registre a saída ligada ao chamado.":["Haga el servicio. Si usa una pieza del inventario, registre la salida vinculada a la solicitud.","Do the work. If you use a stock part, record the exit linked to the request."],"Feche o ambiente e siga para o próximo até concluir o roteiro.":["Cierre el ambiente y siga al próximo hasta concluir el recorrido.","Close the room and move to the next until the route is done."],"Feriados estaduais e municipais: cadastre pela lista acima. Confira as datas no calendário oficial do seu município.":["Feriados estatales y municipales: regístrelos con la lista de arriba. Revise las fechas en el calendario oficial de su municipio.","State and city holidays: register them in the list above. Check the dates in your city's official calendar."],"Fica registrado quem cancelou, quando e o motivo. Destrua as folhas já impressas deste lote.":["Queda registrado quién canceló, cuándo y el motivo. Destruya las hojas ya impresas de este lote.","Who canceled, when and why is recorded. Destroy the sheets already printed from this batch."],"Ficam guardados por 5 anos e não podem ser apagados. Arquivo em PDF ou foto, até 2 MB.":["Quedan guardados por 5 años y no pueden borrarse. Archivo en PDF o foto, hasta 2 MB.","Kept for 5 years and cannot be deleted. File in PDF or photo, up to 2 MB."],"Fila do dia com prazo, tabelas densas, ícone e texto junto da cor. Para a equipe de manutenção.":["Fila del día con plazo, tablas densas, ícono y texto junto al color. Para el equipo de mantenimiento.","Day queue with deadlines, dense tables, icon and text next to color. For the maintenance team."],"Finalizar a auditoria? Os bens que não foram lidos ficam como não localizados.":["¿Finalizar la auditoría? Los bienes que no se leyeron quedan como no localizados.","Finish the audit? Assets not scanned will be marked not found."],"Fixar na entrada de cada ambiente para abrir chamados e o Avalie.":["Fijar en la entrada de cada ambiente para abrir solicitudes y Evalúe.","Fix at each room entrance to open requests and Feedback."],"Gerar os números de patrimônio da própria empresa, com a sigla dela, e imprimir as etiquetas.":["Generar los números de patrimonio de la propia empresa, con su sigla, e imprimir las etiquetas.","Create the company's own asset numbers, with its code, and print the labels."],"Gere e imprima as etiquetas de patrimônio e cadastre os bens.":["Genere e imprima las etiquetas de patrimonio y registre los bienes.","Create and print asset labels and register the assets."],"Gere um lote de etiquetas em Etiquetas de patrimônio e imprima em A4.":["Genere un lote de etiquetas en Etiquetas de patrimonio e imprima en A4.","Create a label batch in Asset labels and print on A4."],"Gestão de riscos e notificação de eventos adversos e queixas técnicas.":["Gestión de riesgos y notificación de eventos adversos y quejas técnicas.","Risk management and reporting of adverse events and technical complaints."],"Guardar e acompanhar alvarás, licenças, laudos e planos que o segmento da empresa costuma exigir.":["Guardar y seguir licencias, permisos, informes y planes que el segmento de la empresa suele exigir.","Keep and track licenses, permits, reports and plans the company segment usually requires."],"Histórico importado de sistema antigo aparece marcado como importado.":["El historial importado de un sistema antiguo aparece marcado como importado.","History imported from an old system is marked as imported."],"Hoje os avisos já aparecem no sino do painel. O envio por notificação no celular e por e-mail entra junto com o aplicativo do colaborador.":["Hoy los avisos ya aparecen en la campana del panel. El envío por notificación en el celular y por e-mail llega junto con la aplicación del colaborador.","Today notices already show in the panel bell. Phone notifications and e-mail come together with the technician app."],"Há itens do checklist marcados como “Não OK” e o resultado está “Aprovado”. Registrar assim mesmo?":["Hay ítems de la lista de verificación marcados como “No OK” y el resultado está “Aprobado”. ¿Registrar de todos modos?","Some checklist items are “Not OK” and the result is “Approved”. Record anyway?"],"ISO 55001:2024 (gestão de ativos) · ONA (indicadores de manutenção)":["ISO 55001:2024 (gestión de activos) · ONA (indicadores de mantenimiento)","ISO 55001:2024 (asset management) · ONA (maintenance indicators)"],"Importação errada pode ser desfeita nas primeiras 24 horas. Depois disso, ela fica no histórico.":["Una importación errónea puede deshacerse en las primeras 24 horas. Después, queda en el historial.","A wrong import can be undone in the first 24 hours. After that, it stays in the history."],"Informe a quantidade e o modelo da folha A4 e clique em Gerar lote.":["Informe la cantidad y el modelo de la hoja A4 y haga clic en Generar lote.","Enter the quantity and A4 sheet model and click Create batch."],"Informe nome e e-mail e escolha o perfil (Administrador, Colaborador ou Cliente só consulta) e a unidade.":["Informe nombre y e-mail y elija el perfil (Administrador, Colaborador o Cliente solo consulta) y la unidad.","Enter name and e-mail and choose the role (Administrator, Technician or view-only Client) and the unit."],"Inspecionar todos os ambientes no roteiro e transformar cada ocorrência em chamado.":["Inspeccionar todos los ambientes del recorrido y transformar cada ocurrencia en solicitud.","Inspect every room on the route and turn each issue into a request."],"Inspeção visual: gabinete, cabo, plugue, fusíveis e marcações":["Inspección visual: gabinete, cable, enchufe, fusibles y marcas","Visual inspection: housing, cord, plug, fuses and markings"],"Instrumentos da equipe (manômetro, termômetro, multímetro…) com o certificado de calibração. Certificado vencido não deve ser usado.":["Instrumentos del equipo (manómetro, termómetro, multímetro…) con el certificado de calibración. Un certificado vencido no debe usarse.","Team instruments (pressure gauge, thermometer, multimeter…) with calibration certificate. An expired certificate must not be used."],"Inventário com leitor de QR Code e etiquetas de patrimônio geradas por lote, em folha A4.":["Inventario con lector de código QR y etiquetas de patrimonio generadas por lote, en hoja A4.","Inventory with QR code scanner and asset labels created in batches, on A4 sheets."],"Inventário regulatório, preventiva x realizado, corretiva, calibração e TSE, treinamentos, tecnovigilância, terceirizados, indicadores e avaliação anual":["Inventario regulatorio, preventiva vs. realizado, correctiva, calibración y TSE, capacitaciones, tecnovigilancia, tercerizados, indicadores y evaluación anual","Regulatory inventory, preventive vs. done, corrective, calibration and electrical safety, training, technovigilance, outsourced, indicators and yearly assessment"],"Início e fim da ronda, itens marcados, fotos e medições ficam gravados com a hora do servidor.":["Inicio y fin de la ronda, ítems marcados, fotos y mediciones quedan grabados con la hora del servidor.","Round start and end, ticked items, photos and readings are saved with server time."],"Item “Não OK” ou medição fora da faixa no checklist de preventiva ou calibração abre um chamado de corretiva sozinho, com os itens e os valores medidos.":["Un ítem “No OK” o una medición fuera del rango en la lista de preventiva o calibración abre una solicitud correctiva sola, con los ítems y los valores medidos.","A “Not OK” item or out-of-range reading in a preventive or calibration checklist opens a corrective request automatically, with the items and values measured."],"LGPD: baixar todos os dados e ver os acessos de suporte da equipe Atalaia System.":["LGPD: descargar todos los datos y ver los accesos de soporte del equipo Atalaia System.","LGPD: download all data and see Atalaia System team support access."],"Laudo, certificado, ordem de serviço ou fotos de antes e depois (pode escolher vários · PDF ou foto, até 2 MB cada)":["Informe, certificado, orden de servicio o fotos de antes y después (puede elegir varios · PDF o foto, hasta 2 MB cada uno)","Report, certificate, work order or before and after photos (you can pick several · PDF or photo, up to 2 MB each)"],"Lei 13.589/2018 (PMOC) · RDC Anvisa 222/2018, 509/2021 e 611/2022 · NBR 5419 · NR-10 · NR-13":["Ley 13.589/2018 (PMOC) · RDC Anvisa 222/2018, 509/2021 y 611/2022 · NBR 5419 · NR-10 · NR-13","Law 13,589/2018 (PMOC) · RDC Anvisa 222/2018, 509/2021 and 611/2022 · NBR 5419 · NR-10 · NR-13"],"Lei 13.589/2018 · Portaria GM/MS 3.523/1998 · documento gerado pelo Atalaia System em":["Ley 13.589/2018 · Portaria GM/MS 3.523/1998 · documento generado por Atalaia System el","Law 13,589/2018 · Ordinance GM/MS 3.523/1998 · document created by Atalaia System on"],"Leia a etiqueta com o leitor ou digite o patrimônio e aperte Enter":["Lea la etiqueta con el lector o escriba el patrimonio y presione Enter","Scan the label or type the asset no. and press Enter"],"Leia o QR Code fixado na entrada do ambiente com a câmera do celular.":["Lea el código QR fijado en la entrada del ambiente con la cámara del celular.","Scan the QR code at the room entrance with the phone camera."],"Leia o comunicado no alto do Dashboard (ou do aplicativo) e toque em Li, pode esconder.":["Lea el comunicado arriba del Dashboard (o de la aplicación) y toque Leído, puede ocultar.","Read the announcement at the top of the Dashboard (or app) and tap Read, hide it."],"Leia os comunicados da equipe Atalaia System no alto da tela e toque em Li, pode esconder.":["Lea los comunicados del equipo Atalaia System arriba de la pantalla y toque Leído, puede ocultar.","Read the Atalaia System team announcements at the top of the screen and tap Read, hide it."],"Ligado: os técnicos podem criar ambientes, cadastrar equipamentos e registrar serviços pelo app.":["Activado: los técnicos pueden crear ambientes, registrar equipos y registrar servicios por la app.","On: technicians can create rooms, register equipment and record services in the app."],"Ligar o modo prestadora? As unidades passam a ser chamadas de clientes. Nada é apagado.":["¿Activar el modo prestadora? Las unidades pasan a llamarse clientes. No se borra nada.","Turn on service provider mode? Units will be called clients. Nothing is deleted."],"Limite de fotos do plano atingido. Tire uma para colocar outra.":["Límite de fotos del plan alcanzado. Quite una para poner otra.","Plan photo limit reached. Remove one to add another."],"Lista com identificação, localização e situação de cada equipamento.":["Lista con identificación, ubicación y situación de cada equipo.","List with identification, location and status of each equipment."],"Mais detalhes (empresa, custo, certificado, validade, técnico)":["Más detalles (empresa, costo, certificado, validez, técnico)","More details (company, cost, certificate, expiry, technician)"],"Mais detalhes (valor, compra, vida útil, criticidade, registro Anvisa…)":["Más detalles (valor, compra, vida útil, criticidad, registro Anvisa…)","More details (value, purchase, service life, criticality, Anvisa registration…)"],"Manter em dia os serviços periódicos de cada equipamento, com laudo anexado e próxima data calculada.":["Mantener al día los servicios periódicos de cada equipo, con informe adjunto y próxima fecha calculada.","Keep each equipment's periodic services up to date, with report attached and next date calculated."],"Manter limpos bandejas, serpentinas, umidificadores, ventiladores e dutos.":["Mantener limpios bandejas, serpentinas, humidificadores, ventiladores y ductos.","Keep trays, coils, humidifiers, fans and ducts clean."],"Manter o inventário completo e correto: cada bem no seu ambiente, com etiqueta, série e responsável.":["Mantener el inventario completo y correcto: cada bien en su ambiente, con etiqueta, serie y responsable.","Keep the inventory complete and correct: each asset in its room, with label, serial and person in charge."],"Mapa dos ambientes com a situação de cada um em tempo real: chamados abertos, atrasados e equipamentos parados.":["Mapa de los ambientes con la situación de cada uno en tiempo real: solicitudes abiertas, atrasadas y equipos parados.","Room map with each one's status in real time: open and late requests and equipment down."],"Marque cada item. Ocorrência precisa de descrição e abre um chamado.":["Marque cada ítem. Una ocurrencia necesita descripción y abre una solicitud.","Tick each item. An issue needs a description and opens a request."],"Marque o que quer ver e use as setas para mudar a ordem. Fica guardado neste aparelho.":["Marque lo que quiere ver y use las flechas para cambiar el orden. Queda guardado en este dispositivo.","Tick what you want to see and use the arrows to reorder. Saved on this device."],"Marque um, vários ou todos os filtrados. O filtro vale para os relatórios e para a saúde dos equipamentos até você limpar.":["Marque uno, varios o todos los filtrados. El filtro vale para los informes y la salud de los equipos hasta que lo limpie.","Tick one, several or all filtered. The filter applies to reports and equipment health until you clear it."],"Melhoria: não conformidade, ação corretiva e melhoria contínua.":["Mejora: no conformidad, acción correctiva y mejora continua.","Improvement: nonconformity, corrective action and continual improvement."],"Mensagem e resposta ficam registradas e não podem ser apagadas.":["Mensaje y respuesta quedan registrados y no pueden borrarse.","Message and reply are recorded and cannot be deleted."],"Mesmo com a opção acima ligada, o urgente não para à noite, no fim de semana nem no feriado.":["Incluso con la opción de arriba activada, lo urgente no se detiene de noche, el fin de semana ni en feriados.","Even with the option above on, urgent does not pause at night, on weekends or holidays."],"Modo prestadora ligado: as unidades agora são os seus clientes.":["Modo prestadora activado: las unidades ahora son sus clientes.","Service provider mode on: units are now your clients."],"Mostrar os modelos hospitalares (enfermaria, UTI, centro cirúrgico, central de gases, geradores, QGBT)":["Mostrar los modelos hospitalarios (enfermería, UCI, centro quirúrgico, central de gases, generadores, tablero general)","Show hospital templates (ward, ICU, operating room, gas center, generators, main switchboard)"],"Mostrar todas as funções no menu, mesmo as escondidas pelo perfil":["Mostrar todas las funciones en el menú, incluso las ocultas por el perfil","Show all features in the menu, even those hidden by the profile"],"Muda as cores, a fonte e a logo do Painel do Gestor para todos os usuários da empresa.":["Cambia los colores, la fuente y el logo del Panel del Gestor para todos los usuarios de la empresa.","Changes the colors, font and logo of the Manager Panel for all company users."],"Mudança de bens entre ambientes e entre unidades. Na mesma unidade, vale na hora. Entre unidades, o Gestor aprova. O empréstimo tem data de devolução.":["Movimiento de bienes entre ambientes y entre unidades. En la misma unidad, vale al instante. Entre unidades, el Gestor aprueba. El préstamo tiene fecha de devolución.","Moving assets between rooms and units. Within the same unit, it is immediate. Between units, the Manager approves. Loans have a return date."],"Mudança de modo e dados dos clientes ficam no registro de acessos.":["El cambio de modo y los datos de los clientes quedan en el registro de accesos.","Mode changes and client data stay in the access log."],"Mudanças de prazo valem para os chamados abertos depois da mudança.":["Los cambios de plazo valen para las solicitudes abiertas después del cambio.","Deadline changes apply to requests opened after the change."],"Mês fechado: chamados, prazos, serviços, rondas e Avalie são do mês escolhido. “Bens que pedem atenção” mostra a situação atual.":["Mes cerrado: solicitudes, plazos, servicios, rondas y Evalúe son del mes elegido. “Bienes que requieren atención” muestra la situación actual.","Closed month: requests, deadlines, services, rounds and Feedback are for the chosen month. “Assets needing attention” shows the current status."],"Na aba Ambientes e chamados, veja a cor de cada ambiente: ela mostra chamados abertos, atrasos e pendências.":["En la pestaña Ambientes y solicitudes, vea el color de cada ambiente: muestra solicitudes abiertas, atrasos y pendientes.","In the Rooms and requests tab, see each room's color: it shows open requests, delays and open items."],"Na foto do canto de cima, troque a sua foto e confira a sua conta.":["En la foto de la esquina superior, cambie su foto y revise su cuenta.","In the photo at the top corner, change your photo and check your account."],"Na implantação e sempre que abrir, fechar ou mudar uma filial.":["En la implementación y siempre que abra, cierre o cambie una filial.","At setup and whenever a branch opens, closes or changes."],"Na implantação, a cada compra ou recebimento de bem e sempre que um dado mudar.":["En la implementación, en cada compra o recepción de bien y siempre que un dato cambie.","At setup, at each asset purchase or receipt and whenever data changes."],"Na implantação, a cada preventiva, recarga de gás e laudo de qualidade do ar.":["En la implementación, en cada preventiva, recarga de gas e informe de calidad del aire.","At setup, at each preventive job, gas refill and air quality report."],"Na implantação, a cada renovação e quando aparecer aviso de vencimento.":["En la implementación, en cada renovación y cuando aparezca aviso de vencimiento.","At setup, at each renewal and when an expiry notice shows."],"Na tabela Clientes, clique em Editar e preencha segmento, contrato, vigência e contato.":["En la tabla Clientes, haga clic en Editar y complete segmento, contrato, vigencia y contacto.","In the Clients table, click Edit and fill in segment, contract, term and contact."],"Nada é apagado de verdade. Aqui ficam os itens excluídos de todas as unidades, com quem excluiu, quando e o motivo, e o histórico de criações e alterações. Só o Gestor vê esta tela.":["Nada se borra de verdad. Aquí quedan los ítems eliminados de todas las unidades, con quién eliminó, cuándo y el motivo, y el historial de creaciones y cambios. Solo el Gestor ve esta pantalla.","Nothing is really deleted. Here are deleted items from all units, with who deleted, when and why, plus the history of creations and changes. Only the Manager sees this screen."],"Nada é apagado de verdade: vai para Excluídos e histórico do Gestor, por unidade.":["Nada se borra de verdad: va a Eliminados e historial del Gestor, por unidad.","Nothing is really deleted: it goes to the Manager's Deleted and history, by unit."],"Nenhum instrumento cadastrado. Cadastre manômetro, termômetro, alicate amperímetro, anemômetro… em":["Ningún instrumento registrado. Registre manómetro, termómetro, pinza amperimétrica, anemómetro… en","No instruments registered. Register pressure gauge, thermometer, clamp meter, anemometer… in"],"Nenhum marcado como eletromédico/registro ANVISA: lista todos os bens":["Ninguno marcado como electromédico/registro ANVISA: lista todos los bienes","None marked as medical electrical/ANVISA registered: listing all assets"],"Nenhum registro ao consultar. Documentos enviados ficam guardados com data, validade e quem enviou.":["Ningún registro al consultar. Los documentos enviados quedan guardados con fecha, validez y quién los envió.","No record when viewing. Uploaded documents are kept with date, expiry and who uploaded them."],"Nenhum registro novo: a pontuação é calculada pelos dados do sistema.":["Ningún registro nuevo: el puntaje se calcula con los datos del sistema.","No new records: the score is calculated from system data."],"Nenhum registro novo: a tela soma os custos lançados nos serviços.":["Ningún registro nuevo: la pantalla suma los costos cargados en los servicios.","No new records: the screen adds up the costs entered in services."],"Nenhum registro novo: o Dashboard só lê os dados. O PDF baixado fica no registro de acessos.":["Ningún registro nuevo: el Dashboard solo lee los datos. El PDF descargado queda en el registro de accesos.","No new records: the Dashboard only reads data. The downloaded PDF goes to the access log."],"Nenhuma calibração ou preventiva programada. Programe em “Calibrações, preventivas, corretivas e teste de segurança elétrica”.":["Ninguna calibración o preventiva programada. Programe en “Calibraciones, preventivas, correctivas y prueba de seguridad eléctrica”.","No calibration or preventive scheduled. Schedule in “Calibrations, preventive, corrective and electrical safety test”."],"Ninguém aceitou no prazo → avisa o Administrador da unidade. Passou do prazo de solução → avisa o Gestor.":["Nadie aceptó en plazo → avisa al Administrador de la unidad. Pasó el plazo de solución → avisa al Gestor.","Nobody accepted in time → notifies the unit Administrator. Resolution deadline passed → notifies the Manager."],"No ambiente, leia a etiqueta de cada bem com o leitor de código de barras ou a câmera.":["En el ambiente, lea la etiqueta de cada bien con el lector de código de barras o la cámara.","In the room, scan each asset label with the barcode scanner or camera."],"No fim do contrato, a empresa baixa os dados aqui. Depois do prazo combinado em contrato, a equipe Atalaia apaga os dados e registra a exclusão.":["Al final del contrato, la empresa descarga los datos aquí. Después del plazo acordado en el contrato, el equipo Atalaia borra los datos y registra la eliminación.","At contract end, the company downloads its data here. After the period agreed in the contract, the Atalaia team deletes the data and logs the deletion."],"No iPhone o navegador pode não ler código pela câmera: digite o número da etiqueta.":["En el iPhone el navegador puede no leer códigos por la cámara: escriba el número de la etiqueta.","On iPhone the browser may not scan codes with the camera: type the label number."],"No primeiro acesso, a senha provisória precisa ser trocada pelo aplicativo.":["En el primer acceso, la contraseña provisoria debe cambiarse por la aplicación.","On first sign-in, the temporary password must be changed in the app."],"Nome e CNPJ da empresa contratante são do contrato: para mudar, fale com a equipe do Atalaia System.":["Nombre y CNPJ de la empresa contratante son del contrato: para cambiarlos, hable con el equipo de Atalaia System.","Customer company name and CNPJ come from the contract: to change them, talk to the Atalaia System team."],"Nome e CNPJ da empresa contratante só mudam pela equipe do Atalaia System.":["Nombre y CNPJ de la empresa contratante solo los cambia el equipo de Atalaia System.","Customer company name and CNPJ are changed only by the Atalaia System team."],"Norma orientadora 35 · Avaliação de serviços terceirizados (gratuita)":["Norma orientadora 35 · Evaluación de servicios tercerizados (gratuita)","Guidance standard 35 · Outsourced services assessment (free)"],"Norma paga: página da norma para compra (o texto completo não é público)":["Norma paga: página de la norma para compra (el texto completo no es público)","Paid standard: standard page for purchase (full text is not public)"],"Normas pagas: página da NBR 7256 para compra (as outras no Catálogo ABNT)":["Normas pagas: página de la NBR 7256 para compra (las otras en el Catálogo ABNT)","Paid standards: NBR 7256 page for purchase (the others in the ABNT Catalog)"],"Normas que a empresa precisa cumprir, com resumo em linguagem simples. O texto oficial deve ser sempre conferido no site do órgão.":["Normas que la empresa debe cumplir, con resumen en lenguaje simple. El texto oficial debe revisarse siempre en el sitio del organismo.","Standards the company must meet, with a plain-language summary. Always check the official text on the agency website."],"Nota de 0 a 100 de cada bem, MTTR, MTBF e disponibilidade. Use o filtro de equipamentos para ver um, vários ou um tipo":["Nota de 0 a 100 de cada bien, MTTR, MTBF y disponibilidad. Use el filtro de equipos para ver uno, varios o un tipo","Score from 0 to 100 for each asset, MTTR, MTBF and availability. Use the equipment filter to see one, several or a type"],"Nota de 0 a 100: preventiva em dia, chamados, não conformidades, recargas de gás, vida útil e indisponibilidade. Clique no aparelho para abrir a ficha.":["Nota de 0 a 100: preventiva al día, solicitudes, no conformidades, recargas de gas, vida útil y no disponibilidad. Haga clic en el equipo para abrir la ficha.","Score from 0 to 100: preventive up to date, requests, nonconformities, gas refills, service life and downtime. Click the unit to open its sheet."],"Notifique a Anvisa pelo sistema oficial e registre o número da notificação.":["Notifique a Anvisa por el sistema oficial y registre el número de la notificación.","Report to Anvisa through the official system and record the notification number."],"Não foi possível abrir a câmera. Libere o acesso à câmera no navegador ou digite o número abaixo.":["No fue posible abrir la cámara. Habilite el acceso a la cámara en el navegador o escriba el número abajo.","Could not open the camera. Allow camera access in the browser or type the number below."],"Não foi possível carregar o gerador de etiquetas. Confira a internet.":["No fue posible cargar el generador de etiquetas. Revise internet.","Could not load the label generator. Check the internet."],"Não guardamos dados de pacientes: os campos pedem para não escrever nomes de pacientes.":["No guardamos datos de pacientes: los campos piden no escribir nombres de pacientes.","We do not keep patient data: fields ask you not to write patient names."],"Não há etiquetas livres. Gere um lote em Etiquetas de patrimônio.":["No hay etiquetas libres. Genere un lote en Etiquetas de patrimonio.","No free labels. Create a batch in Asset labels."],"Não pule a etapa de ambientes: bens, QR Codes e rondas dependem deles.":["No salte la etapa de ambientes: bienes, códigos QR y rondas dependen de ellos.","Do not skip the rooms step: assets, QR codes and rounds depend on them."],"Núcleo de Segurança do Paciente e notificação de eventos adversos.":["Núcleo de Seguridad del Paciente y notificación de eventos adversos.","Patient Safety Unit and adverse event reporting."],"Número de patrimônio: padrão do número antes do primeiro lote de etiquetas.":["Número de patrimonio: formato del número antes del primer lote de etiquetas.","Asset number: number format before the first label batch."],"O Administrador pede acesso só para colaboradores da sua filial.":["El Administrador pide acceso solo para colaboradores de su filial.","The Administrator requests access only for technicians of their branch."],"O Gestor confere o Resumo por unidade e clica no nome de uma unidade para ver o Dashboard só dela.":["El Gestor revisa el Resumen por unidad y hace clic en el nombre de una unidad para ver el Dashboard solo de ella.","The Manager checks the Summary by unit and clicks a unit name to see its Dashboard only."],"O Gestor convida Administradores e Colaboradores de qualquer unidade.":["El Gestor invita a Administradores y Colaboradores de cualquier unidad.","The Manager invites Administrators and Technicians from any unit."],"O Gestor marca Não se aplica quando o documento não vale para a empresa.":["El Gestor marca No aplica cuando el documento no vale para la empresa.","The Manager marks Not applicable when the document does not apply to the company."],"O Gestor principal da empresa não pode ser inativado. Para trocar, a empresa pede à equipe do Atalaia System.":["El Gestor principal de la empresa no puede inactivarse. Para cambiarlo, la empresa lo pide al equipo de Atalaia System.","The company's main Manager cannot be deactivated. To change it, the company asks the Atalaia System team."],"O acesso é bloqueado na hora, no painel e no app. Nada do que a pessoa fez é apagado, e dá para reativar depois.":["El acceso se bloquea al instante, en el panel y en la app. Nada de lo que la persona hizo se borra, y se puede reactivar después.","Access is blocked right away, on the panel and the app. Nothing the person did is deleted, and they can be reactivated later."],"O aplicativo é o mesmo para Gestor, Administrador e Colaborador. Cada pessoa entra com o próprio e-mail e senha e vê só o que o perfil dela permite.":["La aplicación es la misma para Gestor, Administrador y Colaborador. Cada persona entra con su propio e-mail y contraseña y ve solo lo que su perfil permite.","The app is the same for Manager, Administrator and Technician. Each person signs in with their own e-mail and password and sees only what their role allows."],"O chamado continua aberto e aparece nos pendentes. O tempo parado fica registrado separado.":["La solicitud sigue abierta y aparece en los pendientes. El tiempo detenido queda registrado aparte.","The request stays open and shows among pending items. The paused time is recorded separately."],"O cliente só vê a unidade dele e não altera nada nem baixa relatórios.":["El cliente solo ve su unidad y no cambia nada ni descarga informes.","The client sees only their unit and cannot change anything or download reports."],"O contratante gera os próprios números de patrimônio, com a sua sigla e sequência a partir de 0001, imprime em folha A4 e controla o que foi usado, sem empresa terceirizada.":["El contratante genera sus propios números de patrimonio, con su sigla y secuencia desde 0001, imprime en hoja A4 y controla lo usado, sin empresa tercerizada.","The customer creates its own asset numbers, with its code and sequence from 0001, prints on A4 sheets and tracks what was used, without an outsi
