function falha(msg,obj){msg=String(msg||"Não foi possível concluir.");if(obj)obj.erro=msg;else E.msg=["err",msg];
  const box=document.querySelector(".modal .card")||document.querySelector("main")||document.querySelector("#app");if(!box)return;
  let el=box.querySelector(".msg.err.fx");if(!el){el=document.createElement("div");el.className="msg err fx";el.setAttribute("role","alert");const fm=box.querySelector("form");const h=box.querySelector("h2,h1");if(fm&&fm.parentNode)fm.parentNode.insertBefore(el,fm);else if(h&&h.parentNode)h.parentNode.insertBefore(el,h.nextSibling);else box.prepend(el)}
  box.querySelectorAll(".msg.err:not(.fx)").forEach(x=>{if(x.textContent.trim()==msg.trim())x.remove()});
  el.innerHTML="⚠ "+String(msg).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'<div style="font-size:.8rem;margin-top:4px;opacity:.85">O que você já preencheu continua na tela. Corrija e tente de novo.</div>';
  box.querySelectorAll("button[disabled]").forEach(b=>{const t=b.textContent.trim();if(/…$/.test(t)){b.disabled=false;b.textContent=t.replace(/ando…$/,"ar").replace(/endo…$/,"er").replace(/indo…$/,"ir").replace(/…$/,"")}});
  box.querySelectorAll(".campo-erro").forEach(x=>x.classList.remove("campo-erro"));
  const low=msg.toLowerCase();let alvo=null;
  const LB=[...box.querySelectorAll("label")].map(l=>({l,f:l.querySelector("input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea"),t:(l.childNodes[0]&&l.childNodes[0].textContent||"").replace(/\*|\(.*?\)|:/g,"").trim().toLowerCase()})).filter(x=>x.f);
  const STOP=/^(valor|inválido|invalido|campo|escolha|escreva|preencha|informe|precisa|pelo|menos|letras)$/;
  const ruim=f=>{const v=String(f.value||"").trim(),lt=((f.closest("label")||{}).textContent||"").toLowerCase();return (f.required&&!v)||(v&&isNaN(Number(v.replace(",",".")))&&(f.type=="number"||/numeric|decimal/.test(f.inputMode||"")||/btu|\(kg\)|\(v\)|m²|ocupantes|r\$|meses|anos|qtd|°c/.test(lt)))};
  alvo=(LB.find(x=>x.t.length>=4&&!STOP.test(x.t)&&low.includes(x.t))||{}).f||null;
  if(!alvo)box.querySelectorAll("details").forEach(d=>{if(alvo)return;const sm=(d.querySelector("summary")||{}).textContent||"";const k=sm.replace(/[^\wÀ-ú ]/g," ").trim().toLowerCase().split(/\s+/).find(w=>w.length>=6);if(k&&low.includes(k)){d.open=true;alvo=[...d.querySelectorAll("input,select,textarea")].find(ruim)||null}});
  if(!alvo){alvo=(LB.find(x=>x.t.split(/\s+/).filter(w=>w.length>=6&&!STOP.test(w)).some(w=>low.includes(w)))||{}).f||null}
  if(!alvo)alvo=(LB.find(x=>ruim(x.f))||{}).f||null;
  if(!alvo)alvo=[...box.querySelectorAll("input[required],select[required],textarea[required]")].find(f=>!String(f.value||"").trim());
  if(alvo){alvo.classList.add("campo-erro");alvo.addEventListener("input",()=>alvo.classList.remove("campo-erro"),{once:true})}
  el.scrollIntoView({behavior:"smooth",block:"center"});if(alvo)setTimeout(()=>{try{alvo.focus({preventScroll:true})}catch(e){}},400)}

  <label>Tema<select onchange="E.dz.tema=this.value;aplicarDesign(E.dz)">${[["claro","Claro"],["escuro","Escuro"],["auto","Automático"]].map(([k,t])=>`<option value="${k}" ${(d.tema||"claro")==k?"selected":""}>${t}</option>`).join("")}</select></label>

 <div class="card"><h2>Prévia</h2><div style="border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="background:var(--brand);color:var(--brand-ink);padding:14px"><b>Painel da Matriz</b><div style="opacity:.85;font-size:.85rem">Atalaia System</div></div><div style="padding:14px;display:grid;gap:10px">${kpi("Empresas",num(E.cts.length),"exemplo")}<div><button class="btn">Botão principal</button> <button class="btn ghost">Secundário</button></div></div></div></div></div>`}

async function posLogin(novo){
  const u=await DB.usuario();E.email=u?.email||"";E.meuNome=(u&&u.user_metadata&&(u.user_metadata.nome||u.user_metadata.full_name))||"";
  if(!(await DB.souMatriz())){E.tela="negado";render();return}
  const n=await DB.nivel();
  if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.tela="mfa";E.msg=null;render();return}
  if(n.currentLevel!="aal2"){E.tela="ativar";E.insc=null;E.msg=null;render();try{E.insc=await DB.inscrever()}catch(e){E.msg=["err",e.message]}render();return}
  E.tela="painel";E.msg=null;render();if(novo)DB.registrar("entrou no painel",null,aparelhoIdM());await recarregar();
}

  try{await DB.alterarPlano(s,novo);toast("Plano alterado.");await recarregar()}catch(e){sel.value=c.plano_id;falha(e.message)}}

function sugerirSigla(n){const el=$("#cs");if(el.dataset.mexeu)return;const p=n.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z ]/g,"").split(/\s+/).filter(x=>x.length>2||/^[A-Z]{2}$/.test(x));el.value=(p.map(x=>x[0]).join("")||n.slice(0,2)).slice(0,4).toUpperCase()}

async function cadastrar(){
  const d={nome:$("#cn").value.trim(),sigla:$("#cs").value.trim().toUpperCase(),segmento:$("#cg").value.trim(),cnpj:$("#cj").value.trim(),plano:$("#cp").value,ambiente:$("#ca").value.trim()};
  const email=$("#ue").value.trim(),nome=$("#un").value.trim();
  if(!/^[A-Z]{2,4}$/.test(d.sigla)){falha("A sigla precisa ter de 2 a 4 letras, sem acentos.");return}
  try{await DB.criar(d)}catch(e){falha(e.message);return}
  const lci=($("#cci")||{}).value?$("#cci").value.trim():"",luf=($("#cuf")||{}).value||"";
  if(lci||luf){try{const cs=await DB.contratantes();const c=(cs||[]).find(x=>x.sigla==d.sigla);if(c)await DB.localEmpresa(c.id,lci,luf)}catch(e){}}E.mapaD=null;E._mpLd=0;
  try{const cv=await convite(email,nome,"cliente");await DB.vincular(email,d.sigla,nome,"gestor");DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["ok",`Empresa ${d.nome} (${d.sigla}) cadastrada no plano ${d.plano} e ${email} ligado como Gestor (será o Gestor principal).${cv}`]}
  catch(e){DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["info",`A empresa ${d.sigla} foi criada, mas o Gestor não foi ligado: ${e.message} Use “Adicionar usuário a uma empresa existente” para tentar de novo.`]}
  await recarregar();}
async function vincularExtra(){const s=$("#vs").value;try{const cv=await convite($("#ve").value.trim(),$("#vn").value.trim(),"cliente");const r=await DB.vincular($("#ve").value.trim(),s,$("#vn").value.trim(),$("#vp").value);DB.registrar("adicionou usuário",s);E.msg=["ok",r+cv];await recarregar()}catch(e){falha(e.message)}}
async function salvarLead(){const f=E.lead;const d={empresa:$("#le").value.trim(),segmento:$("#lg").value.trim()||null,origem:$("#lo").value||null,contato:$("#lc").value.trim()||null,telefone:$("#lt").value.trim()||null,email:$("#lm").value.trim()||null,proximo_passo:$("#lp").value.trim()||null,plano:$("#ll").value,etapa:$("#la").value,observacao:$("#lb").value.trim()||null};if(f.id)d.id=f.id;
  try{await DB.salvarInteressado(d);E.lead=null;toast("Interessado salvo.");E.leads=await DB.interessados();render()}catch(e){falha(e.message)}}
async function mudarEtapa(id,etapa){try{await DB.salvarInteressado({id,etapa});E.leads=await DB.interessados();toast("Etapa atualizada.");render()}catch(e){falha(e.message)}}

async function responder(id){const d={resposta:$("#tr").value.trim()||null,situacao:$("#ts").value,prioridade:$("#tp").value};try{await DB.responder(id,d);DB.registrar("respondeu chamado","Nº "+id);toast("Resposta salva. O cliente vê no aplicativo.");E.tks=await DB.chamados();render()}catch(e){falha(e.message)}}

// Mostrar / ocultar senha em todos os campos de senha
(function(){
  function olho(inp){
    if(inp.dataset.olho)return; inp.dataset.olho="1";
    var box=document.createElement("span"); box.className="senha-box";
    inp.parentNode.insertBefore(box,inp); box.appendChild(inp);
    var b=document.createElement("button"); b.type="button"; b.className="senha-olho";
    b.textContent="\u{1F441} Mostrar"; b.setAttribute("aria-label","Mostrar senha");
    b.onclick=function(){var mostrar=inp.type==="password"; inp.type=mostrar?"text":"password";
      b.textContent=mostrar?"\u{1F648} Ocultar":"\u{1F441} Mostrar"; b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha"); inp.focus();};
    box.appendChild(b);
  }
  function varrer(){document.querySelectorAll('input[type="password"]:not([data-olho])').forEach(olho);}
  new MutationObserver(varrer).observe(document.body,{childList:true,subtree:true}); varrer();
})();
