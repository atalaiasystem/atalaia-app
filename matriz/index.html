function saudeDe(c){

  const d=diasDesde(c.ultimo_acesso),atv=d==null?0:d<=2?100:d<=7?70:d<=14?40:d<=30?15:0;

  const abertos=E.tks.filter(t=>t.contratante_id==c.id&&t.situacao!="resolvido"),alta=abertos.filter(t=>t.prioridade=="alta").length;
  const sup=Math.max(0,100-abertos.length*12-alta*25);
  return {t:Math.round(uso*.4+atv*.25+ado*.2+sup*.15),uso:Math.round(uso),atv,ado:Math.round(ado),sup,d,abertos:abertos.length};
}

  `<div class="kpis">${kpi("Em negociação",ab.length,"interessados em aberto")}${kpi("Receita em negociação",brl(neg),"por mês, se todos fecharem")}${kpi("Contratos fechados",ganhos,"etapa Contrato")}${kpi("Taxa de fechamento",fech?Math.round(ganhos/fech*100)+"%":"—","contratos ÷ (contratos + perdidos)")}</div>
  <div class="g2"><div class="card"><h2>Interessados por etapa</h2>${hbar(ETAPAS.map(([k,t])=>[t,L.filter(l=>l.etapa==k).length]))}</div>
  <div class="card"><h2>Receita em negociação por etapa</h2>${hbar(ETAPAS.slice(0,4).map(([k,t])=>[t,ab.filter(l=>l.etapa==k).reduce((s,l)=>s+(PRECO[l.plano]||0),0)]),brl)}</div></div>
  <div class="card tw" style="padding:6px 10px"><table><tr><th>Empresa</th><th>Contato</th><th>Origem</th><th>Plano</th><th>Etapa</th><th>Próximo passo</th><th>Atualizado</th><th></th></tr>
  ${L.map(l=>`<tr><td><b>${esc(l.empresa)}</b><div class="muted">${esc(l.segmento||"")}</div></td><td>${esc(l.contato||"")}<div class="muted">${esc(l.telefone||"")} ${esc(l.email||"")}</div></td><td>${esc(l.origem||"")}</td><td>${esc((PLANOS.find(p=>p[0]==l.plano)||["",""])[1])}</td>
   <td><select onchange="mudarEtapa(${l.id},this.value)">${ETAPAS.map(([k,t])=>`<option value="${k}" ${l.etapa==k?"selected":""}>${t}</option>`).join("")}</select></td><td>${esc(l.proximo_passo||"")}</td><td>${dh(l.atualizado_em)}</td>
   <td style="white-space:nowrap"><button class="btn ghost sm" onclick="E.lead=E.leads.find(x=>x.id==${l.id});render();scrollTo(0,0)">Editar</button> ${l.etapa=="contrato"&&!l.contratante_id?`<button class="btn amb sm" onclick="converter(${l.id})">Cadastrar empresa</button>`:""}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">Nenhum interessado cadastrado. Clique em “+ Novo interessado”.</td></tr>`}</table></div>`;
}

/* ---------- atendimento ---------- */
const TIPOS={duvida:"Dúvida",problema:"Problema",melhoria:"Melhoria",financeiro:"Financeiro"},SITC={aberto:"Aberto",em_atendimento:"Em atendimento",resolvido:"Resolvido"},PRI={baixa:"Baixa",media:"Média",alta:"Alta"};
function abaAtend(){
  const T=E.tks,ab=T.filter(t=>t.situacao!="resolvido"),resp=T.filter(t=>t.respondido_em),med=resp.length?resp.reduce((s,t)=>s+(new Date(t.respondido_em)-new Date(t.criado_em)),0)/resp.length/36e5:null;
  const L=T.filter(t=>E.tf=="todos"||(E.tf=="abertos"?t.situacao!="resolvido":t.tipo==E.tf));const sel=T.find(t=>t.id==E.tk);
  return cab2("Atendimento","Chamados que os clientes abrem pelo aplicativo (aba Plano › Suporte). Aqui a equipe responde; não há acesso aos dados cadastrados pelo cliente.")+
  `<div class="kpis">${kpi("Abertos",ab.length,`${ab.filter(t=>t.prioridade=="alta").length} de prioridade alta`)}${kpi("1ª resposta (média)",med==null?"—":med<1?Math.round(med*60)+" min":med.toLocaleString("pt-BR",{maximumFractionDigits:1})+" h","meta: até 1 dia útil")}${kpi("Resolvidos",T.filter(t=>t.situacao=="resolvido").length,"no total")}${kpi("Pedidos de melhoria",T.filter(t=>t.tipo=="melhoria").length,"viram itens das próximas versões")}</div>
  ${sel?`<div class="card" style="border-color:var(--amb)"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Nº ${sel.id} · ${esc(sel.assunto)}</h2><button class="btn ghost sm" onclick="E.tk=null;render()">Fechar</button></div>
   <p class="muted" style="margin:0 0 8px">${esc(sel.contratantes?.nome||"")} (${esc(sel.contratantes?.sigla||"")}) · ${esc(sel.autor||"")} · ${TIPOS[sel.tipo]} · aberto em ${dh(sel.criado_em)}</p>
   <div style="background:var(--soft);border-radius:10px;padding:10px;white-space:pre-wrap">${esc(sel.mensagem)}</div>
   <form onsubmit="event.preventDefault();responder(${sel.id})" style="margin-top:12px"><label>Resposta para o cliente<textarea id="tr" rows="4" maxlength="2000" style="border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;font:inherit">${esc(sel.resposta||"")}</textarea></label>
   <div class="row3"><label>Situação<select id="ts">${Object.entries(SITC).map(([k,t])=>`<option value="${k}" ${sel.situacao==k?"selected":""}>${t}</option>`).join("")}</select></label><label>Prioridade<select id="tp">${Object.entries(PRI).map(([k,t])=>`<option value="${k}" ${sel.prioridade==k?"selected":""}>${t}</option>`).join("")}</select></label><label>&nbsp;<button class="btn amb">Salvar resposta</button></label></div></form></div>`:""}
  <div class="card tw" style="padding:6px 10px"><div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span class="muted">Mostrar:</span><select style="width:auto" onchange="E.tf=this.value;render()">${[["abertos","Abertos"],["todos","Todos"],...Object.entries(TIPOS)].map(([k,t])=>`<option value="${k}" ${E.tf==k?"selected":""}>${t}</option>`).join("")}</select></div>
  <table><tr><th>Nº</th><th>Empresa</th><th>Assunto</th><th>Tipo</th><th>Prioridade</th><th>Aberto</th><th>Situação</th><th></th></tr>
  ${L.map(t=>`<tr><td>${t.id}</td><td>${esc(t.contratantes?.nome||"")}</td><td>${esc(t.assunto)}</td><td>${TIPOS[t.tipo]||esc(t.tipo)}</td><td>${t.prioridade=="alta"?pill("Alta","var(--bad)"):PRI[t.prioridade]}</td><td>${dh(t.criado_em)}</td><td>${t.situacao=="resolvido"?pill("Resolvido","var(--ok)"):SITC[t.situacao]}</td><td><button class="btn ghost sm" onclick="E.tk=${t.id};render();scrollTo(0,0)">Abrir</button></td></tr>`).join("")||`<tr><td colspan="8" class="muted">Nenhum chamado neste filtro.</td></tr>`}</table></div>`;
}

/* ---------- infraestrutura ---------- */
const LIM={banco:500,fotos:1024,contas:50000};
function abaInfra(){
  const i=E.infra||{};const b=(n,v,l,u)=>{const p=Math.min(100,v/l*100);return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${n}</span><b>${num(v)} ${u} de ${num(l)} ${u} (${p.toLocaleString("pt-BR",{maximumFractionDigits:1})}%)</b></div><div class="bar" style="height:10px"><i style="width:${p}%;background:${p>=75?"var(--bad)":p>=50?"var(--warn)":"var(--ok)"}"></i></div></div>`};
  const alerta=[(i.banco_mb||0)/LIM.banco,(i.fotos_mb||0)/LIM.fotos].some(x=>x>=.75);
  return cab2("Infraestrutura","Uso dos serviços que mantêm o sistema no ar, comparado com os limites do plano gratuito do Supabase.")+
  `<div class="kpis">${kpi("Banco de dados",num(i.banco_mb)+" MB","limite gratuito: 500 MB")}${kpi("Fotos",num(i.fotos_mb)+" MB",`${num(i.fotos_qtd)} arquivo(s) · limite 1 GB`)}${kpi("Contas de acesso",num(i.contas),"limite gratuito: 50.000 ativas/mês")}${kpi("Versões em uso","App 0.1.2","Painel da Matriz "+CONFIG.versao)}</div>
  ${alerta?`<div class="msg err">Algum limite passou de 75%. Hora de migrar o Supabase para o plano Pro (cerca de US$ 25 por mês), antes de travar.</div>`:""}
  <div class="g2"><div class="card"><h2>Uso dos limites gratuitos</h2>${b("Banco de dados",i.banco_mb||0,LIM.banco,"MB")}${b("Fotos dos bens",i.fotos_mb||0,LIM.fotos,"MB")}${b("Contas ativas no mês",i.ativos_mes||0,LIM.contas,"")}
   <p class="muted" style="margin:0">Regra: ao passar de 75% em qualquer item, migrar para o plano Pro do Supabase (8 GB de banco e 100 GB de arquivos).</p></div>
  <div class="card"><h2>Custos de operação por mês</h2><div class="tw"><table><tr><th>Serviço</th><th>Para que serve</th><th>Valor</th></tr>
   <tr><td>Supabase (plano gratuito)</td><td>Banco, login e fotos</td><td>R$ 0</td></tr><tr><td>GitHub Pages</td><td>Hospedagem do aplicativo</td><td>R$ 0</td></tr><tr><td>Registro.br</td><td>Domínio atalaiasystem.com.br (R$ 40/ano)</td><td>R$ 3,33</td></tr><tr><td><b>Total</b></td><td></td><td><b>R$ 3,33</b></td></tr></table></div>
   <h2 style="margin-top:14px">Segurança</h2><ul style="margin:0;padding-left:18px;font-size:.9rem"><li>Dados no Brasil (Supabase, região São Paulo).</li><li>Cada empresa só vê os próprios dados (regras no banco).</li><li>Matriz com senha + código de duas etapas.</li><li>Endereço com cadeado (HTTPS).</li></ul></div></div>`;
}

/* ---------- indicadores ---------- */
function abaInd(){
  const i=E.ind||{},at=E.cts.filter(c=>c.situacao=="ativo"),pag=at.filter(c=>c.preco_mensal>0),mrr=at.reduce((s,c)=>s+Number(c.preco_mensal),0);
  const fr=E.cts.filter(c=>c.plano_id=="free"),pagosTot=E.cts.filter(c=>c.plano_id!="free");
  const R=[["Receita recorrente mensal (MRR)",brl(mrr),"Soma das mensalidades das empresas com situação Ativo (valor base do plano)."],
   ["Receita anual recorrente (ARR)",brl(mrr*12),"MRR × 12: tamanho anual do negócio se nada mudar."],
   ["Empresas pagantes",pag.length,"Empresas ativas em plano pago. Em teste e encerradas não contam."],
   ["Ticket médio",brl(pag.length?mrr/pag.length:0),"MRR ÷ empresas pagantes."],
   ["Conversão do Free",E.cts.length?Math.round(pagosTot.length/E.cts.length*100)+"%":"—","Empresas em plano pago ÷ todas as empresas cadastradas."],
   ["Ativação de usuários (30 dias)",i.usuarios?Math.round((i.ativos_30d||0)/i.usuarios*100)+"%":"—","Usuários que entraram ou abriram o app em 30 dias ÷ usuários cadastrados. Meta: 70%."],
   ["Usuários ativos hoje",num(i.ativos_hoje),"Pessoas diferentes que entraram ou abriram o app hoje."],
   ["Chamados de suporte abertos",E.tks.filter(t=>t.situacao!="resolvido").length,"Chamados ainda não resolvidos. Meta: responder em até 1 dia útil."],
   ["Free perto do limite",fr.filter(c=>c.bens>=c.lim_bens*.8).length,"Empresas Free com 80% ou mais dos bens: oportunidades de venda."],
   ["Cancelamento e retenção","em breve","Precisam do histórico de cobrança, que entra com o módulo financeiro."]];
  return cab2("Indicadores","Cada número com a explicação de como é calculado.")+`<div class="card tw" style="padding:6px 10px"><table><tr><th>Indicador</th><th>Valor</th><th>Como é calculado</th></tr>${R.map(r=>`<tr><td><b>${r[0]}</b></td><td style="font-size:1.05rem;font-weight:700;white-space:nowrap">${r[1]}</td><td class="muted">${r[2]}</td></tr>`).join("")}</table></div>`;
}

function abaCadastrar(){return `<h1>Cadastrar empresa</h1><p class="sub">Duas partes: primeiro a empresa, depois a pessoa que vai administrar.</p>
 <div class="g2"><form class="card" onsubmit="event.preventDefault();cadastrar()"><h2>1. Empresa</h2>
  <label>Nome da empresa *<input id="cn" required maxlength="120" oninput="sugerirSigla(this.value)"></label>
  <div class="row3"><label>Segmento<input id="cg" maxlength="60" placeholder="Ex.: Salão, Clínica, Hospital"></label><label>Sigla * <span class="muted" style="font-weight:400">(2 a 4 letras)</span><input id="cs" required maxlength="4" pattern="[A-Za-z]{2,4}" style="text-transform:uppercase"></label><label>CNPJ<input id="cj" maxlength="18" inputmode="numeric"></label></div>
  <div class="row"><label>Plano *<select id="cp">${PLANOS.map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></label><label>Primeiro ambiente *<input id="ca" required maxlength="80" value="Ambiente principal"></label></div>
  <h2 style="margin-top:6px">2. Administrador da empresa</h2>
  <div class="msg info">Antes, crie o usuário no Supabase: <b>Authentication › Users › Add user › Create new user</b>, com senha provisória e <b>Auto Confirm User</b> marcado. No primeiro acesso, o sistema obriga a pessoa a criar a senha dela.</div>
  <div class="row"><label>E-mail do administrador *<input id="ue" type="email" required></label><label>Nome do administrador *<input id="un" required maxlength="80"></label></div>
  <button class="btn amb full">Cadastrar empresa e administrador</button></form>
 <form class="card" onsubmit="event.preventDefault();vincularExtra()"><h2>Adicionar usuário a uma empresa existente</h2><p class="sub">Para empresas pagas com mais usuários. O usuário também precisa ser criado antes no Supabase.</p>
  <label>Empresa<select id="vs">${E.cts.map(c=>`<option value="${esc(c.sigla)}">${esc(c.nome)} (${esc(c.sigla)}) · ${esc(c.usuarios)}/${esc(c.lim_usuarios)}</option>`).join("")}</select></label>
  <label>E-mail<input id="ve" type="email" required></label><label>Nome<input id="vn" required maxlength="80"></label>
  <label>Perfil<select id="vp"><option value="administrador">Administrador</option><option value="gestor">Gestor</option><option value="manutencionista">Manutencionista</option><option value="responsavel">Responsável de ambiente</option></select></label>
  <button class="btn full">Adicionar usuário</button></form></div>`}
function abaAcessos(){return `<h1>Registro de acessos da Matriz</h1><p class="sub">Últimas 30 ações feitas pela equipe da Matriz.</p><div class="card tw" style="padding:6px 10px"><table><tr><th>Data e hora</th><th>Ação</th><th>Detalhe</th></tr>${E.acessos.map(a=>`<tr><td>${dh(a.criado_em)}</td><td>${esc(a.acao)}</td><td>${esc(a.detalhe||"")}</td></tr>`).join("")||`<tr><td colspan="3" class="muted">Nenhum registro ainda.</td></tr>`}</table></div>`}

/* ---------------- Ações ---------------- */
async function iniciar(){try{if(await DB.sessao()){await posLogin(false);return}}catch(e){E.msg=["err",e.message]}E.tela="login";render()}
async function entrar(){E.msg=null;try{await DB.entrar($("#em").value.trim(),$("#se").value);await posLogin(true)}catch(e){E.msg=["err",e.message];render()}}
async function posLogin(novo){
  const u=await DB.usuario();E.email=u?.email||"";
  if(!(await DB.souMatriz())){E.tela="negado";render();return}
  const n=await DB.nivel();
  if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.tela="mfa";E.msg=null;render();return}
  if(n.currentLevel!="aal2"){E.tela="ativar";E.insc=null;E.msg=null;render();try{E.insc=await DB.inscrever()}catch(e){E.msg=["err",e.message]}render();return}
  E.tela="painel";E.msg=null;render();if(novo)DB.registrar("entrou no painel");await recarregar();
}
async function confirmarMfa(){try{const f=(await DB.fatores()).find(x=>x.status=="verified");await DB.verificar(f.id,$("#otp").value.trim());await posLogin(true)}catch(e){E.msg=["err",e.message];render()}}
async function confirmarAtivacao(){try{await DB.verificar(E.insc.id,$("#otp").value.trim());E.insc=null;toast("Verificação em duas etapas ativada.");await posLogin(true);DB.registrar("ativou a verificação em duas etapas")}catch(e){E.msg=["err",e.message];render()}}
async function recarregar(){try{[E.ind,E.cts,E.acessos,E.infra,E.leads,E.tks]=await Promise.all([DB.indicadores(),DB.contratantes(),DB.meusAcessos(),DB.infra(),DB.interessados(),DB.chamados()])}catch(e){E.msg=["err",e.message]}render()}
function irAba(k){E.aba=k;E.msg=null;render();scrollTo(0,0)}
async function sair(){await DB.sair();Object.assign(E,{tela:"login",msg:null,ind:null,cts:[],acessos:[],aba:"visao"});render()}
async function trocarPlano(s,sel){const novo=sel.value,c=E.cts.find(x=>x.sigla==s);
  if(!confirm(`Trocar o plano de ${c.nome} de ${c.plano_nome} para ${PLANOS.find(p=>p[0]==novo)[1]}?`)){sel.value=c.plano_id;return}
  try{await DB.alterarPlano(s,novo);toast("Plano alterado.");await recarregar()}catch(e){sel.value=c.plano_id;E.msg=["err",e.message];render()}}
async function trocarSituacao(s,sel){const c=E.cts.find(x=>x.sigla==s);if(!confirm(`Mudar a situação de ${c.nome} para "${SIT[sel.value]}"?`)){sel.value=c.situacao;return}
  try{await DB.alterarSituacao(s,sel.value);toast("Situação alterada.");await recarregar()}catch(e){sel.value=c.situacao;E.msg=["err",e.message];render()}}
async function exigir2(s,cb){try{await DB.exigir2(s,cb.checked);toast(cb.checked?"Duas etapas exigidas dos administradores.":"Duas etapas opcionais.");await recarregar()}catch(e){cb.checked=!cb.checked;E.msg=["err",e.message];render()}}
function sugerirSigla(n){const el=$("#cs");if(el.dataset.mexeu)return;const p=n.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z ]/g,"").split(/\s+/).filter(x=>x.length>2||/^[A-Z]{2}$/.test(x));el.value=(p.map(x=>x[0]).join("")||n.slice(0,2)).slice(0,4).toUpperCase()}
document.addEventListener("input",e=>{if(e.target.id=="cs")e.target.dataset.mexeu="1"});
async function cadastrar(){
  const d={nome:$("#cn").value.trim(),sigla:$("#cs").value.trim().toUpperCase(),segmento:$("#cg").value.trim(),cnpj:$("#cj").value.trim(),plano:$("#cp").value,ambiente:$("#ca").value.trim()};
  const email=$("#ue").value.trim(),nome=$("#un").value.trim();
  if(!/^[A-Z]{2,4}$/.test(d.sigla)){E.msg=["err","A sigla precisa ter de 2 a 4 letras, sem acentos."];render();return}
  try{await DB.criar(d)}catch(e){E.msg=["err",e.message];render();return}
  try{await DB.vincular(email,d.sigla,nome,"administrador");DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["ok",`Empresa ${d.nome} (${d.sigla}) cadastrada no plano ${d.plano} e ${email} ligado como administrador. Envie a ela o link do aplicativo e a senha provisória (em mensagens separadas).`]}
  catch(e){DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["info",`A empresa ${d.sigla} foi criada, mas o usuário não foi ligado: ${e.message} Crie o usuário no Supabase e use “Adicionar usuário a uma empresa existente”.`]}
  await recarregar();}
async function vincularExtra(){const s=$("#vs").value;try{const r=await DB.vincular($("#ve").value.trim(),s,$("#vn").value.trim(),$("#vp").value);DB.registrar("adicionou usuário",s);E.msg=["ok",r];await recarregar()}catch(e){E.msg=["err",e.message];render()}}
async function salvarLead(){const f=E.lead;const d={empresa:$("#le").value.trim(),segmento:$("#lg").value.trim()||null,origem:$("#lo").value||null,contato:$("#lc").value.trim()||null,telefone:$("#lt").value.trim()||null,email:$("#lm").value.trim()||null,proximo_passo:$("#lp").value.trim()||null,plano:$("#ll").value,etapa:$("#la").value,observacao:$("#lb").value.trim()||null};if(f.id)d.id=f.id;
  try{await DB.salvarInteressado(d);E.lead=null;toast("Interessado salvo.");E.leads=await DB.interessados();render()}catch(e){E.msg=["err",e.message];render()}}
async function mudarEtapa(id,etapa){try{await DB.salvarInteressado({id,etapa});E.leads=await DB.interessados();toast("Etapa atualizada.");render()}catch(e){E.msg=["err",e.message];render()}}
function converter(id){const l=E.leads.find(x=>x.id==id);E.aba="cadastrar";render();$("#cn").value=l.empresa;sugerirSigla(l.empresa);$("#cg").value=l.segmento||"";$("#cp").value=l.plano||"atalaia";if(l.email)$("#ue").value=l.email;if(l.contato)$("#un").value=l.contato;scrollTo(0,0)}
async function responder(id){const d={resposta:$("#tr").value.trim()||null,situacao:$("#ts").value,prioridade:$("#tp").value};try{await DB.responder(id,d);DB.registrar("respondeu chamado","Nº "+id);toast("Resposta salva. O cliente vê no aplicativo.");E.tks=await DB.chamados();render()}catch(e){E.msg=["err",e.message];render()}}
iniciar();
</script>
</body>
