async function iniciar(){try{if(await DB.sessao()){await posLogin(false);return}}catch(e){E.msg=["err",e.message]}E.tela="login";render()}
async function entrar(){E.msg=null;try{await DB.entrar($("#em").value.trim(),$("#se").value);await posLogin(true)}catch(e){E.msg=["err",e.message];render()}}
async function posLogin(novo){
  const u=await DB.usuario();E.email=u?.email||"";
  if(!(await DB.souMatriz())){E.tela="negado";render();return}
  const n=await DB.nivel();
  if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.tela="mfa";E.msg=null;render();return}
  if(n.currentLevel!="aal2"){E.tela="ativar";E.insc=null;E.msg=null;render();try{E.insc=await DB.inscrever()}catch(e){E.msg=["err",e.message]}render();return}
  E.tela="painel";E.msg=null;render();if(novo)DB.registrar("entrou no painel");await recarregar();
}
async function confirmarMfa(){try{const f=(await DB.fatores()).find(x=>x.status=="verified");await DB.verificar(f.id,$("#otp").value.trim());await posLogin(true)}catch(e){E.msg=["err",e.message];render()}}
async function confirmarAtivacao(){try{await DB.verificar(E.insc.id,$("#otp").value.trim());E.insc=null;toast("Verificação em duas etapas ativada.");await posLogin(true);DB.registrar("ativou a verificação em duas etapas")}catch(e){E.msg=["err",e.message];render()}}
async function recarregar(){try{[E.ind,E.cts,E.acessos,E.infra,E.leads,E.tks,E.planos,E.ads,E.recAd]=await Promise.all([DB.indicadores(),DB.contratantes(),DB.meusAcessos(),DB.infra(),DB.interessados(),DB.chamados(),DB.planos(),DB.adicionais(),DB.receitaAdicionais()])}catch(e){E.msg=["err",e.message]}render()}

function voltar(){E.aba=E.hist.pop()||"visao";E.msg=null;render();scrollTo(0,0)}
async function sair(){await DB.sair();Object.assign(E,{tela:"login",msg:null,ind:null,cts:[],acessos:[],aba:"visao"});render()}
async function trocarPlano(s,sel){const novo=sel.value,c=E.cts.find(x=>x.sigla==s);
  if(!confirm(`Trocar o plano de ${c.nome} de ${c.plano_nome} para ${PLANOS.find(p=>p[0]==novo)[1]}?`)){sel.value=c.plano_id;return}
  try{await DB.alterarPlano(s,novo);toast("Plano alterado.");await recarregar()}catch(e){sel.value=c.plano_id;E.msg=["err",e.message];render()}}
async function trocarSituacao(s,sel){const c=E.cts.find(x=>x.sigla==s);if(!confirm(`Mudar a situação de ${c.nome} para "${SIT[sel.value]}"?`)){sel.value=c.situacao;return}
  try{await DB.alterarSituacao(s,sel.value);toast("Situação alterada.");await recarregar()}catch(e){sel.value=c.situacao;E.msg=["err",e.message];render()}}
async function exigir2(s,cb){try{await DB.exigir2(s,cb.checked);toast(cb.checked?"Duas etapas exigidas do gestor e dos administradores.":"Duas etapas opcionais.");await recarregar()}catch(e){cb.checked=!cb.checked;E.msg=["err",e.message];render()}}
function sugerirSigla(n){const el=$("#cs");if(el.dataset.mexeu)return;const p=n.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z ]/g,"").split(/\s+/).filter(x=>x.length>2||/^[A-Z]{2}$/.test(x));el.value=(p.map(x=>x[0]).join("")||n.slice(0,2)).slice(0,4).toUpperCase()}
document.addEventListener("input",e=>{if(e.target.id=="cs")e.target.dataset.mexeu="1"});
async function cadastrar(){
  const d={nome:$("#cn").value.trim(),sigla:$("#cs").value.trim().toUpperCase(),segmento:$("#cg").value.trim(),cnpj:$("#cj").value.trim(),plano:$("#cp").value,ambiente:$("#ca").value.trim()};
  const email=$("#ue").value.trim(),nome=$("#un").value.trim();
  if(!/^[A-Z]{2,4}$/.test(d.sigla)){E.msg=["err","A sigla precisa ter de 2 a 4 letras, sem acentos."];render();return}
  try{await DB.criar(d)}catch(e){E.msg=["err",e.message];render();return}
  try{await DB.vincular(email,d.sigla,nome,"gestor");DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["ok",`Empresa ${d.nome} (${d.sigla}) cadastrada no plano ${d.plano} e ${email} ligado como Gestor. Envie a ela o link do aplicativo e a senha provisória (em mensagens separadas).`]}
  catch(e){DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["info",`A empresa ${d.sigla} foi criada, mas o usuário não foi ligado: ${e.message} Crie o usuário no Supabase e use “Adicionar usuário a uma empresa existente”.`]}
  await recarregar();}
async function vincularExtra(){const s=$("#vs").value;try{const r=await DB.vincular($("#ve").value.trim(),s,$("#vn").value.trim(),$("#vp").value);DB.registrar("adicionou usuário",s);E.msg=["ok",r];await recarregar()}catch(e){E.msg=["err",e.message];render()}}
async function salvarLead(){const f=E.lead;const d={empresa:$("#le").value.trim(),segmento:$("#lg").value.trim()||null,origem:$("#lo").value||null,contato:$("#lc").value.trim()||null,telefone:$("#lt").value.trim()||null,email:$("#lm").value.trim()||null,proximo_passo:$("#lp").value.trim()||null,plano:$("#ll").value,etapa:$("#la").value,observacao:$("#lb").value.trim()||null};if(f.id)d.id=f.id;
  try{await DB.salvarInteressado(d);E.lead=null;toast("Interessado salvo.");E.leads=await DB.interessados();render()}catch(e){E.msg=["err",e.message];render()}}
async function mudarEtapa(id,etapa){try{await DB.salvarInteressado({id,etapa});E.leads=await DB.interessados();toast("Etapa atualizada.");render()}catch(e){E.msg=["err",e.message];render()}}
function converter(id){const l=E.leads.find(x=>x.id==id);E.aba="cadastrar";render();$("#cn").value=l.empresa;sugerirSigla(l.empresa);$("#cg").value=l.segmento||"";$("#cp").value=l.plano||"atalaia";if(l.email)$("#ue").value=l.email;if(l.contato)$("#un").value=l.contato;scrollTo(0,0)}
async function responder(id){const d={resposta:$("#tr").value.trim()||null,situacao:$("#ts").value,prioridade:$("#tp").value};try{await DB.responder(id,d);DB.registrar("respondeu chamado","Nº "+id);toast("Resposta salva. O cliente vê no aplicativo.");E.tks=await DB.chamados();render()}catch(e){E.msg=["err",e.message];render()}}

// Mostrar / ocultar senha em todos os campos de senha
(function(){
  function olho(inp){
    if(inp.dataset.olho)return; inp.dataset.olho="1";
    var box=document.createElement("span"); box.className="senha-box";
    inp.parentNode.insertBefore(box,inp); box.appendChild(inp);
    var b=document.createElement("button"); b.type="button"; b.className="senha-olho";
    b.textContent="\u{1F441} Mostrar"; b.setAttribute("aria-label","Mostrar senha");
    b.onclick=function(){var mostrar=inp.type==="password"; inp.type=mostrar?"text":"password";
      b.textContent=mostrar?"\u{1F648} Ocultar":"\u{1F441} Mostrar"; b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha"); inp.focus();};
    box.appendChild(b);
  }
  function varrer(){document.querySelectorAll('input[type="password"]:not([data-olho])').forEach(olho);}
  new MutationObserver(varrer).observe(document.body,{childList:true,subtree:true}); varrer();
})();
