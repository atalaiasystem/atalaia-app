  <div class="g2"><div class="card"><h2>Usuários ativos por dia (30 dias)</h2>${grafDias(i.acessos_por_dia||[])}</div>
  <div class="card"><h2>Empresas por plano</h2>${PLANOS.map(([k,t])=>`<div class="hb"><span>${t}</span><div class="bar"><i style="width:${(pp[k]||0)/tot*100}%;background:${k=="free"?"var(--amb)":"var(--ink)"}"></i></div><b style="text-align:right">${num(pp[k]||0)}</b></div>`).join("")}
   <h2 style="margin-top:18px">Novas empresas por mês</h2>${grafMeses(i.novas_por_mes||[])}</div></div>
  <div class="card"><h2>Free perto do limite</h2><p class="sub">Empresas no plano gratuito com 80% ou mais dos bens ou do espaço de fotos. Boas candidatas para conhecer os planos pagos.</p>
  ${perto.length?`<div class="tw"><table><tr><th>Empresa</th><th>Bens</th><th>Fotos</th><th>Ativos 30 dias</th><th>Último acesso</th></tr>${perto.map(c=>`<tr><td><b>${esc(c.nome)}</b> <span class="muted">${esc(c.sigla)}</span></td><td>${c.bens} de ${c.lim_bens}</td><td>${num(c.fotos_mb)} MB de ${c.lim_gb} GB</td><td>${c.usuarios_ativos_30d}</td><td>${dh(c.ultimo_acesso)}</td></tr>`).join("")}</table></div>`:`<p class="muted">Nenhuma empresa Free perto do limite no momento.</p>`}</div>`;
}
function grafDias(d){if(!d.length)return `<p class="muted">Sem dados ainda.</p>`;const W=640,H=180,max=Math.max(1,...d.map(x=>x.usuarios)),bw=W/d.length;
  return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto" role="img" aria-label="Usuários ativos por dia">${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*H*.9}" y2="${H-f*H*.9}" stroke="#e3e0da"/><text x="2" y="${H-f*H*.9-3}" font-size="10" fill="#6b7078">${Math.round(max*f)}</text>`).join("")}
  ${d.map((x,k)=>{const h=x.usuarios/max*H*.9;return `<rect x="${k*bw+2}" y="${H-h}" width="${bw-4}" height="${h}" rx="2" fill="${k==d.length-1?"#f2a33a":"#1d1f23"}"><title>${x.dia.split("-").reverse().join("/")}: ${x.usuarios} usuário(s)</title></rect>`}).join("")}
  ${d.map((x,k)=>k%5==0||k==d.length-1?`<text x="${k*bw+bw/2}" y="${H+15}" font-size="10" text-anchor="middle" fill="#6b7078">${x.dia.slice(8,10)}/${x.dia.slice(5,7)}</text>`:"").join("")}</svg>`}
function grafMeses(d){const max=Math.max(1,...d.map(x=>x.qtd));const M=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  return d.map(x=>`<div class="hb"><span>${M[+x.mes.slice(5,7)-1]}/${x.mes.slice(2,4)}</span><div class="bar"><i style="width:${x.qtd/max*100}%"></i></div><b style="text-align:right">${x.qtd}</b></div>`).join("")}
function uso(n,l){const p=l?Math.min(100,n/l*100):0;return `${num(n)} <span class="muted">de ${num(l)}</span><div class="bar"><i style="width:${p}%;background:${p>=100?"var(--bad)":p>=80?"var(--warn)":"var(--ink)"}"></i></div>`}
function abaEmpresas(){
  const L=E.cts.filter(c=>E.filtro=="todos"||c.plano_id==E.filtro);
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div><h1>Empresas</h1><p class="sub" style="margin:0">${E.cts.length} cadastrada(s). Troque o plano ou a situação direto na tabela.</p></div>
  <div style="display:flex;gap:8px;align-items:center"><select onchange="E.filtro=this.value;render()" style="width:auto"><option value="todos">Todos os planos</option>${PLANOS.map(([k,t])=>`<option value="${k}" ${E.filtro==k?"selected":""}>${t}</option>`).join("")}</select><button class="btn ghost sm" onclick="recarregar()">Atualizar</button></div></div>
  <div class="card tw" style="padding:6px 10px"><table><tr><th>Empresa</th><th>Plano</th><th>Situação</th><th>Usuários</th><th>Ambientes</th><th>Bens</th><th>Fotos</th><th>Ativos 30d</th><th>Último acesso</th><th>2 etapas</th></tr>
  ${L.map(c=>`<tr><td><b>${esc(c.nome)}</b><div class="muted">${esc(c.sigla)}${c.segmento?" · "+esc(c.segmento):""} · desde ${new Date(c.criado_em).toLocaleDateString("pt-BR")}</div></td>
   <td><select onchange="trocarPlano('${esc(c.sigla)}',this)">${PLANOS.map(([k,t])=>`<option value="${k}" ${c.plano_id==k?"selected":""}>${t}</option>`).join("")}</select></td>
   <td><select onchange="trocarSituacao('${esc(c.sigla)}',this)">${Object.entries(SIT).map(([k,t])=>`<option value="${k}" ${c.situacao==k?"selected":""}>${t}</option>`).join("")}</select></td>
   <td>${uso(c.usuarios,c.lim_usuarios)}</td><td>${uso(c.ambientes,c.lim_ambientes)}</td><td>${uso(c.bens,c.lim_bens)}</td>
   <td>${num(c.fotos_mb)} MB<div class="muted">de ${c.lim_gb} GB</div></td><td>${num(c.usuarios_ativos_30d)} <span class="muted">(${num(c.acessos_30d)} acessos)</span></td><td>${dh(c.ultimo_acesso)}</td>
   <td>${c.plano_id=="free"?`<span class="muted">—</span>`:`<label style="margin:0;display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" style="width:auto" ${c.exige_2_etapas?"checked":""} onchange="exigir2('${esc(c.sigla)}',this)">exigir</label>`}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">Nenhuma empresa neste filtro.</td></tr>`}</table></div>`;
}
function abaCadastrar(){return `<h1>Cadastrar empresa</h1><p class="sub">Duas partes: primeiro a empresa, depois a pessoa que vai administrar.</p>
 <div class="g2"><form class="card" onsubmit="event.preventDefault();cadastrar()"><h2>1. Empresa</h2>
  <label>Nome da empresa *<input id="cn" required maxlength="120" oninput="sugerirSigla(this.value)"></label>
  <div class="row3"><label>Segmento<input id="cg" maxlength="60" placeholder="Ex.: Salão, Clínica, Hospital"></label><label>Sigla * <span class="muted" style="font-weight:400">(2 a 4 letras)</span><input id="cs" required maxlength="4" pattern="[A-Za-z]{2,4}" style="text-transform:uppercase"></label><label>CNPJ<input id="cj" maxlength="18" inputmode="numeric"></label></div>
  <div class="row"><label>Plano *<select id="cp">${PLANOS.map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></label><label>Primeiro ambiente *<input id="ca" required maxlength="80" value="Ambiente principal"></label></div>
  <h2 style="margin-top:6px">2. Administrador da empresa</h2>
  <div class="msg info">Antes, crie o usuário no Supabase: <b>Authentication › Users › Add user › Create new user</b>, com senha provisória e <b>Auto Confirm User</b> marcado. No primeiro acesso, o sistema obriga a pessoa a criar a senha dela.</div>
  <div class="row"><label>E-mail do administrador *<input id="ue" type="email" required></label><label>Nome do administrador *<input id="un" required maxlength="80"></label></div>
  <button class="btn amb full">Cadastrar empresa e administrador</button></form>
 <form class="card" onsubmit="event.preventDefault();vincularExtra()"><h2>Adicionar usuário a uma empresa existente</h2><p class="sub">Para empresas pagas com mais usuários. O usuário também precisa ser criado antes no Supabase.</p>
  <label>Empresa<select id="vs">${E.cts.map(c=>`<option value="${esc(c.sigla)}">${esc(c.nome)} (${esc(c.sigla)}) · ${esc(c.usuarios)}/${esc(c.lim_usuarios)}</option>`).join("")}</select></label>
  <label>E-mail<input id="ve" type="email" required></label><label>Nome<input id="vn" required maxlength="80"></label>
  <label>Perfil<select id="vp"><option value="administrador">Administrador</option><option value="gestor">Gestor</option><option value="manutencionista">Manutencionista</option><option value="responsavel">Responsável de ambiente</option></select></label>
  <button class="btn full">Adicionar usuário</button></form></div>`}
function abaAcessos(){return `<h1>Registro de acessos da Matriz</h1><p class="sub">Últimas 30 ações feitas pela equipe da Matriz.</p><div class="card tw" style="padding:6px 10px"><table><tr><th>Data e hora</th><th>Ação</th><th>Detalhe</th></tr>${E.acessos.map(a=>`<tr><td>${dh(a.criado_em)}</td><td>${esc(a.acao)}</td><td>${esc(a.detalhe||"")}</td></tr>`).join("")||`<tr><td colspan="3" class="muted">Nenhum registro ainda.</td></tr>`}</table></div>`}

/* ---------------- Ações ---------------- */
async function iniciar(){try{if(await DB.sessao()){await posLogin(false);return}}catch(e){E.msg=["err",e.message]}E.tela="login";render()}
async function entrar(){E.msg=null;try{await DB.entrar($("#em").value.trim(),$("#se").value);await posLogin(true)}catch(e){E.msg=["err",e.message];render()}}
async function posLogin(novo){
  const u=await DB.usuario();E.email=u?.email||"";
  if(!(await DB.souMatriz())){E.tela="negado";render();return}
  const n=await DB.nivel();
  if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.tela="mfa";E.msg=null;render();return}
  if(n.currentLevel!="aal2"){E.tela="ativar";E.insc=null;E.msg=null;render();try{E.insc=await DB.inscrever()}catch(e){E.msg=["err",e.message]}render();return}
  E.tela="painel";E.msg=null;render();if(novo)DB.registrar("entrou no painel");await recarregar();
}
async function confirmarMfa(){try{const f=(await DB.fatores()).find(x=>x.status=="verified");await DB.verificar(f.id,$("#otp").value.trim());await posLogin(true)}catch(e){E.msg=["err",e.message];render()}}
async function confirmarAtivacao(){try{await DB.verificar(E.insc.id,$("#otp").value.trim());E.insc=null;toast("Verificação em duas etapas ativada.");await posLogin(true);DB.registrar("ativou a verificação em duas etapas")}catch(e){E.msg=["err",e.message];render()}}
async function recarregar(){try{[E.ind,E.cts,E.acessos]=await Promise.all([DB.indicadores(),DB.contratantes(),DB.meusAcessos()])}catch(e){E.msg=["err",e.message]}render()}
function irAba(k){E.aba=k;E.msg=null;render();scrollTo(0,0)}
async function sair(){await DB.sair();Object.assign(E,{tela:"login",msg:null,ind:null,cts:[],acessos:[],aba:"visao"});render()}
async function trocarPlano(s,sel){const novo=sel.value,c=E.cts.find(x=>x.sigla==s);
  if(!confirm(`Trocar o plano de ${c.nome} de ${c.plano_nome} para ${PLANOS.find(p=>p[0]==novo)[1]}?`)){sel.value=c.plano_id;return}
  try{await DB.alterarPlano(s,novo);toast("Plano alterado.");await recarregar()}catch(e){sel.value=c.plano_id;E.msg=["err",e.message];render()}}
async function trocarSituacao(s,sel){const c=E.cts.find(x=>x.sigla==s);if(!confirm(`Mudar a situação de ${c.nome} para "${SIT[sel.value]}"?`)){sel.value=c.situacao;return}
  try{await DB.alterarSituacao(s,sel.value);toast("Situação alterada.");await recarregar()}catch(e){sel.value=c.situacao;E.msg=["err",e.message];render()}}
async function exigir2(s,cb){try{await DB.exigir2(s,cb.checked);toast(cb.checked?"Duas etapas exigidas dos administradores.":"Duas etapas opcionais.");await recarregar()}catch(e){cb.checked=!cb.checked;E.msg=["err",e.message];render()}}
function sugerirSigla(n){const el=$("#cs");if(el.dataset.mexeu)return;const p=n.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z ]/g,"").split(/\s+/).filter(x=>x.length>2||/^[A-Z]{2}$/.test(x));el.value=(p.map(x=>x[0]).join("")||n.slice(0,2)).slice(0,4).toUpperCase()}
document.addEventListener("input",e=>{if(e.target.id=="cs")e.target.dataset.mexeu="1"});
async function cadastrar(){
  const d={nome:$("#cn").value.trim(),sigla:$("#cs").value.trim().toUpperCase(),segmento:$("#cg").value.trim(),cnpj:$("#cj").value.trim(),plano:$("#cp").value,ambiente:$("#ca").value.trim()};
  const email=$("#ue").value.trim(),nome=$("#un").value.trim();
  if(!/^[A-Z]{2,4}$/.test(d.sigla)){E.msg=["err","A sigla precisa ter de 2 a 4 letras, sem acentos."];render();return}
  try{await DB.criar(d)}catch(e){E.msg=["err",e.message];render();return}
  try{await DB.vincular(email,d.sigla,nome,"administrador");DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["ok",`Empresa ${d.nome} (${d.sigla}) cadastrada no plano ${d.plano} e ${email} ligado como administrador. Envie a ela o link do aplicativo e a senha provisória (em mensagens separadas).`]}
  catch(e){DB.registrar("cadastrou empresa",d.sigla+" · "+d.plano);E.msg=["info",`A empresa ${d.sigla} foi criada, mas o usuário não foi ligado: ${e.message} Crie o usuário no Supabase e use “Adicionar usuário a uma empresa existente”.`]}
  await recarregar();}
async function vincularExtra(){const s=$("#vs").value;try{const r=await DB.vincular($("#ve").value.trim(),s,$("#vn").value.trim(),$("#vp").value);DB.registrar("adicionou usuário",s);E.msg=["ok",r];await recarregar()}catch(e){E.msg=["err",e.message];render()}}
iniciar();
</script>
</body>
</html>
