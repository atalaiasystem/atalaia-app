de company."],"O e-mail sai sozinho assim que o chamado é aberto. O WhatsApp aparece como botão no chamado, com a mensagem pronta.":["El e-mail sale solo apenas se abre la solicitud. WhatsApp aparece como botón en la solicitud, con el mensaje listo.","The e-mail goes out automatically when the request is opened. WhatsApp shows as a button on the request, with the message ready."],"O histórico é protegido: ninguém consegue alterar nem apagar estes registros.":["El historial está protegido: nadie puede modificar ni borrar estos registros.","History is protected: nobody can change or delete these records."],"O link do Avalie é o mesmo QR Code do ambiente: a pessoa toca em “Avalie” no topo da página.":["El enlace de Evalúe es el mismo código QR del ambiente: la persona toca “Evalúe” arriba de la página.","The Feedback link is the same room QR code: the person taps “Feedback” at the top of the page."],"O mesmo login vale no celular e no computador. O perfil e a unidade são mudados pelo Gestor em Equipe.":["El mismo login vale en el celular y en la computadora. El perfil y la unidad los cambia el Gestor en Equipo.","The same login works on phone and computer. Role and unit are changed by the Manager in Team."],"O padrão da empresa é definido pelo Gestor. As mudanças aqui valem só para este lote.":["El estándar de la empresa lo define el Gestor. Los cambios aquí valen solo para este lote.","The company default is set by the Manager. Changes here apply only to this batch."],"O padrão do número (separador, dígitos, ano) é definido em Configurações › Número de patrimônio antes do primeiro lote.":["El formato del número (separador, dígitos, año) se define en Configuración › Número de patrimonio antes del primer lote.","The number format (separator, digits, year) is set in Settings › Asset number before the first batch."],"O pedido vai para o Gestor aprovar. Até lá, o bem continua na lista.":["El pedido va al Gestor para aprobar. Hasta entonces, el bien sigue en la lista.","The request goes to the Manager to approve. Until then, the asset stays on the list."],"O procedimento oficial de cada função do sistema: objetivo, quem faz, quando, passo a passo, registros, cuidados e normas. Use para treinar a equipe e apresentar em auditorias. O resumo rápido continua em Como usar.":["El procedimiento oficial de cada función del sistema: objetivo, quién lo hace, cuándo, paso a paso, registros, cuidados y normas. Úselo para capacitar al equipo y presentar en auditorías. El resumen rápido sigue en Cómo usar.","The official procedure for each system feature: goal, who does it, when, step by step, records, care points and standards. Use it to train the team and present in audits. The quick summary is still in How to use."],"O que o sistema faz sozinho. Os avisos aparecem no sino 🔔 de quem precisa saber e, se ligado, também por e-mail. Os horários seguem o relógio do servidor.":["Lo que el sistema hace solo. Los avisos aparecen en la campana 🔔 de quien necesita saber y, si está activado, también por e-mail. Los horarios siguen el reloj del servidor.","What the system does by itself. Notices show in the 🔔 bell of whoever needs to know and, if on, also by e-mail. Times follow the server clock."],"O registro completo do dia a dia: previsto x realizado, preventivas com checklist e medições, corretivas com espera de peça, instrumentos, rondas, peças, pendências por idade, fotos e assinaturas":["El registro completo del día a día: previsto vs. realizado, preventivas con lista y mediciones, correctivas con espera de pieza, instrumentos, rondas, piezas, pendientes por antigüedad, fotos y firmas","The full day-to-day log: planned vs. done, preventive with checklist and readings, corrective with part waits, instruments, rounds, parts, open items by age, photos and signatures"],"O registro de serviços é feito pelo Gestor ou pelo Administrador.":["El registro de servicios lo hace el Gestor o el Administrador.","Services are recorded by the Manager or the Administrator."],"O registro e o acompanhamento ficam no histórico do bem e entram na pontuação de substituição.":["El registro y el seguimiento quedan en el historial del bien y entran en el puntaje de sustitución.","The record and follow-up stay in the asset history and count in the replacement score."],"O responsável lê o QR Code ou abre o link e assina com o dedo. A data e a hora são do servidor.":["El responsable lee el código QR o abre el enlace y firma con el dedo. La fecha y la hora son del servidor.","The person in charge scans the QR code or opens the link and signs with a finger. Date and time come from the server."],"O resultado depende de lançar o custo em cada serviço e saída de peça.":["El resultado depende de cargar el costo en cada servicio y salida de pieza.","The result depends on entering the cost in each service and part exit."],"O resultado é calculado pelo sistema com os limites da norma e conferido de novo pelo servidor. Reprovado deixa o equipamento INDISPONÍVEL e abre chamado urgente.":["El resultado lo calcula el sistema con los límites de la norma y lo verifica de nuevo el servidor. Reprobado deja el equipo NO DISPONIBLE y abre una solicitud urgente.","The result is calculated by the system with the standard limits and checked again by the server. Failed makes the equipment UNAVAILABLE and opens an urgent request."],"O sistema ainda está vazio. Veja a ordem recomendada para montar tudo.":["El sistema aún está vacío. Vea el orden recomendado para armar todo.","The system is still empty. See the recommended order to set everything up."],"O sistema começa vazio. Siga a ordem abaixo para montar a operação da empresa. As etapas se marcam sozinhas.":["El sistema empieza vacío. Siga el orden de abajo para armar la operación de la empresa. Las etapas se marcan solas.","The system starts empty. Follow the order below to set up company operations. Steps tick themselves."],"O termo deste ambiente é gerado com a lista de bens e assinado pelo responsável. Ele fica no módulo Termos de responsabilidade.":["El término de este ambiente se genera con la lista de bienes y lo firma el responsable. Queda en el módulo Términos de responsabilidad.","This room's term is created with the asset list and signed by the person in charge. It is in the Responsibility terms module."],"O ícone do Atalaia System aparece na tela do celular e abre como aplicativo. Em breve também na Play Store.":["El ícono de Atalaia System aparece en la pantalla del celular y abre como aplicación. Pronto también en Play Store.","The Atalaia System icon shows on the phone screen and opens as an app. Coming soon to the Play Store."],"Obriga o Plano de Manutenção, Operação e Controle (PMOC) dos sistemas de climatização, com responsável técnico.":["Obliga el Plan de Mantenimiento, Operación y Control (PMOC) de los sistemas de climatización, con responsable técnico.","Requires the Maintenance, Operation and Control Plan (PMOC) for HVAC systems, with a technical lead."],"Obriga o plano de manutenção, operação e controle dos sistemas de ar-condicionado.":["Obliga el plan de mantenimiento, operación y control de los sistemas de aire acondicionado.","Requires the maintenance, operation and control plan for air conditioning systems."],"Obrigatória para Gestores e Administradores. Mesmo que alguém descubra a senha, não entra sem o código do seu celular.":["Obligatoria para Gestores y Administradores. Aunque alguien descubra la contraseña, no entra sin el código de su celular.","Required for Managers and Administrators. Even if someone finds out the password, they cannot sign in without the code from your phone."],"Onze relatórios em PDF e planilha, com filtro de período, e o relatório mensal gerado automaticamente no dia 1º.":["Once informes en PDF y planilla, con filtro de período, y el informe mensual generado automáticamente el día 1.","Eleven reports in PDF and spreadsheet, with period filter, and the monthly report created automatically on the 1st."],"Opcional. Volta a ficar disponível quando o serviço aprovado é registrado.":["Opcional. Vuelve a estar disponible cuando se registra el servicio aprobado.","Optional. Becomes available again when the approved service is recorded."],"Operação: controle do ciclo de vida (aquisição, uso, manutenção, desativação e descarte) e dos serviços terceirizados.":["Operación: control del ciclo de vida (adquisición, uso, mantenimiento, desactivación y descarte) y de los servicios tercerizados.","Operation: life cycle control (acquisition, use, maintenance, decommissioning and disposal) and outsourced services."],"Ordem recomendada para colocar o sistema em uso em uma empresa nova.":["Orden recomendado para poner el sistema en uso en una empresa nueva.","Recommended order to start using the system in a new company."],"Os POPs em PDF são baixados pelo Gestor ou pelo Administrador.":["Los POPs en PDF los descargan el Gestor o el Administrador.","SOP PDFs are downloaded by the Manager or the Administrator."],"Os dados pertencem à empresa contratante. A equipe Atalaia só acessa com autorização, por tempo limitado e com registro.":["Los datos pertenecen a la empresa contratante. El equipo Atalaia solo accede con autorización, por tiempo limitado y con registro.","Data belongs to the customer company. The Atalaia team only accesses it with authorization, for a limited time and logged."],"Os demais Gestores cuidam de Administradores e Colaboradores.":["Los demás Gestores se ocupan de Administradores y Colaboradores.","Other Managers handle Administrators and Technicians."],"Os grupos são criados pelo Gestor em Configurações › Grupos de usuários.":["Los grupos los crea el Gestor en Configuración › Grupos de usuarios.","Groups are created by the Manager in Settings › User groups."],"Os limites do plano (bens, ambientes, usuários) somam todas as filiais.":["Los límites del plan (bienes, ambientes, usuarios) suman todas las filiales.","Plan limits (assets, rooms, users) add up all branches."],"Os mesmos indicadores do Dashboard, com as cores da empresa, prontos para imprimir, mandar para a diretoria ou guardar. Visão:":["Los mismos indicadores del Dashboard, con los colores de la empresa, listos para imprimir, enviar a la dirección o guardar. Vista:","The same Dashboard indicators, in company colors, ready to print, send to management or keep. View:"],"Os mesmos indicadores usados pelos sistemas de manutenção do mercado.":["Los mismos indicadores que usan los sistemas de mantenimiento del mercado.","The same indicators used by maintenance systems on the market."],"Os números ficam reservados para a sua empresa e nunca são reaproveitados.":["Los números quedan reservados para su empresa y nunca se reutilizan.","Numbers are reserved for your company and never reused."],"Os testes de radiologia devem ser feitos ou assinados por profissional habilitado.":["Las pruebas de radiología deben hacerlas o firmarlas un profesional habilitado.","Radiology tests must be done or signed by a qualified professional."],"Painel no computador: acompanha, cadastra, configura e gera os relatórios.":["Panel en la computadora: sigue, registra, configura y genera los informes.","Panel on the computer: follow up, register, configure and create reports."],"Para a prestação de contas: tudo o que foi excluído continua registrado, com quem excluiu e o motivo.":["Para la rendición de cuentas: todo lo eliminado sigue registrado, con quién eliminó y el motivo.","For accountability: everything deleted stays recorded, with who deleted it and why."],"Para condomínios, escolas, prédios e facilities: manutenção predial, climatização, rondas, chamados e estoque. Esconde tecnovigilância.":["Para condominios, escuelas, edificios y facilities: mantenimiento edilicio, climatización, rondas, solicitudes e inventario. Oculta tecnovigilancia.","For condominiums, schools, buildings and facilities: building maintenance, HVAC, rounds, requests and stock. Hides technovigilance."],"Para escritórios, lojas e advocacias: patrimônio, etiquetas, chamados, termos e relatórios. Esconde radiologia/odontologia, tecnovigilância, substituição e treinamentos.":["Para oficinas, tiendas y estudios jurídicos: patrimonio, etiquetas, solicitudes, términos e informes. Oculta radiología/odontología, tecnovigilancia, sustitución y capacitaciones.","For offices, stores and law firms: assets, labels, requests, terms and reports. Hides radiology/dentistry, technovigilance, replacement and training."],"Para levar os números a uma reunião, clique em Relatório do Dashboard e baixe o PDF.":["Para llevar los números a una reunión, haga clic en Informe del Dashboard y descargue el PDF.","To take the numbers to a meeting, click Dashboard report and download the PDF."],"Para mapear um ambiente, toque em Ler QR / etiqueta e aponte a câmera para o QR Code fixado na entrada.":["Para mapear un ambiente, toque Leer QR / etiqueta y apunte la cámara al código QR fijado en la entrada.","To map a room, tap Scan QR / label and point the camera at the QR code at the entrance."],"Para muitos bens de uma vez, use o botão Planilha e importe o arquivo modelo.":["Para muchos bienes de una vez, use el botón Planilla e importe el archivo modelo.","For many assets at once, use the Spreadsheet button and import the template file."],"Para quem faz manutenção para outras empresas: cada unidade vira um":["Para quien hace mantenimiento para otras empresas: cada unidad pasa a ser un","For those who do maintenance for other companies: each unit becomes a"],"Pedido enviado. A equipe do Atalaia System cria o acesso e a pessoa recebe o e-mail para criar a senha.":["Pedido enviado. El equipo de Atalaia System crea el acceso y la persona recibe el e-mail para crear la contraseña.","Request sent. The Atalaia System team creates the access and the person gets the e-mail to create a password."],"Pedido, decisão, cada consulta e o encerramento ficam no registro de acessos da empresa.":["Pedido, decisión, cada consulta y el cierre quedan en el registro de accesos de la empresa.","Request, decision, each view and the closing stay in the company access log."],"Pelo menos uma vez por ano em cada ambiente, ou quando houver suspeita de divergência.":["Al menos una vez al año en cada ambiente, o cuando haya sospecha de divergencia.","At least once a year in each room, or when a discrepancy is suspected."],"Pendências, preventivas, medições, corretivas, gás refrigerante, qualidade do ar e inventário de climatização":["Pendientes, preventivas, mediciones, correctivas, gas refrigerante, calidad del aire e inventario de climatización","Open items, preventive, readings, corrective, refrigerant, air quality and HVAC inventory"],"Pessoas com acesso ao sistema da empresa e das filiais. O Gestor define o perfil e a unidade de cada uma.":["Personas con acceso al sistema de la empresa y de las filiales. El Gestor define el perfil y la unidad de cada una.","People with access to the company and branch system. The Manager sets each person's role and unit."],"Peça usada sem saída registrada deixa o custo do equipamento errado.":["Una pieza usada sin salida registrada deja mal el costo del equipo.","A part used without a recorded exit makes the equipment cost wrong."],"Placa muito fina: teste a leitura do código antes de imprimir o lote.":["Placa muy fina: pruebe la lectura del código antes de imprimir el lote.","Very thin plate: test code scanning before printing the batch."],"Planejamento: plano de gestão de ativos, riscos e oportunidades, decisões baseadas em dados.":["Planificación: plan de gestión de activos, riesgos y oportunidades, decisiones basadas en datos.","Planning: asset management plan, risks and opportunities, data-based decisions."],"Posição de hoje · critérios: idade x vida útil, chamados em 12 meses, custo de manutenção x valor, estado e tecnovigilância":["Posición de hoy · criterios: edad vs. vida útil, solicitudes en 12 meses, costo de mantenimiento vs. valor, estado y tecnovigilancia","Today's position · criteria: age vs. service life, requests in 12 months, maintenance cost vs. value, condition and technovigilance"],"Prazo para aceitar e para resolver, por prioridade. Vale para os chamados abertos daqui para frente.":["Plazo para aceptar y para resolver, por prioridad. Vale para las solicitudes abiertas de aquí en adelante.","Deadline to accept and to resolve, by priority. Applies to requests opened from now on."],"Prazos de SLA: prazos para aceitar e resolver por prioridade.":["Plazos de SLA: plazos para aceptar y resolver por prioridad.","SLA deadlines: deadlines to accept and resolve by priority."],"Preencha cidade e UF (botão 📍 em Empresa e filiais ou no cadastro da empresa contratada)":["Complete ciudad y estado (botón 📍 en Empresa y filiales o en el registro de la empresa contratada)","Fill in city and state (📍 button in Company and branches or in the contracted company record)"],"Preencha se o bem é ar-condicionado, VRF, UTA, fancoil, renovação de ar ou exaustão. Ele passa a aparecer na página Climatização e no documento PMOC.":["Complete si el bien es aire acondicionado, VRF, UTA, fancoil, renovación de aire o extracción. Pasa a aparecer en la página Climatización y en el documento PMOC.","Fill in if the asset is air conditioning, VRF, AHU, fan coil, air renewal or exhaust. It then shows on the HVAC page and in the PMOC document."],"Preencha valor e data de aquisição, vida útil e, se for equipamento de saúde, o registro na Anvisa.":["Complete valor y fecha de adquisición, vida útil y, si es equipo de salud, el registro en Anvisa.","Fill in value and acquisition date, service life and, for health equipment, the Anvisa registration."],"Prestadores não anexam laudos: o Gestor ou o Administrador anexa na ficha do equipamento.":["Los prestadores no adjuntan informes: el Gestor o el Administrador adjunta en la ficha del equipo.","Providers do not attach reports: the Manager or Administrator attaches them to the equipment sheet."],"Preventiva acima de 95%, disponibilidade, tempo médio de reparo.":["Preventiva por encima de 95%, disponibilidad, tiempo medio de reparación.","Preventive above 95%, availability, mean time to repair."],"Preventivas, recargas, laudos e a ART ficam registrados por aparelho e por unidade.":["Preventivas, recargas, informes y la ART quedan registrados por equipo y por unidad.","Preventive jobs, refills, reports and the ART are recorded per unit and per site."],"Profissional responsável pelo plano, que avalia a efetividade TODO ANO.":["Profesional responsable del plan, que evalúa la efectividad CADA AÑO.","Professional in charge of the plan, who assesses its effectiveness EVERY YEAR."],"Programa de manutenção do prédio: extintores, emergência, elétrica, SPDA, água e telhado (NBR 5674)":["Programa de mantenimiento del edificio: extintores, emergencia, eléctrica, SPDA, agua y techo (NBR 5674)","Building maintenance program: extinguishers, emergency, electrical, lightning protection, water and roof (NBR 5674)"],"Programar e registrar calibração, preventiva, corretiva e TSE":["Programar y registrar calibración, preventiva, correctiva y TSE","Schedule and record calibration, preventive, corrective and electrical safety"],"Programação excluída. O registro foi para a caixa Excluídos do Gestor.":["Programación eliminada. El registro fue a la caja Eliminados del Gestor.","Schedule deleted. The record went to the Manager's Deleted box."],"Programações vencidas, não conformidades abertas e medições fora da faixa no período.":["Programaciones vencidas, no conformidades abiertas y mediciones fuera del rango en el período.","Overdue schedules, open nonconformities and out-of-range readings in the period."],"Programe a calibração ou preventiva do bem com a periodicidade.":["Programe la calibración o preventiva del bien con la periodicidad.","Schedule the asset calibration or preventive job with its frequency."],"Programe as preventivas dos aparelhos (POP-08) com os checklists de climatização.":["Programe las preventivas de los equipos (POP-08) con las listas de climatización.","Schedule the units' preventive jobs (SOP-08) with the HVAC checklists."],"Projeto físico de estabelecimentos de saúde: unidades funcionais e ambientes. Base da lista de ambientes.":["Proyecto físico de establecimientos de salud: unidades funcionales y ambientes. Base de la lista de ambientes.","Physical design of health facilities: functional units and rooms. Basis of the room list."],"Projeto físico dos estabelecimentos de saúde: unidades funcionais e ambientes. Base da lista de ambientes do Atalaia.":["Proyecto físico de los establecimientos de salud: unidades funcionales y ambientes. Base de la lista de ambientes de Atalaia.","Physical design of health facilities: functional units and rooms. Basis of the Atalaia room list."],"Proteção de dados pessoais: vale para nomes, telefones, e-mails e fotos cadastrados no sistema.":["Protección de datos personales: vale para nombres, teléfonos, e-mails y fotos registrados en el sistema.","Personal data protection: applies to names, phones, e-mails and photos registered in the system."],"Qualquer pessoa abre um chamado pelo QR Code do ambiente, sem login. Os manutencionistas recebem na hora, assumem, registram fotos de antes e depois e o responsável confirma.":["Cualquier persona abre una solicitud por el código QR del ambiente, sin login. Los técnicos de mantenimiento la reciben al instante, la asumen, registran fotos de antes y después y el responsable confirma.","Anyone opens a request via the room QR code, without login. Maintenance technicians get it right away, take it, record before and after photos and the person in charge confirms."],"Quando aparecer um pedido de acesso ou um comunicado no Dashboard.":["Cuando aparezca un pedido de acceso o un comunicado en el Dashboard.","When an access request or announcement shows on the Dashboard."],"Quando entrar ou sair bem do ambiente, o termo aparece como Precisa atualizar: gere um novo.":["Cuando entre o salga un bien del ambiente, el término aparece como Debe actualizarse: genere uno nuevo.","When an asset enters or leaves the room, the term shows Needs updating: create a new one."],"Quando o bem for descartado, doado, vendido, devolvido ao dono ou perdido.":["Cuando el bien sea descartado, donado, vendido, devuelto al dueño o perdido.","When the asset is disposed of, donated, sold, returned to its owner or lost."],"Quando o serviço for feito, clique em registrar serviço e preencha data, empresa ou técnico, resultado e custo.":["Cuando se haga el servicio, haga clic en registrar servicio y complete fecha, empresa o técnico, resultado y costo.","When the service is done, click record service and fill in date, company or technician, result and cost."],"Queda na rede de gases ou falha de gerador: manutenção, Administrador e Gestor.":["Caída en la red de gases o falla de generador: mantenimiento, Administrador y Gestor.","Gas line drop or generator failure: maintenance, Administrator and Manager."],"Queixas técnicas e eventos adversos com equipamentos e produtos para a saúde, acompanhados até a notificação à Anvisa.":["Quejas técnicas y eventos adversos con equipos y productos para la salud, seguidos hasta la notificación a Anvisa.","Technical complaints and adverse events with health equipment and products, followed up to the Anvisa report."],"Quem concluiu não pode confirmar o próprio chamado quando a segregação estiver ligada.":["Quien concluyó no puede confirmar su propia solicitud cuando la segregación esté activada.","Whoever closed it cannot confirm their own request when segregation is on."],"RDC Anvisa 509/2021 (gerenciamento de tecnologias em saúde) · NBR 5674 (manutenção de edificações)":["RDC Anvisa 509/2021 (gestión de tecnologías en salud) · NBR 5674 (mantenimiento de edificaciones)","RDC Anvisa 509/2021 (health technology management) · NBR 5674 (building maintenance)"],"RDC Anvisa 509/2021 · NBR IEC 60601-1 e IEC 62353 (segurança elétrica)":["RDC Anvisa 509/2021 · NBR IEC 60601-1 y IEC 62353 (seguridad eléctrica)","RDC Anvisa 509/2021 · NBR IEC 60601-1 and IEC 62353 (electrical safety)"],"Radioproteção: levantamento radiométrico e testes dos raios X":["Radioprotección: relevamiento radiométrico y pruebas de los rayos X","Radiation protection: radiation survey and X-ray tests"],"Raio X fixo, raio X móvel, arco cirúrgico, mamógrafo, tomógrafo, processadora/CR/DR":["Rayos X fijo, rayos X móvil, arco quirúrgico, mamógrafo, tomógrafo, procesadora/CR/DR","Fixed X-ray, mobile X-ray, C-arm, mammography, CT, processor/CR/DR"],"Recargas frequentes indicam vazamento: abra chamado corretivo.":["Recargas frecuentes indican fuga: abra una solicitud correctiva.","Frequent refills indicate a leak: open a corrective request."],"Reclamações, sugestões e elogios enviados pelo QR Code do ambiente.":["Reclamos, sugerencias y elogios enviados por el código QR del ambiente.","Complaints, suggestions and compliments sent via the room QR code."],"Referência de engenharia clínica para equipamentos críticos: atender em até 30 minutos e resolver em até 24 horas.":["Referencia de ingeniería clínica para equipos críticos: atender en hasta 30 minutos y resolver en hasta 24 horas.","Clinical engineering benchmark for critical equipment: respond within 30 minutes and resolve within 24 hours."],"Referência para montar o plano. Ajuste a periodicidade ao fabricante, ao projeto e ao seu programa de qualidade. Os checklists ficam em Calibrações › Analisadores e checklists.":["Referencia para armar el plan. Ajuste la periodicidad al fabricante, al proyecto y a su programa de calidad. Las listas de verificación están en Calibraciones › Analizadores y listas de verificación.","Reference for building the plan. Adjust the frequency to the manufacturer, the design and your quality program. Checklists are in Calibrations › Analyzers and checklists."],"Registrar a empresa principal e cada filial, com os dados que saem nos relatórios, termos e etiquetas.":["Registrar la empresa principal y cada filial, con los datos que salen en los informes, términos y etiquetas.","Register the main company and each branch, with the data shown on reports, terms and labels."],"Registrar defeitos de produto e eventos com risco ao paciente ou ao profissional e acompanhar até a notificação.":["Registrar defectos de producto y eventos con riesgo para el paciente o el profesional y seguirlos hasta la notificación.","Record product defects and events with risk to patients or staff and follow them up to reporting."],"Registrar quem responde pelos bens de cada ambiente, com assinatura.":["Registrar quién responde por los bienes de cada ambiente, con firma.","Record who is accountable for the assets in each room, with signature."],"Registrar toda mudança de bem entre ambientes ou unidades, e os empréstimos com data de volta.":["Registrar todo movimiento de bien entre ambientes o unidades, y los préstamos con fecha de vuelta.","Record every asset move between rooms or units, and loans with a return date."],"Regras internas da clínica para abertura e fechamento de chamados.":["Reglas internas de la clínica para apertura y cierre de solicitudes.","Clinic internal rules for opening and closing requests."],"Relatórios e arquivos são gerados pelo Gestor ou pelo Administrador. Peça a eles.":["Los informes y archivos los generan el Gestor o el Administrador. Pídaselos.","Reports and files are created by the Manager or Administrator. Ask them."],"Reserva uma faixa de números (ex.: 1 a 100) para imprimir e colar.":["Reserva un rango de números (ej.: 1 a 100) para imprimir y pegar.","Reserves a number range (e.g.: 1 to 100) to print and stick."],"Resolver o que precisa de atenção agora: atrasos, vencimentos e pendências.":["Resolver lo que necesita atención ahora: atrasos, vencimientos y pendientes.","Solve what needs attention now: delays, due dates and open items."],"Responsável técnico ainda não informado. A Lei 13.589/2018 exige PMOC com responsável técnico habilitado.":["Responsable técnico aún no informado. La Ley 13.589/2018 exige PMOC con responsable técnico habilitado.","Technical lead not given yet. Law 13,589/2018 requires a PMOC with a qualified technical lead."],"Resumo do mês em tabelas: bens e ambientes com mais chamados, fora do prazo, vencidas, ações para o próximo mês e glossário":["Resumen del mes en tablas: bienes y ambientes con más solicitudes, fuera de plazo, vencidas, acciones para el próximo mes y glosario","Month summary in tables: assets and rooms with most requests, late, overdue, actions for next month and glossary"],"Resumo, chamados do período, inventário e calibrações deste ambiente em um PDF.":["Resumen, solicitudes del período, inventario y calibraciones de este ambiente en un PDF.","Summary, period requests, inventory and calibrations of this room in one PDF."],"Retirar do patrimônio um bem que saiu de uso, com motivo, destino, laudo e termo.":["Retirar del patrimonio un bien que salió de uso, con motivo, destino, informe y término.","Remove an out-of-use asset from the asset base, with reason, destination, report and term."],"Rondas de inspeção pelo celular, com foto em cada ponto e registro dos itens conformes e não conformes.":["Rondas de inspección por el celular, con foto en cada punto y registro de los ítems conformes y no conformes.","Inspection rounds on the phone, with a photo at each point and a record of compliant and noncompliant items."],"Roteiro com todos os ambientes. Abra o ambiente, marque cada item como Normal ou Ocorrência e feche. Ocorrência abre chamado sozinha. Os horários são gravados pelo servidor.":["Recorrido con todos los ambientes. Abra el ambiente, marque cada ítem como Normal u Ocurrencia y cierre. Una ocurrencia abre solicitud sola. Los horarios los graba el servidor.","Route with all rooms. Open the room, mark each item Normal or Issue and close. An issue opens a request by itself. Times are saved by the server."],"Saber o que está em aberto e evitar que a empresa fique em só leitura.":["Saber qué está pendiente y evitar que la empresa quede en solo lectura.","Know what is outstanding and keep the company from going read-only."],"Saber quais leis e normas se aplicam, onde ler o texto oficial e manter os documentos obrigatórios em dia.":["Saber qué leyes y normas se aplican, dónde leer el texto oficial y mantener los documentos obligatorios al día.","Know which laws and standards apply, where to read the official text and keep required documents up to date."],"Saem com data e hora do servidor, equipamento, local e GPS. Vão para o histórico do bem e para os relatórios com fotos. Até 12 fotos.":["Salen con fecha y hora del servidor, equipo, lugar y GPS. Van al historial del bien y a los informes con fotos. Hasta 12 fotos.","They carry server date and time, equipment, location and GPS. They go to the asset history and photo reports. Up to 12 photos."],"Sair de todos os aparelhos? Você e qualquer outro computador, tablet ou celular conectado com a sua conta precisarão entrar de novo.":["¿Salir de todos los dispositivos? Usted y cualquier otra computadora, tablet o celular conectado con su cuenta deberán entrar de nuevo.","Sign out of all devices? You and any other computer, tablet or phone signed in with your account will need to sign in again."],"Salve. A filial passa a aparecer nos filtros, no Dashboard e nos relatórios.":["Guarde. La filial pasa a aparecer en los filtros, en el Dashboard y en los informes.","Save. The branch then shows in filters, the Dashboard and reports."],"Salve: a próxima data é calculada sozinha. Não conformidade pode abrir chamado corretivo automaticamente.":["Guarde: la próxima fecha se calcula sola. Una no conformidad puede abrir una solicitud correctiva automáticamente.","Save: the next date is calculated automatically. A nonconformity can open a corrective request automatically."],"Se a empresa perder essa conta, peça a troca à equipe do Atalaia System.":["Si la empresa pierde esa cuenta, pida el cambio al equipo de Atalaia System.","If the company loses this account, ask the Atalaia System team to change it."],"Se alguém entrou por um aparelho que não reconhece, peça para a pessoa trocar a senha e usar “Sair de todos os aparelhos”. O Gestor pode desativar o acesso na tela Equipe.":["Si alguien entró desde un dispositivo que no reconoce, pida a la persona que cambie la contraseña y use “Salir de todos los dispositivos”. El Gestor puede desactivar el acceso en la pantalla Equipo.","If someone signed in from a device they do not recognize, ask them to change the password and use “Sign out of all devices”. The Manager can deactivate access on the Team screen."],"Se aparecer A equipe Atalaia System pediu acesso de suporte, leia o motivo e o tempo pedido.":["Si aparece El equipo de Atalaia System pidió acceso de soporte, lea el motivo y el tiempo pedido.","If The Atalaia System team requested support access shows, read the reason and time requested."],"Se aparecer Fatura em atraso no Dashboard, confira a data em que a empresa entraria em só leitura.":["Si aparece Factura atrasada en el Dashboard, revise la fecha en que la empresa pasaría a solo lectura.","If Overdue invoice shows on the Dashboard, check the date the company would go read-only."],"Se entrar ou sair bem, o termo aparece como Precisa atualizar.":["Si entra o sale un bien, el término aparece como Debe actualizarse.","If an asset enters or leaves, the term shows Needs updating."],"Se for aparelho de climatização ou de uma área técnica, preencha a parte Climatização (PMOC) ou Área técnica.":["Si es un equipo de climatización o de un área técnica, complete la parte Climatización (PMOC) o Área técnica.","For an HVAC unit or technical area equipment, fill in the HVAC (PMOC) or Technical area part."],"Se mudar o responsável, gere um termo novo em Termos de responsabilidade.":["Si cambia el responsable, genere un término nuevo en Términos de responsabilidad.","If the person in charge changes, create a new term in Responsibility terms."],"Se uma unidade ficar 3 dias sem ronda, o Gestor recebe o alerta e pode acionar o Administrador.":["Si una unidad queda 3 días sin ronda, el Gestor recibe la alerta y puede avisar al Administrador.","If a unit goes 3 days without a round, the Manager gets an alert and can notify the Administrator."],"Seguir o programa de manutenção de cada área técnica com as rotinas sugeridas e checklists prontos.":["Seguir el programa de mantenimiento de cada área técnica con las rutinas sugeridas y listas listas.","Follow each technical area maintenance program with suggested routines and ready checklists."],"Segurança: inventário, preventiva/calibração/TSE, equipamentos indisponíveis identificados, contingência.":["Seguridad: inventario, preventiva/calibración/TSE, equipos no disponibles identificados, contingencia.","Safety: inventory, preventive/calibration/electrical safety, unavailable equipment identified, contingency."],"Sem internet e sem dados guardados desta parte. Abra com internet uma vez.":["Sin internet y sin datos guardados de esta parte. Abra con internet una vez.","Offline with no saved data for this part. Open it once with internet."],"Sem internet: o painel está só para consulta. Para alterar, conecte-se à internet.":["Sin internet: el panel está solo para consulta. Para cambiar, conéctese a internet.","Offline: the panel is view-only. To make changes, connect to the internet."],"Sem login: basta ler o QR Code do ambiente com a câmera do celular.":["Sin login: basta leer el código QR del ambiente con la cámara del celular.","No login: just scan the room QR code with the phone camera."],"Sem vida útil informada, o sistema usa 10 anos. É um apoio: a decisão final considera também a segurança do paciente, a disponibilidade de peças e o orçamento.":["Sin vida útil informada, el sistema usa 10 años. Es un apoyo: la decisión final considera también la seguridad del paciente, la disponibilidad de piezas y el presupuesto.","Without a service life given, the system uses 10 years. It is a support: the final decision also weighs patient safety, parts availability and budget."],"Sempre que um equipamento ou produto apresentar falha ou causar dano.":["Siempre que un equipo o producto presente falla o cause daño.","Whenever equipment or a product fails or causes harm."],"Serviço registrado como REPROVADO: equipamento indisponível e chamado urgente aberto.":["Servicio registrado como REPROBADO: equipo no disponible y solicitud urgente abierta.","Service recorded as FAILED: equipment unavailable and urgent request opened."],"Somente leitura: os dados da empresa e das unidades são alterados pelos Gestores.":["Solo lectura: los datos de la empresa y de las unidades los modifican los Gestores.","Read-only: company and unit data are changed by the Managers."],"Sábado, das 22h às 23h, o sistema pode ficar fora do ar por alguns minutos para atualização. Nada precisa ser feito.":["Sábado, de 22h a 23h, el sistema puede quedar fuera de línea por algunos minutos para actualización. No hay que hacer nada.","Saturday, 10 to 11 pm, the system may be offline for a few minutes for an update. Nothing needs to be done."],"Só o titular do sistema vê esta parte, para liberar no futuro como atualização.":["Solo el titular del sistema ve esta parte, para liberarla en el futuro como actualización.","Only the system owner sees this part, to release it later as an update."],"Tamanho, formato, cores, fonte e logo. A prévia mostra a placa no tamanho aproximado.":["Tamaño, formato, colores, fuente y logo. La vista previa muestra la placa en tamaño aproximado.","Size, shape, colors, font and logo. The preview shows the plate at approximate size."],"Tempo médio de reparo: do início do atendimento até a conclusão.":["Tiempo medio de reparación: desde el inicio de la atención hasta la conclusión.","Mean time to repair: from service start to completion."],"Termo desatualizado não protege a empresa: atualize sempre que a lista mudar.":["Un término desactualizado no protege a la empresa: actualícelo siempre que la lista cambie.","An outdated term does not protect the company: update it whenever the list changes."],"Termo gerado automaticamente com a lista de bens de cada ambiente e assinado pelo celular.":["Término generado automáticamente con la lista de bienes de cada ambiente y firmado por el celular.","Term created automatically with each room's asset list and signed on the phone."],"Termos de Uso do Atalaia System · Código de Defesa do Consumidor (arrependimento)":["Términos de Uso de Atalaia System · Código de Defensa del Consumidor (arrepentimiento)","Atalaia System Terms of Use · Consumer Protection Code (withdrawal)"],"Teste feito por empresa terceirizada sem o certificado anexado. Registrar mesmo assim? (o ideal é anexar o PDF do certificado)":["Prueba hecha por empresa tercerizada sin el certificado adjunto. ¿Registrar de todos modos? (lo ideal es adjuntar el PDF del certificado)","Test done by an outside company without the certificate attached. Record anyway? (ideally attach the certificate PDF)"],"Testes de aceitação e de constância, levantamento radiométrico, medições e pendências (RDC 611/2022)":["Pruebas de aceptación y de constancia, relevamiento radiométrico, mediciones y pendientes (RDC 611/2022)","Acceptance and constancy tests, radiation survey, readings and open items (RDC 611/2022)"],"Tirar esta peça da lista? O histórico de movimentos continua guardado.":["¿Quitar esta pieza de la lista? El historial de movimientos sigue guardado.","Remove this part from the list? The movement history stays saved."],"Tirar relatórios confiáveis em PDF e Excel para gestão, auditoria e prestação de contas.":["Sacar informes confiables en PDF y Excel para gestión, auditoría y rendición de cuentas.","Get reliable PDF and Excel reports for management, audit and accountability."],"Tire a foto, leia a etiqueta de patrimônio pelo botão da câmera, preencha nome, categoria e situação. Os demais campos ficam em Mais detalhes.":["Saque la foto, lea la etiqueta de patrimonio con el botón de la cámara, complete nombre, categoría y situación. Los demás campos están en Más detalles.","Take the photo, scan the asset label with the camera button, fill in name, category and status. Other fields are in More details."],"Tire as fotos na hora: elas saem com nº, filial, ambiente, hora do servidor e localização.":["Saque las fotos en el momento: salen con nº, filial, ambiente, hora del servidor y ubicación.","Take photos on the spot: they carry number, branch, room, server time and location."],"Toda vez que alguém entra no painel ou no aplicativo, fica guardado quem foi, quando e por qual aparelho. Em destaque:":["Cada vez que alguien entra al panel o a la aplicación, queda guardado quién fue, cuándo y desde qué dispositivo. Destacado:","Every time someone signs in to the panel or app, who, when and which device are saved. Highlighted:"],"Todas as pessoas lado a lado: chamados, no prazo, tempo de atendimento e reparo, estrelas e custo":["Todas las personas lado a lado: solicitudes, en plazo, tiempo de atención y reparación, estrellas y costo","Everyone side by side: requests, on time, response and repair time, stars and cost"],"Todo dia, no início do expediente, e antes de reuniões de resultado.":["Todos los días, al inicio del horario, y antes de reuniones de resultados.","Every day, at the start of the workday, and before results meetings."],"Todos com filtro de período e saída em PDF e Excel. Os números vêm dos registros com data e hora do servidor.":["Todos con filtro de período y salida en PDF y Excel. Los números vienen de los registros con fecha y hora del servidor.","All with period filter and PDF and Excel output. Numbers come from records with server date and time."],"Tomada de ar externo longe de fontes de poluição e com filtro.":["Toma de aire externo lejos de fuentes de contaminación y con filtro.","Outdoor air intake away from pollution sources and filtered."],"Toque em Autorizar para liberar a consulta pelo tempo pedido, ou em Negar.":["Toque Autorizar para habilitar la consulta por el tiempo pedido, o Negar.","Tap Authorize to allow viewing for the time requested, or Deny."],"Toque em Enviar: aparece o número do chamado para acompanhar.":["Toque Enviar: aparece el número de la solicitud para seguirla.","Tap Send: the request number shows so you can follow up."],"Toque na sua foto no canto de cima para trocar a foto ou sair.":["Toque su foto en la esquina superior para cambiar la foto o salir.","Tap your photo at the top corner to change the photo or sign out."],"Toque num ambiente para ver tudo dele: chamados, inventário, calibrações, termo e relatório.":["Toque un ambiente para ver todo sobre él: solicitudes, inventario, calibraciones, término e informe.","Tap a room to see everything about it: requests, inventory, calibrations, term and report."],"Traga o histórico do sistema antigo ou de planilhas. Cada linha vai para o":["Traiga el historial del sistema antiguo o de planillas. Cada fila va al","Bring history from the old system or spreadsheets. Each row goes to the"],"Tratar reclamações, sugestões e elogios enviados pelo QR Code.":["Atender reclamos, sugerencias y elogios enviados por el código QR.","Handle complaints, suggestions and compliments sent via QR code."],"Trate as divergências: transfira, cadastre ou investigue os não localizados.":["Atienda las divergencias: transfiera, registre o investigue los no localizados.","Handle discrepancies: transfer, register or investigate those not found."],"Troca de senha e verificação em duas etapas ficam no aplicativo, na aba Plano › Sua conta e segurança.":["El cambio de contraseña y la verificación en dos pasos están en la aplicación, en la pestaña Plan › Su cuenta y seguridad.","Password change and two-step verification are in the app, in the Plan › Your account and security tab."],"Tudo claro: fundo branco e letras pretas, sem cores. O vermelho aparece só em atraso e erro.":["Todo claro: fondo blanco y letras negras, sin colores. El rojo aparece solo en atraso y error.","All light: white background and black text, no colors. Red shows only for delays and errors."],"Tudo do período em um só documento: chamados e SLA, equipe, preventivas, calibrações, corretivas, climatização, custos, estoque, rondas, auditorias, Avalie e inventário":["Todo el período en un solo documento: solicitudes y SLA, equipo, preventivas, calibraciones, correctivas, climatización, costos, inventario, rondas, auditorías, Evalúe e inventario","The whole period in one document: requests and SLA, team, preventive, calibrations, corrective, HVAC, costs, stock, rounds, audits, Feedback and inventory"],"Tudo em dia: nenhum atraso, nenhum chamado sem responsável e nenhuma programação vencida.":["Todo al día: ningún atraso, ninguna solicitud sin responsable y ninguna programación vencida.","All up to date: no delays, no unassigned requests and no overdue schedules."],"Um instrumento escolhido estava com a calibração VENCIDA na data do serviço. Registrar assim mesmo?":["Un instrumento elegido tenía la calibración VENCIDA en la fecha del servicio. ¿Registrar de todos modos?","A chosen instrument had an EXPIRED calibration on the service date. Record anyway?"],"Usa as regras abaixo para mandar o chamado novo direto ao técnico certo.":["Usa las reglas de abajo para enviar la solicitud nueva directo al técnico correcto.","Uses the rules below to send new requests straight to the right technician."],"Usa o expediente e os feriados cadastrados abaixo. Sem expediente cadastrado, o prazo continua contando 24 horas.":["Usa el horario y los feriados registrados abajo. Sin horario registrado, el plazo sigue contando 24 horas.","Uses the working hours and holidays registered below. Without working hours, the deadline keeps counting 24 hours."],"Usar produtos de limpeza biodegradáveis e registrados no Ministério da Saúde.":["Usar productos de limpieza biodegradables y registrados en el Ministerio de Salud.","Use biodegradable cleaning products registered with the Ministry of Health."],"Use Aceitar, Passar para outro, Iniciar, Concluir, Confirmar ou Reabrir.":["Use Aceptar, Pasar a otro, Iniciar, Concluir, Confirmar o Reabrir.","Use Accept, Pass to another, Start, Finish, Confirm or Reopen."],"Use o modo demonstração para treinar antes de lançar dados reais.":["Use el modo demostración para practicar antes de cargar datos reales.","Use demo mode to practice before entering real data."],"Use o nome que a equipe já usa. O \"Tipo na ronda\" define a lista de verificação. O QR Code do ambiente é gerado ao criar.":["Use el nombre que el equipo ya usa. El \"Tipo en la ronda\" define la lista de verificación. El código QR del ambiente se genera al crear.","Use the name the team already uses. The \"Round type\" sets the checklist. The room QR code is created on saving."],"Use os botões do resumo para ir direto à tela de cada assunto.":["Use los botones del resumen para ir directo a la pantalla de cada tema.","Use the summary buttons to go straight to each topic screen."],"Use os números na decisão de substituição (POP-18) e no orçamento.":["Use los números en la decisión de sustitución (POP-18) y en el presupuesto.","Use the numbers in the replacement decision (SOP-18) and the budget."],"Use quando a etiqueta rasgou, apagou ou caiu. O motivo fica registrado.":["Use cuando la etiqueta se rompió, se borró o se cayó. El motivo queda registrado.","Use when the label tore, faded or fell off. The reason is recorded."],"Vale para nomes, telefones, e-mails e fotos cadastrados no sistema. O Atalaia separa os dados por empresa, guarda o registro de acessos e permite exportar e excluir.":["Vale para nombres, teléfonos, e-mails y fotos registrados en el sistema. Atalaia separa los datos por empresa, guarda el registro de accesos y permite exportar y eliminar.","Applies to names, phones, e-mails and photos registered in the system. Atalaia separates data by company, keeps the access log and allows export and deletion."],"Vale para todos os relatórios: desmarcado, os valores dos bens não saem no PDF nem no Excel.":["Vale para todos los informes: desmarcado, los valores de los bienes no salen en el PDF ni en el Excel.","Applies to all reports: unticked, asset values are left out of the PDF and Excel."],"Valor contábil de cada bem: compra, vida útil, depreciação acumulada e do período (método linear)":["Valor contable de cada bien: compra, vida útil, depreciación acumulada y del período (método lineal)","Book value of each asset: purchase, service life, accumulated and period depreciation (straight-line)"],"Valores anotados pelo técnico no checklist. Fora da faixa vira “Não OK” e, com a automação ligada, abre corretiva.":["Valores anotados por el técnico en la lista. Fuera del rango pasa a “No OK” y, con la automatización activada, abre correctiva.","Values noted by the technician in the checklist. Out of range becomes “Not OK” and, with automation on, opens a corrective job."],"Veja a pontuação de cada equipamento: idade x vida útil, chamados em 12 meses, custo x valor, estado e tecnovigilância.":["Vea el puntaje de cada equipo: edad vs. vida útil, solicitudes en 12 meses, costo vs. valor, estado y tecnovigilancia.","See each equipment score: age vs. service life, requests in 12 months, cost vs. value, condition and technovigilance."],"Veja as rotinas sugeridas para os bens daquela área e programe as que se aplicam.":["Vea las rutinas sugeridas para los bienes de esa área y programe las que apliquen.","See the suggested routines for that area's assets and schedule those that apply."],"Veja o histórico em Configurações › LGPD › Acessos de suporte.":["Vea el historial en Configuración › LGPD › Accesos de soporte.","See the history in Settings › LGPD › Support access."],"Veja os alertas: chamados atrasados, calibrações vencidas, termos desatualizados, dias sem ronda.":["Vea las alertas: solicitudes atrasadas, calibraciones vencidas, términos desactualizados, días sin ronda.","See the alerts: late requests, overdue calibrations, outdated terms, days without a round."],"Veja os últimos 12 meses: chamados, calibrações, preventivas, corretivas e peças.":["Vea los últimos 12 meses: solicitudes, calibraciones, preventivas, correctivas y piezas.","See the last 12 months: requests, calibrations, preventive, corrective and parts."],"Ver a situação de cada ambiente por cor, abrir tudo o que acontece nele e localizar as unidades no mapa.":["Ver la situación de cada ambiente por color, abrir todo lo que pasa en él y ubicar las unidades en el mapa.","See each room status by color, open everything happening in it and find units on the map."],"Ver tudo o que foi excluído ou alterado, por quem e quando, e restaurar o que foi apagado por engano.":["Ver todo lo que se eliminó o modificó, por quién y cuándo, y restaurar lo borrado por error.","See everything deleted or changed, by whom and when, and restore what was deleted by mistake."],"Ver tudo o que já aconteceu com um equipamento numa linha do tempo.":["Ver todo lo que ya pasó con un equipo en una línea de tiempo.","See everything that happened to equipment on a timeline."],"Ver, logo ao entrar, o que precisa de ação e a situação da empresa ou da unidade.":["Ver, apenas al entrar, lo que requiere acción y la situación de la empresa o de la unidad.","See, right after signing in, what needs action and the company or unit status."],"Vigilância Sanitária (Lei 6.437/1977 e código sanitário local)":["Vigilancia Sanitaria (Ley 6.437/1977 y código sanitario local)","Health Surveillance (Law 6,437/1977 and local health code)"],"Você continua vendo e baixando tudo, mas não é possível lançar nada novo agora. Fale com o Gestor da empresa.":["Usted sigue viendo y descargando todo, pero no es posible registrar nada nuevo ahora. Hable con el Gestor de la empresa.","You can still see and download everything, but cannot add anything new now. Talk to the company Manager."],"Você saiu de todos os aparelhos. Em até 1 hora, nenhum outro aparelho continua com acesso.":["Usted salió de todos los dispositivos. En hasta 1 hora, ningún otro dispositivo sigue con acceso.","You signed out of all devices. Within 1 hour, no other device keeps access."],"Zere o saldo com um ajuste (com o motivo) antes de tirar a peça da lista.":["Ponga el saldo en cero con un ajuste (con el motivo) antes de quitar la pieza de la lista.","Zero the balance with an adjustment (with the reason) before removing the part from the list."],"a ser usados. Para reaproveitar os números, cancele primeiro os lotes mais novos.":["a usarse. Para reutilizar los números, cancele primero los lotes más nuevos.","to be used. To reuse the numbers, cancel the newest batches first."],"chamado aberto, vencimento em 30 dias ou equipamento parado ·":["solicitud abierta, vencimiento en 30 días o equipo parado ·","open request, due in 30 days or equipment down ·"],"chamado, corretiva, preventiva, calibração, TSE, laudo, parada":["solicitud, correctiva, preventiva, calibración, TSE, informe, parada","request, corrective, preventive, calibration, electrical safety, report, downtime"],"periodicidade do Anexo I da IN 90/2021 no seu programa de garantia da qualidade":["periodicidad del Anexo I de la IN 90/2021 en su programa de garantía de calidad","frequency from Annex I of IN 90/2021 in your quality assurance program"],"prazos, pendências, calibrações, equipamentos que mais falham, ambientes, Avalie, investimento, últimos cadastros e plano":["plazos, pendientes, calibraciones, equipos que más fallan, ambientes, Evalúe, inversión, últimos registros y plan","deadlines, open items, calibrations, most-failing equipment, rooms, Feedback, investment, latest records and plan"],"registrada. O termo de baixa pode ser baixado na ficha do bem.":["registrada. El término de baja puede descargarse en la ficha del bien.","recorded. The write-off term can be downloaded from the asset sheet."],"vai le attached). If an asset enters or leaves the room, the term shows “needs updating”."],"Apoio à decisão: cada equipamento ganha pontos pela idade em relação à vida útil, pelos chamados nos últimos 12 meses, pelo custo de manutenção em relação ao valor, pelo estado e pelos registros de tecnovigilância.":["Apoyo a la decisión: cada equipo suma puntos por la edad respecto a la vida útil, por las solicitudes de los últimos 12 meses, por el costo de mantenimiento respecto al valor, por el estado y por los registros de tecnovigilancia.","Decision support: each equipment scores points for age vs. service life, requests in the last 12 months, maintenance cost vs. value, condition and technovigilance records."],"Uma linha por equipamento e tipo de serviço. Ao registrar o serviço feito, a próxima data é calculada sozinha (calibração: 12 meses; preventiva: 6 meses, ou o que você definir).":["Una fila por equipo y tipo de servicio. Al registrar el servicio hecho, la próxima fecha se calcula sola (calibración: 12 meses; preventiva: 6 meses, o lo que usted defina).","One row per equipment and service type. When the service is recorded, the next date is calculated automatically (calibration: 12 months; preventive: 6 months, or what you set)."],"Análise semestral em laboratório (amostra interna e externa). O sistema confere os valores e avisa 15 dias antes de vencer.":["Análisis semestral en laboratorio (muestra interna y externa). El sistema revisa los valores y avisa 15 días antes de vencer.","Half-yearly lab analysis (indoor and outdoor sample). The system checks the values and warns 15 days before expiry."],"Registre cada recarga. Duas no mesmo aparelho em 6 meses = possível vazamento (o Gestor é avisado).":["Registre cada recarga. Dos en el mismo equipo en 6 meses = posible fuga (se avisa al Gestor).","Record each refill. Two on the same unit in 6 months = possible leak (the Manager is notified)."],"RDC 611/2022 e IN 90/2021 (radiografia médica). Testes de aceitação e de constância feitos ou supervisionados por físico médico; levantamento radiométrico a cada 4 anos ou após mudança.":["RDC 611/2022 e IN 90/2021 (radiografía médica). Pruebas de aceptación y de constancia hechas o supervisadas por físico médico; relevamiento radiométrico cada 4 años o después de cambios.","RDC 611/2022 and IN 90/2021 (medical radiography). Acceptance and constancy tests done or supervised by a medical physicist; radiation survey every 4 years or after changes."],"Equipamentos de terceiros (locação e comodato), fornecedores, assistência técnica e empresas de calibração, com contrato e equipamentos de cada uma.":["Equipos de terceros (alquiler y comodato), proveedores, asistencia técnica y empresas de calibración, con contrato y equipos de cada una.","Third-party equipment (rental and free loan), suppliers, service companies and calibration companies, with contract and equipment for each."],"Capacitação da equipe técnica e dos usuários dos equipamentos, com lista de presença (RDC 509, art. 11 · ONA). Entra nos relatórios ANVISA e ONA.":["Capacitación del equipo técnico y de los usuarios de los equipos, con lista de asistencia (RDC 509, art. 11 · ONA). Entra en los informes ANVISA y ONA.","Training of the technical team and equipment users, with attendance list (RDC 509, art. 11 · ONA). Goes into the ANVISA and ONA reports."],"Com filtro, os relatórios e a saúde mostram só os bens escolhidos (e os chamados e serviços deles).":["Con filtro, los informes y la salud muestran solo los bienes elegidos (y sus solicitudes y servicios).","With a filter, reports and health show only the chosen assets (and their requests and services)."],": a conta da empresa (e-mail institucional). Não pode ser inativado e é o único que cria, rebaixa ou inativa Gestores. Você é o Gestor principal. Se a empresa perder essa conta, peça a troca à equipe do Atalaia System.":[": la cuenta de la empresa (e-mail institucional). No puede inactivarse y es el único que crea, degrada o inactiva Ges  etapa (do recebimento ao descarte).":["Criterios y procedimientos escritos para cada etapa (de la recepción al descarte).","Written criteria and procedures for each step (from receipt to disposal)."],"Plano de gerenciamento (pode ser um único para todas as tecnologias).":["Plan de gestión (puede ser uno solo para todas las tecnologías).","Management plan (may be a single one for all technologies)."],"Pode terceirizar, com contrato formal; a responsabilidade continua do estabelecimento.":["Puede tercerizar, con contrato formal; la responsabilidad sigue siendo del establecimiento.","May outsource, with a formal contract; responsibility stays with the facility."],". Resumo em linguagem simples; confira sempre o texto oficial vigente.":[". Resumen en lenguaje simple; revise siempre el texto oficial vigente.",". Plain-language summary; always check the current official text."],"Manual novo da ONA, com foco na experiência e segurança do paciente, gestão de riscos, análise de causa, desempenho e ciclos de melhoria. Para equipamentos, a auditoria pede evidências: inventário com criticidade, manutenção e calibração em dia, rastreabilidade das OS, contingência, treinamento, indicadores com meta e análise crítica.":["Manual nuevo de ONA, con foco en la experiencia y seguridad del paciente, gestión de riesgos, análisis de causa, desempeño y ciclos de mejora. Para equipos, la auditoría pide evidencias: inventario con criticidad, mantenimiento y calibración al día, trazabilidad de las OS, contingencia, capacitación, indicadores con meta y análisis crítico.","New ONA manual, focused on patient experience and safety, risk management, root cause analysis, performance and improvement cycles. For equipment, the audit asks for evidence: inventory with criticality, maintenance and calibration up to date, work order traceability, contingency, training, indicators with targets and critical review."],"Gestão integrada: processos, prazos (SLA), indicadores com meta e tendência.":["Gestión integrada: procesos, plazos (SLA), indicadores con meta y tendencia.","Integrated management: processes, deadlines (SLA), indicators with targets and trend."],"Diretrizes para o programa de gerenciamento de equipamentos de saúde e de infraestrutura: inventário, registro histórico, ensaios de aceitação, manutenção, treinamento e revisão anual de desempenho (item 4.17).":["Directrices para el programa de gestión de equipos de salud y de infraestructura: inventario, registro histórico, ensayos de aceptación, mantenimiento, capacitación y revisión anual de desempeño (ítem 4.17).","Guidelines for the health equipment and infrastructure management program: inventory, history log, acceptance tests, maintenance, training and yearly performance review (item 4.17)."],"Norma internacional, adotada pela ABNT em 2024, que define os requisitos de um sistema de gestão de ativos: tirar o melhor valor de cada ativo durante todo o ciclo de vida, equilibrando custo, risco e desempenho. A família tem a ISO 55000 (termos e princípios), a 55001 (requisitos) e a 55002 (como aplicar). É a base do próprio Atalaia: patrimônio e manutenção no mesmo lugar.":["Norma internacional, adoptada por ABNT en 2024, que define los requisitos de un sistema de gestión de activos: obtener el mejor valor de cada activo durante todo el ciclo de vida, equilibrando costo, riesgo y desempeño. La familia incluye la ISO 55000 (términos y principios), la 55001 (requisitos) y la 55002 (cómo aplicar). Es la base del propio Atalaia: patrimonio y mantenimiento en el mismo lugar.","International standard, adopted by ABNT in 2024, setting the requirements for an asset management system: getting the best value from each asset over its whole life cycle, balancing cost, risk and performance. The family includes ISO 55000 (terms and principles), 55001 (requirements) and 55002 (how to apply). It is the basis of Atalaia itself: assets and maintenance in one place."],"Norma paga: Catálogo ABNT (procure \"62353\"; o texto completo não é público)":["Norma paga: Catálogo ABNT (busque \"62353\"; el texto completo no es público)","Paid standard: ABNT Catalog (search \"62353\"; full text is not public)"],"O serviço de saúde notifica à Anvisa (sistema Notivisa) queixas técnicas e eventos adversos com produtos para saúde (RDC 509, art. 19; RDC 36/2013 para o Núcleo de Segurança do Paciente). As obrigações das empresas detentoras de registro estão na RDC 67/2009.":["El servicio de salud notifica a Anvisa (sistema Notivisa) quejas técnicas y eventos adversos con productos para la salud (RDC 509, art. 19; RDC 36/2013 para el Núcleo de Seguridad del Paciente). Las obligaciones de las empresas titulares de registro están en la RDC 67/2009.","The health service reports technical complaints and adverse events with health products to Anvisa (Notivisa system) (RDC 509, art. 19; RDC 36/2013 for the Patient Safety Unit). Obligations of registration holders are in RDC 67/2009."],"Regulamento técnico de limpeza e manutenção dos sistemas de climatização: responsável técnico, plano de manutenção (PMOC), filtros, bandejas, casa de máquinas e renovação de ar de pelo menos 27 m³/h por pessoa.":["Reglamento técnico de limpieza y mantenimiento de los sistemas de climatización: responsable técnico, plan de mantenimiento (PMOC), filtros, bandejas, sala de máquinas y renovación de aire de al menos 27 m³/h por persona.","Technical regulation for cleaning and maintaining HVAC systems: technical lead, maintenance plan (PMOC), filters, trays, plant room and air renewal of at least 27 m³/h per person."],"Medidas de limpeza e manutenção (bandejas, serpentinas, filtros, dutos, tomada de ar externo).":["Medidas de limpieza y mantenimiento (bandejas, serpentinas, filtros, ductos, toma de aire externo).","Cleaning and maintenance measures (trays, coils, filters, ducts, outdoor air intake)."],"Padrões de referência da qualidade do ar em ambientes climatizados de uso público e coletivo (CO2, aerodispersóides, fungos, temperatura, umidade e velocidade do ar). Foi revogada na revisão de normas da Anvisa; hoje a referência técnica é a ABNT NBR 17037. Fica aqui como histórico.":["Patrones de referencia de la calidad del aire en ambientes climatizados de uso público y colectivo (CO2, aerodispersoides, hongos, temperatura, humedad y velocidad del aire). Fue revocada en la revisión de normas de Anvisa; hoy la referencia técnica es la ABNT NBR 17037. Queda aquí como historial.","Reference air quality standards for public air-conditioned spaces (CO2, airborne particles, fungi, temperature, humidity and air speed). It was revoked in the Anvisa standards review; today the technical reference is ABNT NBR 17037. Kept here for history."],"Normas pagas. NBR 17037: qualidade do ar interior em ambientes climatizados não residenciais (referência atual). NBR 7256: tratamento de ar em estabelecimentos de saúde (filtros, pressão das salas, renovação). NBR 13971: manutenção programada de sistemas de climatização.":["Normas pagas. NBR 17037: calidad del aire interior en ambientes climatizados no residenciales (referencia actual). NBR 7256: tratamiento de aire en establecimientos de salud (filtros, presión de las salas, renovación). NBR 13971: mantenimiento programado de sistemas de climatización.","Paid standards. NBR 17037: indoor air quality in non-residential air-conditioned spaces (current reference). NBR 7256: air handling in health facilities (filters, room pressure, renewal). NBR 13971: scheduled maintenance of HVAC systems."],"NR-10: instalações e serviços em eletricidade (QGBT, geradores). NR-13: caldeiras, vasos de pressão (autoclaves, compressores). NR-32: segurança e saúde no trabalho em serviços de saúde.":["NR-10: instalaciones y servicios en electricidad (tablero general, generadores). NR-13: calderas, recipientes a presión (autoclaves, compresores). NR-32: seguridad y salud en el trabajo en servicios de salud.","NR-10: electrical installations and services (main switchboard, generators). NR-13: boilers, pressure vessels (autoclaves, compressors). NR-32: occupational safety and health in health services."],"Site do Ministério do Trabalho (procure \"Normas Regulamentadoras vigentes\")":["Sitio del Ministerio de Trabajo (busque \"Normas Regulamentadoras vigentes\")","Ministry of Labor website (search \"Normas Regulamentadoras vigentes\")"],"Normas pagas: aqui aparecem só o nome e o resumo. Gases medicinais (12188), instalações elétricas em estabelecimentos de saúde (13534) e instalações de baixa tensão (5410).":["Normas pagas: aquí aparecen solo el nombre y el resumen. Gases medicinales (12188), instalaciones eléctricas en establecimientos de salud (13534) e instalaciones de baja tensión (5410).","Paid standards: only the name and summary show here. Medical gases (12188), electrical installations in health facilities (13534) and low-voltage installations (5410)."],"Procedimentos internos, links oficiais e normas que a empresa segue. Só o Gestor cadastra; todos da empresa veem.":["Procedimientos internos, enlaces oficiales y normas que la empresa sigue. Solo el Gestor registra; todos en la empresa ven.","Internal procedures, official links and standards the company follows. Only the Manager registers; everyone in the company sees them."],"Para empresas de ar-condicionado e refrigeração: aparelhos, chamados, PMOC, preventivas, qualidade do ar, recargas de gás e relatórios. Esconde radiologia/odontologia, tecnovigilância, termos e transferências.":["Para empresas de aire acondicionado y refrigeración: equipos, solicitudes, PMOC, preventivas, calidad del aire, recargas de gas e informes. Oculta radiología/odontología, tecnovigilancia, términos y transferencias.","For air conditioning and refrigeration companies: units, requests, PMOC, preventive, air quality, gas refills and reports. Hides radiology/dentistry, technovigilance, terms and transfers."],"A prévia já mostra o painel com as escolhas. Clique em “Salvar design” para valer para todos.":["La vista previa ya function saudeDe(c){
  const uso=c.usuarios?Math.min(1,(c.usuarios_ativos_30d/c.usuarios)/.7)*100:0;
  const d=diasDesde(c.ultimo_acesso),atv=d==null?0:d<=2?100:d<=7?70:d<=14?40:d<=30?15:0;
  const ado=Math.min(100,c.bens/Math.max(10,c.lim_bens*.1)*100);
  const abertos=E.tks.filter(t=>t.contratante_id==c.id&&t.situacao!="resolvido"),alta=abertos.filter(t=>t.prioridade=="alta").length;
  const sup=Math.max(0,100-abertos.length*12-alta*25);
  return {t:Math.round(uso*.4+atv*.25+ado*.2+sup*.15),uso:Math.round(uso),atv,ado:Math.round(ado),sup,d,abertos:abertos.length};
}

let cfPronto=false,cfId=null;
const captchaHTML=()=>CONFIG.turnstileSiteKey&&!DEMO?`<div id="cf" style="margin:0 0 12px;min-height:65px"></div>`:"";
function montarCaptcha(){const el=document.getElementById("cf");if(!el||!cfPronto||el.dataset.ok)return;el.dataset.ok="1";cfId=turnstile.render(el,{sitekey:CONFIG.turnstileSiteKey,language:"pt-br",appearance:"interaction-only"})}

function tokenCaptcha(){if(!CONFIG.turnstileSiteKey||DEMO)return null;const t=cfPronto&&cfId!=null?turnstile.getResponse(cfId):"";if(!t)throw new Error("Aguarde a verificação de segurança (não sou um robô) terminar e tente de novo.");return t}

async function posLogin(novo){

  if(!(await DB.souMatriz())){E.tela="negado";render();return}
  const n=await DB.nivel();
  if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.tela="mfa";E.msg=null;render();return}
  if(n.currentLevel!="aal2"){E.tela="ativar";E.insc=null;E.msg=null;render();try{E.insc=await DB.inscrever()}catch(e){E.msg=["err",e.message]}render();return}
  E.tela="painel";E.msg=null;render();if(novo)DB.registrar("entrou no painel",null,aparelhoIdM());await recarregar();
}

// Mostrar / ocultar senha em todos os campos de senha
(function(){
  function olho(inp){
    if(inp.dataset.olho)return; inp.dataset.olho="1";
    var box=document.createElement("span"); box.className="senha-box";
    inp.parentNode.insertBefore(box,inp); box.appendChild(inp);
    var b=document.createElement("button"); b.type="button"; b.className="senha-olho";
    b.textContent="\u{1F441} Mostrar"; b.setAttribute("aria-label","Mostrar senha");
    b.onclick=function(){var mostrar=inp.type==="password"; inp.type=mostrar?"text":"password";
      b.textContent=mostrar?"\u{1F648} Ocultar":"\u{1F441} Mostrar"; b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha"); inp.focus();};
    box.appendChild(b);
  }
  function varrer(){document.querySelectorAll('input[type="password"]:not([data-olho])').forEach(olho);}
  new MutationObserver(varrer).observe(document.body,{childList:true,subtree:true}); varrer();
})();
