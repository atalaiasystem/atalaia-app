<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atalaia System · Abrir chamado</title>
<meta name="theme-color" content="#1d1f23">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://ipwleoawvxmzvofcccjn.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%231d1f23%27/%3E%3Cpath d=%27M50 18 L24 82 M50 18 L76 82%27 stroke=%27white%27 stroke-width=%2710%27 stroke-linecap=%27round%27 fill=%27none%27/%3E%3Cpath d=%27M35 58 L46 67 L67 44%27 stroke=%27%23f2a33a%27 stroke-width=%278%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 fill=%27none%27/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<style>
:root{--ink:#1d1f23;--amb:#f2a33a;--mut:#6b7078;--line:#e3e0da;--bg:#f5f3ef;--card:#fff;--ok:#1f9a55;--bad:#c8372d;--marca:#1d1f23;--marca-ink:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--marca);color:var(--marca-ink);padding:16px 16px 18px}
header b{display:block;font-size:1.05rem;letter-spacing:.02em}header small{opacity:.85;font-size:.82rem}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:1.3rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 8px}.sub{color:var(--mut);margin:0 0 12px;font-size:.92rem}
label{display:grid;gap:5px;font-size:.9rem;font-weight:600;margin-bottom:12px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amb);border-color:var(--amb)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;width:100%;min-height:48px}
.btn.amb{background:var(--amb);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.msg{padding:11px 12px;border-radius:10px;font-size:.92rem;margin-bottom:12px}.msg.err{background:#fbe9e7;color:var(--bad)}.msg.ok{background:#e6f4ec;color:var(--ok)}
.urg{display:flex;gap:8px;margin-bottom:12px}.urg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.urg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.num{font-size:2.2rem;font-weight:800;margin:4px 0}
.passos{list-style:none;padding:0;margin:8px 0 0}.passos li{padding:8px 0 8px 28px;position:relative;color:var(--mut)}.passos li:before{content:"○";position:absolute;left:4px}
.passos li.ok{color:var(--ink);font-weight:600}.passos li.ok:before{content:"●";color:var(--ok)}
.estrelas{display:flex;gap:6px;justify-content:center;margin:8px 0 12px}.estrelas button{font-size:2rem;background:none;border:0;cursor:pointer;color:#c9c4ba}.estrelas button.on{color:var(--amb)}
.muted{color:var(--mut);font-size:.84rem}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:8px 16px 24px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="muted">Carregando…</p></div></div>
<script>
if(window.top!==window.self){document.documentElement.innerHTML="";throw new Error("Bloqueado.")}
const CONFIG={url:"https://ipwleoawvxmzvofcccjn.supabase.co",anonKey:"sb_publishable_Y0vnKk8p0mRjOjOgKmOMFQ_kTNr4a-u",versao:"0.1.1"};
const P=new URLSearchParams(location.search),DEMO=P.has("demo");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dh=d=>d?new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
let sb=null;
const traduz=m=>m||"Não foi possível agora. Tente de novo.";
const DB=DEMO?{
  async amb(){return {ambiente:"Sala de exames",unidade:"Filial Norte",empresa:"Clínica Exemplo",design:{},avalie:true,bens:[{id:"b1",nome:"Monitor multiparâmetro",patrimonio:"CE-0001"},{id:"b2",nome:"Ar-condicionado",patrimonio:"CE-0005"}]}},
  async abrir(){return {numero:17,protocolo:"DEMO-2026-00017",codigo:"demo17",aberto_em:new Date().toISOString()}},
  async ver(){return {numero:17,situacao:P.get("sit")||"concluido",aberto_em:new Date(Date.now()-5*36e5).toISOString(),aceito_em:new Date(Date.now()-4*36e5).toISOString(),concluido_em:new Date(Date.now()-36e5).toISOString(),ambiente:"Sala de exames",descricao:"Ar-condicionado pingando",solucao:"Dreno desentupido e testado.",avaliacao:null}},
  async avaliar(){return "Obrigado pela avaliação!"},
  async avalie(){return "Mensagem enviada. Obrigado!"}
}:{
  cli(){return sb||(sb=supabase.createClient(CONFIG.url,CONFIG.anonKey,{auth:{persistSession:false}}))},
  async rpc(n,a){const {data,error}=await this.cli().rpc(n,a);if(error)throw new Error(traduz(error.message));return data},
  amb(t){return this.rpc("qr_ambiente",{p_token:t})},
  abrir(t,d,nome,cont,bem,pri){return this.rpc("abrir_chamado_qr",{p_token:t,p_descricao:d,p_nome:nome||null,p_contato:cont||null,p_bem:bem||null,p_prioridade:pri})},
  ver(c){return this.rpc("acompanhar_chamado_qr",{p_codigo:c})},
  avaliar(c,n,txt){return this.rpc("avaliar_chamado",{p_id:null,p_nota:n,p_comentario:txt||null,p_codigo:c})},
  avalie(t,tp,txt,nome,cont){return this.rpc("enviar_avaliacao",{p_token:t,p_tipo:tp,p_texto:txt,p_nome:nome||null,p_contato:cont||null})}
};
const S={pri:"media",nota:0};
function lerMeus(){try{return JSON.parse(localStorage.getItem("atalaia_meus_chamados")||"[]")}catch(e){return []}}
function guardarMeu(x){try{const L=lerMeus().filter(y=>y.codigo!=x.codigo);L.unshift(x);localStorage.setItem("atalaia_meus_chamados",JSON.stringify(L.slice(0,10)))}catch(e){}}
function cab(a){return `<header><b>ATALAIA SYSTEM</b><small>${a?esc(a.empresa)+" · "+esc(a.unidade):"Sistema de Gestão de Patrimônio e Manutenção"}</small></header>`}
function marca(d){const c=d&&/^#[0-9a-f]{6}$/i.test(d.cor||"")?d.cor:null;if(c){document.documentElement.style.setProperty("--marca",c);const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);document.documentElement.style.setProperty("--marca-ink",(r*299+g*587+b*114)/1000>150?"#1d1f23":"#fff")}}
const rod=`<footer>Atalaia System · Sistema de Gestão de Patrimônio e Manutenção<br>A data e a hora do chamado são registradas pelo servidor.</footer>`;
async function iniciar(){
  const c=P.get("c"),t=P.get("t");
  if(c)return acompanhar(c);
  if(!t){$("#app").innerHTML=cab()+`<div class="wrap"><div class="card"><h1>QR Code incompleto</h1><p class="sub">Leia de novo o QR Code colado no ambiente.</p>${meusHTML()}</div></div>`+rod;return}
  try{S.a=await DB.amb(t);marca(S.a.design);P.get("aba")=="avalie"&&S.a.avalie?telaAvalie():formulario()}catch(e){$("#app").innerHTML=cab()+`<div class="wrap"><div class="msg err">${esc(e.message)}</div></div>`+rod}
}
function abas(k){return S.a.avalie?`<div class="urg" style="margin-bottom:12px">${[["ch","Abrir chamado","formulario()"],["av","Avalie","telaAvalie()"]].map(([x,t,f])=>`<button type="button" aria-pressed="${k==x}" onclick="${f}">${t}</button>`).join("")}</div>`:""}
function formulario(erro){const a=S.a;
  $("#app").innerHTML=cab(a)+`<div class="wrap">${abas("ch")}<div class="card"><h1>Abrir chamado</h1><p class="sub">Ambiente: <b>${esc(a.ambiente)}</b>. Não precisa de login.</p>${erro?`<div class="msg err">${esc(erro)}</div>`:""}
  <form onsubmit="event.preventDefault();enviar()">
  ${a.bens&&a.bens.length?`<label>Qual equipamento? (opcional)<select id="b"><option value="">Não sei / é do ambiente</option>${a.bens.map(b=>`<option value="${b.id}">${esc((b.patrimonio?b.patrimonio+" · ":"")+b.nome)}</option>`).join("")}</select></label>`:""}
  <label>O que está acontecendo? *<textarea id="d" rows="4" maxlength="1000" required placeholder="Ex.: o ar-condicionado está pingando sobre o leito 3"></textarea></label>
  <p style="font-weight:600;font-size:.9rem;margin:0 0 6px">É urgente?</p>
  <div class="urg pri">${[["urgente","Sim"],["baixa","Não"],["media","Normal"]].map(([k,t])=>`<button type="button" aria-pressed="${S.pri==k}" onclick="S.pri='${k}';document.querySelectorAll('.pri button').forEach(x=>x.setAttribute('aria-pressed',x.textContent=='${t}'))">${t}</button>`).join("")}</div>
  <label>Seu nome (opcional)<input id="n" maxlength="80" autocomplete="name"></label>
  <label>Telefone ou setor para contato (opcional)<input id="c" maxlength="80"></label>
  <button class="btn" id="env">Enviar chamado</button></form>
  <p class="muted" style="margin-top:10px">Não escreva dados de pacientes. Use só a descrição do problema.</p></div>${meusHTML()}</div>`+rod}
let _vt=null;
function pararVolta(){clearInterval(_vt);_vt=null;const v=$("#volta");if(v)v.remove()}
function contagem(n){clearInterval(_vt);_vt=setInterval(()=>{n--;const e=$("#vs");if(!e){clearInterval(_vt);return}e.textContent=n;if(n<=0)voltarInicio()},1000)}
function voltarInicio(){pararVolta();const t=P.get("t")||((lerMeus().find(x=>x.codigo==(S.c||P.get("c")))||{}).t);location.href=t?"?t="+encodeURIComponent(t):"./"}
async function enviar(){const d=$("#d").value.trim();if(d.length<5){formulario("Descreva o problema (pelo menos 5 letras).");return}
  const b=$("#env");b.disabled=true;b.textContent="Enviando…";
  try{const r=await DB.abrir(P.get("t"),d,$("#n").value.trim(),$("#c").value.trim(),$("#b")?$("#b").value:null,S.pri);try{const v=await DB.ver(r.codigo);r.protocolo=(v&&v.protocolo)||r.protocolo}catch(e){}
    guardarMeu({codigo:r.codigo,numero:r.numero,protocolo:r.protocolo||null,ambiente:S.a.ambiente,em:r.aberto_em,t:P.get("t")});
    $("#app").innerHTML=cab(S.a)+`<div class="wrap"><div class="card" style="text-align:center"><p class="sub" style="margin:0">Chamado registrado</p><div class="num">nº ${r.numero}</div>${r.protocolo?`<p style="margin:2px 0 8px">Protocolo <b>${esc(r.protocolo)}</b><br><span class="sub">Anote ou tire um print: com ele você acompanha o chamado.</span></p>`:""}<p class="sub">Aberto em ${dh(r.aberto_em)} (hora do servidor). A equipe de manutenção já recebeu.</p>
     <a class="btn amb" style="display:block;text-decoration:none;line-height:22px" href="?c=${encodeURIComponent(r.codigo)}&t=${encodeURIComponent(P.get("t"))}" onclick="pararVolta()">Acompanhar este chamado</a>
     <button class="btn" style="display:block;width:100%;margin-top:8px" onclick="voltarInicio()">✓ Finalizar e voltar ao início</button>
     <p class="muted" id="volta" style="margin-top:10px">Volta sozinho ao início em <b id="vs">30</b> s · <a href="#" onclick="event.preventDefault();pararVolta()">ficar nesta tela</a></p>
     <p class="muted" style="margin-top:6px">O chamado fica guardado neste aparelho, em “Chamados abertos neste aparelho”.</p></div></div>`+rod;contagem(30)}
  catch(e){formulario(e.message)}}
const TIPOS=[["reclamacao","Reclamação"],["sugestao","Sugestão"],["elogio","Elogio"]];
function telaAvalie(erro){const a=S.a;S.tp=S.tp||"";
  $("#app").innerHTML=cab(a)+`<div class="wrap">${abas("av")}<div class="card"><h1>Avalie</h1><p class="sub">Ambiente: <b>${esc(a.ambiente)}</b>. Deixe uma reclamação, sugestão ou elogio. Não precisa de login.</p>${erro?`<div class="msg err">${esc(erro)}</div>`:""}
  <form onsubmit="event.preventDefault();enviarAvalie()"><p style="font-weight:600;font-size:.9rem;margin:0 0 6px">O que você quer enviar? *</p>
  <div class="urg tipos">${TIPOS.map(([k,t])=>`<button type="button" aria-pressed="${S.tp==k}" onclick="S.tp='${k}';document.querySelectorAll('.tipos button').forEach(x=>x.setAttribute('aria-pressed',x.textContent=='${t}'))">${t}</button>`).join("")}</div>
  <label>Sua mensagem *<textarea id="at" rows="4" maxlength="1000" required></textarea></label>
  <label>Seu nome (opcional)<input id="an" maxlength="80" autocomplete="name"></label>
  <label>Telefone ou e-mail para retorno (opcional)<input id="ac2" maxlength="80"></label>
  <button class="btn" id="aenv">Enviar</button></form><p class="muted" style="margin-top:10px">Para um problema que precisa de conserto, use Abrir chamado. Não escreva dados de pacientes.</p></div></div>`+rod}
async function enviarAvalie(){const t=$("#at").value.trim();if(!S.tp)return telaAvalie("Escolha reclamação, sugestão ou elogio.");if(t.length<5)return telaAvalie("Escreva a sua mensagem (pelo menos 5 letras).");
  const b=$("#aenv");b.disabled=true;b.textContent="Enviando…";
  try{const r=await DB.avalie(P.get("t"),S.tp,t,$("#an").value.trim(),$("#ac2").value.trim());S.tp="";
   $("#app").innerHTML=cab(S.a)+`<div class="wrap"><div class="card" style="text-align:center"><h1>${esc(r)}</h1><p class="sub">Sua mensagem chegou à equipe responsável pelo ambiente ${esc(S.a.ambiente)}, com data e hora do servidor.</p><button class="btn ghost" onclick="formulario()">Voltar</button></div></div>`+rod}
  catch(e){telaAvalie(e.message)}}
const ETAPAS=[["aberto","Aberto","aberto_em"],["aceito","Aceito pela manutenção","aceito_em"],["em_atendimento","Em atendimento",null],["concluido","Concluído","concluido_em"],["confirmado","Confirmado","confirmado_em"]];
async function acompanhar(c){try{const x=await DB.ver(c);S.x=x;S.c=c;const ord=ETAPAS.findIndex(e=>e[0]==x.situacao);
  $("#app").innerHTML=cab()+`<div class="wrap"><div class="card"><h1>Chamado nº ${x.numero}</h1>${x.protocolo?`<p class="sub" style="margin:0 0 4px">Protocolo <b>${esc(x.protocolo)}</b>${x.os_numero?` · OS nº ${x.os_numero}`:""}</p>`:""}<p class="sub">${esc(x.ambiente||"")} · ${esc(x.descricao)}</p>
  <ul class="passos">${ETAPAS.map(([k,t,cp],i)=>`<li class="${i<=ord?"ok":""}">${t}${cp&&x[cp]?` · ${dh(x[cp])}`:""}</li>`).join("")}</ul>
  ${x.solucao?`<div class="msg ok" style="margin-top:10px"><b>O que foi feito:</b> ${esc(x.solucao)}</div>`:""}</div>
  ${["concluido","confirmado"].includes(x.situacao)&&!x.avaliacao?`<div class="card" style="text-align:center"><h2>Avalie o atendimento</h2><div class="estrelas">${[1,2,3,4,5].map(n=>`<button type="button" aria-label="${n} estrela(s)" class="${S.nota>=n?"on":""}" onclick="S.nota=${n};acompanharTela()">★</button>`).join("")}</div>
   <label style="text-align:left">Comentário (opcional)<textarea id="ac" rows="2" maxlength="500"></textarea></label><button class="btn" onclick="avaliar()" ${S.nota?"":"disabled"}>Enviar avaliação</button></div>`
   :x.avaliacao?`<div class="card" style="text-align:center"><p class="sub" style="margin:0">Sua avaliação</p><div style="font-size:1.8rem;color:var(--amb)">${"★".repeat(x.avaliacao)}<span style="color:#c9c4ba">${"★".repeat(5-x.avaliacao)}</span></div></div>`:""}
  <button class="btn ghost" onclick="acompanhar(S.c)">Atualizar</button>${(P.get("t")||(lerMeus().find(y=>y.codigo==c)||{}).t)?`<button class="btn" style="margin-top:8px" onclick="voltarInicio()">✓ Finalizar e voltar ao início</button>`:""}</div>`+rod}catch(e){$("#app").innerHTML=cab()+`<div class="wrap"><div class="msg err">${esc(e.message)}</div></div>`+rod}}
function acompanharTela(){const t=$("#ac")?$("#ac").value:"";acompanhar(S.c).then(()=>{if($("#ac"))$("#ac").value=t})}
async function avaliar(){try{await DB.avaliar(S.c,S.nota,$("#ac").value.trim());S.nota=0;acompanhar(S.c)}catch(e){alert(e.message)}}
function meusHTML(){const L=lerMeus();return L.length?`<div class="card"><h2>Chamados abertos neste aparelho</h2>${L.map(x=>`<p style="margin:6px 0"><a href="?c=${encodeURIComponent(x.codigo)}">Nº ${x.numero} · ${esc(x.ambiente||"")}</a> <span class="muted">${dh(x.em)}</span></p>`).join("")}</div>`:""}
iniciar();
</script>
</body>
</html>
