/* paletas de cores (escolhidas no painel › Configurações › Design) */

<body>
<div id="app"></div>
<script>
/* =====================================================================
   ATALAIA SYSTEM · Sistema de Gestão de Patrimônio e Manutenção
   Versão 0.1 · Aplicativo de cadastro de bens (computador e celular)
   Configuração: Project URL e chave pública (anon/public) do Supabase.
   A chave pública pode ficar no código; a segurança vem das regras (RLS).
   Nunca coloque aqui a chave secreta (service_role).
   ===================================================================== */
const CONFIG={
  url:"https://ipwleoawvxmzvofcccjn.supabase.co",
  anonKey:"sb_publishable_Y0vnKk8p0mRjOjOgKmOMFQ_kTNr4a-u",
  versao:"0.3.12",
  // Captcha (Cloudflare Turnstile): cole aqui só a CHAVE DO SITE (Site Key, pública).
  // A chave secreta (Secret Key) vai direto no Supabase, nunca aqui.
  turnstileSiteKey:""
};
if(window.top!==window.self){document.documentElement.innerHTML="";throw new Error("Atalaia: abertura dentro de outra página bloqueada.")}
const DEMO=new URLSearchParams(location.search).has("demo")||!CONFIG.anonKey||CONFIG.anonKey.startsWith("COLE_");
const LOGO=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 L18 88 M50 12 L82 88" stroke="#fff" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M32 60 L45 71 L70 44" stroke="#f2a33a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
const IC={bens:"M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10",amb:"M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6",plano:"M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z",man:"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z",ron:"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"};
const ic=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
const brl=v=>v==null||v===""?"—":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dtBR=d=>d?d.split("-").reverse().join("/"):"—";
const temPat=()=>!!(E.v&&E.v.contratantes.planos.funcoes.includes("etiquetas"));
const rot=b=>b.patrimonio||b.nome;
const FUNCOES={chamados:"Chamados pelo QR Code",etiquetas:"Número de patrimônio e etiquetas",auditoria:"Auditoria com leitor",calibracoes:"Calibrações e preventivas",rondas:"Rondas",relatorios:"Relatórios e indicadores",termos:"Termos de responsabilidade",avalie:"Avalie (elogios e reclamações)",duas_etapas:"Verificação em duas etapas"};
const tem2=()=>!!(E.v&&E.v.contratantes.planos.funcoes.includes("duas_etapas"));

/* ---------------- Camada de dados: Supabase real ou demonstração ---------------- */
let sb=null;
const DB=DEMO?mockDB():realDB();
function realDB(){
  sb=supabase.createClient(CONFIG.url,CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const chk=({data,error})=>{if(error)throw new Error(traduz(error.message));return data};
  return {
    async sessao(){return chk(await sb.auth.getSession()).session},
    aoMudar(fn){sb.auth.onAuthStateChange((ev,s)=>fn(ev,s))},
    async entrar(email,senha,captcha){return chk(await sb.auth.signInWithPassword({email,password:senha,options:captcha?{captchaToken:captcha}:{}}))},
    async sair(todos){await sb.auth.signOut(todos?{scope:"global"}:undefined)},
    async esqueci(email,captcha){return chk(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname,...(captcha?{captchaToken:captcha}:{})}))},
    async definirSenha(senha){return chk(await sb.auth.updateUser({password:senha,data:{senha_definida:true}}))},
    async usuario(){return (await sb.auth.getUser()).data.user},
    /* Confere a senha atual sem trocar a sessão aberta (a sessão de conferência é encerrada em seguida). */
    async conferirSenha(email,senha,captcha){
      const r=await fetch(CONFIG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:CONFIG.anonKey},body:JSON.stringify({email,password:senha,...(captcha?{gotrue_meta_security:{captcha_token:captcha}}:{})})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(traduz(j.error_description||j.msg||j.message||"Invalid login credentials"));
      try{await fetch(CONFIG.url+"/auth/v1/logout?scope=local",{method:"POST",headers:{apikey:CONFIG.anonKey,Authorization:"Bearer "+j.access_token}})}catch(e){}
    },
    async nivel(){return chk(await sb.auth.mfa.getAuthenticatorAssuranceLevel())},
    async fatores(){const d=chk(await sb.auth.mfa.listFactors());return (d.all||[]).filter(f=>f.factor_type=="totp")},
    async inscrever(){
      for(const f of await this.fatores())if(f.status!=="verified")await sb.auth.mfa.unenroll({factorId:f.id});
      return chk(await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Atalaia "+new Date().toISOString().slice(0,16)}));
    },
    async verificarCodigo(factorId,code){return chk(await sb.auth.mfa.challengeAndVerify({factorId,code}))},
    async removerFator(factorId){return chk(await sb.auth.mfa.unenroll({factorId}))},
    async chamados(c){return chk(await sb.from("suporte_chamados").select("id,tipo,assunto,mensagem,situacao,resposta,criado_em,respondido_em").eq("contratante_id",c).order("criado_em",{ascending:false}).limit(20))},
    async abrirChamado(c,d){return chk(await sb.from("suporte_chamados").insert({contratante_id:c,autor:E.v.nome,tipo:d.tipo,assunto:d.assunto,mensagem:d.mensagem}).select().single())},
    async ultimosAcessos(){const u=await this.usuario();return chk(await sb.from("registro_acessos").select("criado_em,aparelho").eq("user_id",u.id).eq("acao","entrou").order("criado_em",{ascending:false}).limit(2))},
    async acessoInativo(){try{return chk(await sb.rpc("meu_acesso_inativo"))}catch(e){return null}},
    async meuVinculo(){const u=(await sb.auth.getUser()).data.user;const d=chk(await sb.from("membros").select("perfil,nome,foto_path,contratante_id,user_id,estabelecimento_id,contratantes(id,nome,sigla,situacao,plano_id,exige_2_etapas,design,planos(*))").eq("user_id",u.id).eq("ativo",true).limit(1));return d[0]?{...d[0],email:u.email}:null},
    async ambientes(c){return chk(await sb.from("ambientes").select("*").eq("contratante_id",c).eq("ativo",true).order("criado_em"))},
    async addAmbiente(c,nome,extra){return chk(await sb.from("ambientes").insert({contratante_id:c,nome,...(extra||{})}).select().single())},
    async unidades(c){try{return chk(await sb.from("estabelecimentos").select("id,nome,tipo").eq("contratante_id",c).order("criado_em"))}catch(e){return []}},
    async addEmpresa(d){return chk(await sb.from("empresas").insert(d).select("id,nome,tipo").single())},

function traduz(m){
  const t={"Invalid login credentials":"E-mail ou senha incorretos.","Email not confirmed":"Confirme o e-mail pelo link recebido.","Password should be at least 6 characters":"A senha precisa ter pelo menos 6 caracteres.","New password should be different from the old password.":"A nova senha precisa ser diferente da anterior.","For security purposes, you can only request this after":"Por segurança, aguarde alguns segundos antes de pedir de novo."};
  const t2={"at least one character of each":"A senha precisa ter letra minúscula, letra maiúscula, número e símbolo.","Password should be at least":"A senha está curta. Use pelo menos 10 caracteres.","weak":"Senha fraca. Use pelo menos 10 caracteres com letra minúscula, maiúscula, número e símbolo.","captcha":"Confirme a verificação de segurança (não sou um robô) e tente de novo.","Invalid TOTP":"Código incorreto ou vencido. Confira o código atual no aplicativo autenticador.","invalid totp":"Código incorreto ou vencido. Confira o código atual no aplicativo autenticador.","rate limit":"Muitas tentativas seguidas. Por segurança, aguarde alguns minutos.","AAL2":"Confirme o código da verificação em duas etapas.","aal2":"Confirme o código da verificação em duas etapas.","expired":"O link ou código venceu. Peça um novo.","Email link is invalid":"O link venceu ou já foi usado. Peça um novo em “Esqueci minha senha”."};
  for(const k in t)if(m&&m.includes(k))return t[k];
  for(const k in t2)if(m&&m.toLowerCase().includes(k.toLowerCase()))return t2[k];
  if(m&&m.includes("duplicate key")&&m.includes("serie"))return "Já existe um bem com este número de série.";
  if(m&&m.includes("row-level security"))return "Sem permissão para esta ação.";
  return m||"Erro inesperado.";
}

/* ---------------- Captcha (Cloudflare Turnstile), ativo só quando a chave do site estiver configurada ---------------- */
let cfId=null,cfPronto=false;
const captchaHTML=()=>CONFIG.turnstileSiteKey&&!DEMO?`<div id="cf" style="margin:0 0 12px;min-height:65px"></div>`:"";
function carregarTurnstile(){if(!CONFIG.turnstileSiteKey||DEMO)return;window.cfOk=()=>{cfPronto=true;montarCaptcha()};const sc=document.createElement("script");sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=cfOk&render=explicit";sc.async=true;document.head.appendChild(sc)}
function montarCaptcha(){const el=$("#cf");if(!el||!cfPronto||el.dataset.ok)return;el.dataset.ok="1";cfId=turnstile.render(el,{sitekey:CONFIG.turnstileSiteKey,language:"pt-br",appearance:"interaction-only"})}
function tokenCaptcha(){if(!CONFIG.turnstileSiteKey||DEMO)return null;const t=cfPronto&&cfId!=null?turnstile.getResponse(cfId):"";if(!t)throw new Error("Aguarde a verificação de segurança (não sou um robô) terminar e tente de novo.");return t}
function resetCaptcha(){try{if(cfPronto&&cfId!=null)turnstile.reset(cfId)}catch(e){}}

/* ---------------- Entrada, senha e verificação em duas etapas ---------------- */
async function iniciar(){
  carregarTurnstile();
  DB.aoMudar((ev)=>{if(ev=="PASSWORD_RECOVERY"){E.modoSenha="link";E.tela="senha";E.msg=null;render()}});
  const hash=location.hash||"";
  const convite=/type=(invite|recovery|signup)/.test(hash);
  const erroLink=/error_description=/.test(hash);
  try{
    const s=await DB.sessao();
    if(s&&convite){E.modoSenha="link";E.tela="senha";render();return}
    if(s&&erroLink){history.replaceState(null,"",location.pathname);let em="";try{em=(await DB.usuario())?.email||""}catch(x){}E.linkErroEmail=em;E.tela="linkerro";render();return}
    if(s){await posLogin(false);return}
  }catch(e){E.msg=["err",e.message]}
  if(erroLink){E.msg=["err","O link venceu ou já foi usado. Peça um novo em “Esqueci minha senha”."];history.replaceState(null,"",location.pathname)}
  E.tela="login";render();
}
async function entrar(){E.msg=null;try{const cap=tokenCaptcha();await DB.entrar($("#em").value.trim(),$("#se").value,cap);await posLogin(true)}catch(e){resetCaptcha();E.msg=["err",e.message];render()}}
async function esqueci(){const em=($("#em")?.value||"").trim();if(!em){E.msg=["info","Digite seu e-mail no campo acima e toque de novo em “Esqueci minha senha”."];render();return}
 try{const cap=tokenCaptcha();await DB.esqueci(em,cap);E.msg=["ok","Se o e-mail estiver cadastrado, você receberá um link para criar nova senha. O link vale por pouco tempo e só pode ser usado uma vez. Confira também a caixa de spam."]}catch(e){E.msg=["err",e.message]}resetCaptcha();render()}
/* Depois da senha: pede o código (se a pessoa tiver duas etapas), exige senha pessoal no primeiro acesso e abre o app. */
async function posLogin(registrar){
  const n=await DB.nivel();
  if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.depois=registrar?"app+reg":"app";E.tela="mfa";E.msg=null;render();return}
  const u=await DB.usuario();
  if(!u?.user_metadata?.senha_definida){E.modoSenha="primeiro";E.tela="senha";E.msg=null;render();return}
  await abrirApp(registrar);
}
async function confirmarMfa(){
  try{const f=(await DB.fatores()).find(x=>x.status=="verified");if(!f)throw new Error("Nenhuma verificação em duas etapas encontrada.");
    await DB.verificarCodigo(f.id,$("#otp").value.trim());E.msg=null;
    if(E.depois=="senha"){E.depois=null;E.tela="senha";render();return}
    const reg=E.depois=="app+reg";E.depois=null;await posLogin(reg);
  }catch(e){E.msg=["err",e.message];render()}}
async function salvarSenha(){
  const m=E.modoSenha,a=$("#s1").value,b=$("#s2").value;
  if(a!==b){E.msg=["err","As duas senhas novas não são iguais."];render();return}
  if(!senhaForte(a)){E.msg=["err","A senha ainda não cumpre todas as regras da lista."];render();chkSenha(a);return}
  try{
    if(m=="trocar"){const atual=$("#s0").value;if(atual===a)throw new Error("A nova senha precisa ser diferente da atual.");await DB.conferirSenha(E.v.email,atual,tokenCaptcha())}
    const n=await DB.nivel();
    if(n.nextLevel=="aal2"&&n.currentLevel!="aal2"){E.depois="senha";E.tela="mfa";E.msg=["info","Antes de salvar a senha, confirme o código do aplicativo autenticador."];render();return}
    await DB.definirSenha(a);history.replaceState(null,"",location.pathname);
    const vinc=E.v||await DB.meuVinculo();if(vinc)DB.registrar(vinc.contratante_id,m=="link"?"criou nova senha pelo link":m=="primeiro"?"criou a senha pessoal":"trocou a senha",null);
    toast("Senha salva.");E.msg=null;
    if(m=="trocar"){E.tela="app";if(history.state&&history.state.atalaia){ignorarPop=true;history.back()}render()}else await abrirApp(true);
  }catch(e){resetCaptcha();E.msg=["err",e.message];render()}}
async function ativar2(){E.tela="ativar2";E.insc=null;E.msg=null;render();try{E.insc=await DB.inscrever()}catch(e){E.msg=["err",e.message]}render()}

  if(E.obrig){E.obrig=false;await abrirApp(false);return}E.tela="app";E.msg=null;render()}catch(e){E.msg=["err",e.message];render()}}
async function desativar2(){if(!confirm("Desativar a verificação em duas etapas deixa a conta menos protegida. Deseja continuar?"))return;
  try{for(const f of E.fatores)await DB.removerFator(f.id);E.fatores=await DB.fatores();DB.registrar(E.v.contratante_id,"desativou a verificação em duas etapas",null);toast("Verificação em duas etapas desativada.");render()}catch(e){toast(e.message)}}
async function abrirApp(registrar){
  E.v=await DB.meuVinculo();
  if(!E.v){E.tela="semacesso";render();return}
  aplicarPaletaApp();
  E.fatores=await DB.fatores();
  const exige=tem2()&&E.v.contratantes.exige_2_etapas&&["gestor","administrador"].includes(E.v.perfil);
  if(exige&&!E.fatores.some(f=>f.status=="verified")){E.obrig=true;await ativar2();return}
  E.obrig=exige;
  const c=E.v.contratante_id;
  if(registrar)await DB.registrar(c,"entrou",null);
  else{/* conta o uso do app (no máximo 1 registro a cada 6 horas por aparelho), para a Matriz saber quantos usam */
    let ult=0;try{ult=+localStorage.getItem("atalaia_abriu")||0}catch(e){}
    if(Date.now()-ult>216e5){DB.registrar(c,"abriu o app",null);try{localStorage.setItem("atalaia_abriu",String(Date.now()))}catch(e){}}}
  try{E.fotoUrl=E.v.foto_path?await DB.urlFoto(E.v.foto_path):null;E.logoUrl=E.v.contratantes.design?.logo?await DB.urlFoto(E.v.contratantes.design.logo):null}catch(e){}
  [E.amb,E.bens,E.acessos,E.chamados,E.unis,E.emps]=await Promise.all([DB.ambientes(c),DB.bens(c),DB.ultimosAcessos().catch(()=>[]),DB.chamados(c).catch(()=>[]),DB.unidades(c),DB.empresas(c)]);
  await carregarMan().catch(()=>{});if(!E.abaIni){E.abaIni=1;E.aba=abaRaiz();E.mt="home"}
  E.tela="app";render();
}

function guardarForm(){if(!E.modal||!$("#fn"))return;const b=E.modal.bem||(E.modal.bem={});
  Object.assign(b,{nome:$("#fn").value,categoria:$("#fc").value,estado:$("#fe").value,ambiente_id:$("#fa").value,marca:$("#fm").value,modelo:$("#fo").value,numero_serie:$("#fs").value,valor:$("#fv")?($("#fv").value===""?null:$("#fv").value):b.valor,patrimonio:$("#fpt")?$("#fpt").value:b.patrimonio,data_aquisicao:$("#fd").value,observacao:$("#fb").value,propriedade:$("#fpr")?$("#fpr").value:b.propriedade,_empNome:$("#femp")?$("#femp").value:b._empNome,doador:$("#fdoa")?$("#fdoa").value:b.doador,posse_ate:$("#fpos")?$("#fpos").value:b.posse_ate,tipo:$("#ftp")?$("#ftp").value:b.tipo,posicao:$("#fpo")?$("#fpo").value:b.posicao,vida_util_anos:$("#fvu")?$("#fvu").value:b.vida_util_anos,critico:$("#fcr")?$("#fcr").checked:b.critico})}

    try{const bl=await comprimir(f);E.modal.fotos.push({blob:bl,url:URL.createObjectURL(bl)})}catch(e){toast("Não foi possível ler a foto.")}}

function comprimir(file){return new Promise((ok,er)=>{const img=new Image();img.onload=()=>{const M=1280,s=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>b?ok(b):er(),"image/jpeg",0.72)};img.onerror=er;img.src=URL.createObjectURL(file)})}
async function salvarBem(){
  const btn=$("#fsalvar");btn.disabled=true;btn.textContent="Salvando…";
  const b=E.modal.bem||{},c=E.v.contratante_id;

  if($("#fpr")){const k=$("#fpr").value;d.propriedade=k;const en=sitEmp(k)?$("#femp").value.trim():"";d.empresa_id=null;d.doador=k=="doacao"?($("#fdoa").value.trim()||null):null;d.posse_ate=SIT_PRAZO.includes(k)?($("#fpos").value||null):null;if(sitEmp(k)&&!en){guardarForm();E.modal.erro=sitN(k)+": escreva ou escolha o nome da empresa.";btn.disabled=false;btn.textContent=b.id?"Salvar alterações":"Salvar bem";render();return}}
  if($("#ftp")){d.tipo=$("#ftp").value.trim()||null;d.posicao=$("#fpo").value.trim()||null;d.vida_util_anos=$("#fvu").value===""?null:Number($("#fvu").value);d.critico=$("#fcr").checked}
  try{
    if($("#fpr")&&sitEmp(d.propriedade))d.empresa_id=await empresaPorNome($("#femp").value,d.propriedade,d.ambiente_id,E.v.perfil=="gestor");
    const lista=[];for(const f of E.modal.fotos){lista.push(f.path||await DB.enviarFoto(c,f.blob))}
    d.foto_path=lista[0]||null;if(temColFotos())d.fotos=lista;
    let r;
    if(b.id){r=await DB.updBem(b.id,d);toast("Alterações salvas.")}
    else{r=await DB.addBem({...d,contratante_id:c});toast(r.patrimonio?"Bem cadastrado com o patrimônio "+r.patrimonio+".":"Bem cadastrado.");DB.registrar(c,"cadastrou bem",rot(r))}
    const rem=E.modal.removidas||[];
    if(cont&&!b.id){const seq=(E.modal.seq||0)+1,base={ambiente_id:d.ambiente_id,categoria:d.categoria,estado:d.estado,propriedade:d.propriedade,_empNome:$("#femp")?$("#femp").value:"",doador:d.doador,posse_ate:d.posse_ate,posicao:d.posicao,tipo:d.tipo};
      E.modal={bem:base,fotos:[],removidas:[],seq};DB.apagarFotos(rem);await recarregar();document.querySelector(".modal .sheet")?.scrollTo(0,0);scrollTo(0,0);setTimeout(()=>{const f=$("#fpt")||$("#fn");if(f)f.focus()},100);return}
    fecharSemVoltar();DB.apagarFotos(rem);await recarregar();
  }catch(e){guardarForm();E.modal.erro=e.message;render()}
}

/* leitura da etiqueta do fabricante: lê todos os códigos e separa nº de série e modelo */
function gs1(txt){const t=String(txt).replace(/^\]..?/,"");const o={};
  if(/\(\d{2,4}\)/.test(t)){for(const m of t.matchAll(/\((\d{2,4})\)([^(]+)/g))o[m[1]]=m[2].trim();return o}
  const FIX={"00":18,"01":14,"02":14,"11":6,"12":6,"13":6,"15":6,"16":6,"17":6,"20":2};let i=0;
  if(!/^(01|00|02|10|11|17|21|240|241)/.test(t))return o;
  while(i<t.length){const a2=t.substr(i,2),a3=t.substr(i,3);let ai,len=null;
    if(FIX[a2]!=null){ai=a2;len=FIX[a2]}else if(["10","21","22"].includes(a2))ai=a2;else if(["240","241","250","251"].includes(a3))ai=a3;else break;
    i+=ai.length;let v;if(len){v=t.substr(i,len);i+=len}else{const j=t.indexOf("\x1d",i);v=j<0?t.slice(i):t.slice(i,j);i=j<0?t.length:j+1}o[ai]=v}
  return o}
function classificarCodigos(L){const r={serie:null,modelo:null,outros:[]};
  for(const c of L){const g=gs1(c);if(g["21"]||g["240"]||g["241"]){if(g["21"]&&!r.serie)r.serie=g["21"];if((g["240"]||g["241"])&&!r.modelo)r.modelo=g["240"]||g["241"];continue}
    const kv=[...c.matchAll(/(S\/?N|SN|SERIAL|S[ÉE]RIE|MOD(?:EL|ELO)?|REF|P\/?N)\s*[:=]\s*([^\s;|,]+)/gi)];
    if(kv.length){kv.forEach(([,k,v])=>{if(/S\/?N|SN|SERIAL|S[ÉE]RIE/i.test(k)){if(!r.serie)r.serie=v}else if(!r.modelo)r.modelo=v});continue}
    const m1=c.match(/^(?:S\/?N|SN|SER(?:IE|IAL)?|N[º°o]?\s*S[ÉE]RIE)[\s:.#-]*(.+)$/i),m2=c.match(/^(?:MOD(?:EL|ELO)?|REF|P\/?N|PN|TYPE|TIPO)[\s:.#-]*(.+)$/i);
    if(m1&&!r.serie){r.serie=m1[1].trim();continue}if(m2&&!r.modelo){r.modelo=m2[1].trim();continue}
    if(/^https?:\/\//i.test(c))continue;r.outros.push(c)}
  return r}

function pegarGPS(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>ok(null),{enableHighAccuracy:true,timeout:7000,maximumAge:60000})})}
async function fotoCh(inp,etapa){const f=inp.files&&inp.files[0];if(!f)return;const c=(E.chs||[]).find(x=>x.id==E.chSel);toast("Preparando a foto com carimbo…");
  try{const [cb,g]=await Promise.all([DB.carimbo(c.id),pegarGPS()]);
    const L=[`Chamado nº ${cb.numero} · ${ETAPAS_F[etapa]||etapa}`,[cb.unidade,cb.ambiente].filter(Boolean).join(" · "),`${cb.agora} (horário do servidor)`,g?`GPS ${g.lat}, ${g.lng} (±${g.acc} m)`:"Localização não autorizada",`Atalaia System · ${E.v.nome||""}`];
    const blob=await carimbar(f,L);const p=await DB.subirFotoCh(E.v.contratante_id,c.id,blob,etapa);
    const r=await DB.regFoto(c.id,p,etapa,new Date(f.lastModified||Date.now()).toISOString(),g,L.join(" | "));
    toast(r&&r.na_hora===false?"Foto enviada, mas marcada como “não tirada na hora”.":`Foto ${ETAPAS_F[etapa].toLowerCase()} enviada.`);carregarItem()}catch(e){toast(e.message||"Não foi possível enviar a foto.")}inp.value=""}
async function carimbar(file,linhas){const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(file)});
  const s=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),fs=Math.max(14,Math.round(w/42)),lh=Math.round(fs*1.35),band=lh*linhas.length+fs;
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.drawImage(im,0,0,w,h);
  x.fillStyle="rgba(0,0,0,.62)";x.fillRect(0,h-band,w,band);x.fillStyle="#fff";x.textBaseline="top";
  linhas.forEach((t,i)=>{x.font=`${i==0?"700 ":""}${i==linhas.length-1?Math.round(fs*.8):fs}px system-ui,Arial,sans-serif`;x.fillStyle=i==0?"#f2a33a":"#fff";x.fillText(t,Math.round(fs*.6),h-band+Math.round(fs/2)+i*lh,w-fs)});
  return await new Promise(ok=>cv.toBlob(ok,"image/jpeg",.82))}

  let on=false;const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b)};cv.onpointermove=e=>{if(!on)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke();E.modal.risco=true};cv.onpointerup=()=>on=false}

async function salvarMedC(){const m=E.rm,a=(E.amb||[]).find(x=>x.id==m.a),t=a.tipo_ronda,c=E.ron.cfg||{},L=[];let q=null;const v=id=>{const e=$("#"+id);return e?e.value:""};const P=(g,ch,o)=>L.push({grupo:g,amb:a.id,chave:ch,...o});
  if(t=="gases"){["pureza_o2","pressao_o2","pressao_ar","temperatura"].forEach(k=>{if($("#m_"+k))L.push({grupo:"gases",chave:k,valor:v("m_"+k)})});(c.cilindros_m3||[10,7,3,1]).forEach(x=>L.push({grupo:"cilindros",chave:"cheios_"+x,valor:v("cc"+x)||0},{grupo:"cilindros",chave:"vazios_"+x,valor:v("cv"+x)||0}));
    if(m.queda)q={houve:true,redes:v("qr"),inicio:v("qi")||null,fim:v("qf")||null,reserva_entrou:v("qe")=="1",paciente_afetado:v("qp")=="1",causa:v("qc").trim()||null}}
  else if(t=="geradores"){(c.geradores||["Gerador 1"]).forEach((g,i)=>L.push({grupo:g,chave:"combustivel",valor:v("gc"+i)},{grupo:g,chave:"horimetro",valor:v("gh"+i)},{grupo:g,chave:"tensao",valor:v("gt"+i)||null},{grupo:g,chave:"partida_automatica",texto:v("gp"+i)}));L.push({grupo:"tanque",chave:"nivel",valor:v("gtq")})}
  else if(t=="caixa_agua"){P(a.nome,"nivel",{valor:v("ca_nivel")});P(a.nome,"boia",{texto:v("ca_boia")});P(a.nome,"tampa",{texto:v("ca_tampa")});P(a.nome,"ultima_limpeza",{texto:v("ca_limp")});if(v("ca_cloro")!=="")P(a.nome,"cloro",{valor:v("ca_cloro")})}
  else{P(a.nome,"pureza",{valor:v("us_pureza")});P(a.nome,"pressao_saida",{valor:v("us_pressao")});P(a.nome,"horimetro",{valor:v("us_hor")});P(a.nome,"compressor",{texto:v("us_comp")});P(a.nome,"secador",{texto:v("us_sec")});P(a.nome,"alarme",{texto:v("us_alarme")})}
  L.push({grupo:a.nome,amb:a.id,chave:"ambiente",texto:a.id});
  const tipoR=t=="gases"?"gases":t=="geradores"?"geradores":t;
  try{const r=await DB.iniRonda(minhaUniC(),tipoR);const res=await DB.regMed(r,L,q);await DB.fimRonda(r);toast(res&&res.chamados&&res.chamados.length?`Registrado. Chamado(s) aberto(s): ${res.chamados.join(", ")}.`:"Medições registradas.");E.rt="home";E.rm=null;await carregarRon();carregarMan().then(render).catch(()=>{})}catch(e){m.erro=e.message;render()}}

const JSQR={src:"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",sri:"sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx"};
let camStream=null,camLoop=null;
function carregarJsQR(){if(window.jsQR)return Promise.resolve();return new Promise((ok,er)=>{const s=document.createElement("script");s.src=JSQR.src;s.integrity=JSQR.sri;s.crossOrigin="anonymous";s.onload=ok;s.onerror=()=>er(new Error("Não foi possível carregar o leitor."));document.head.appendChild(s)})}
function manQR(){return `<button class="voltar" onclick="pararCam();voltar()">← Voltar</button><h1>Ler QR Code</h1><p class="sub">Aponte para o QR do ambiente (abre tudo dele) ou para a etiqueta de patrimônio do bem (abre a ficha).</p>
  <div class="card" style="display:grid;gap:10px">${E.camOn?`<video id="camv" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover"></video><button class="btn ghost" onclick="pararCam();render()">Fechar câmera</button>`:`<button class="btn amb full" onclick="abrirCam()">📷 Abrir a câmera</button>`}
  ${E.camErro?`<div class="msg err">${esc(E.camErro)}</div>`:""}
  <label style="margin:0">Ou digite o patrimônio / nº de série (ou use o leitor Bluetooth)<input id="qrman" autocomplete="off" placeholder="Ex.: HTA-0001" onkeydown="if(event.key=='Enter')lerCodigo(this.value)"></label><button class="btn ghost" onclick="lerCodigo($('#qrman').value)">Buscar</button></div>`}
async function abrirCam(){E.camErro=null;try{if(!("BarcodeDetector" in window))await carregarJsQR();camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});E.camOn=true;render();
  const v=$("#camv");v.srcObject=camStream;await v.play();const det="BarcodeDetector" in window?new BarcodeDetector({formats:["qr_code","code_128","ean_13","code_39"]}):null;const cv=document.createElement("canvas"),x=cv.getContext("2d",{willReadFrequently:true});
  const passo=async()=>{if(!camStream)return;try{let txt=null;if(det){const r=await det.detect(v);if(r.length)txt=r[0].rawValue}else if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);const d=x.getImageData(0,0,cv.width,cv.height),q=window.jsQR(d.data,d.width,d.height);if(q)txt=q.data}
    if(txt&&E.mt=="aud"&&typeof lerAudC=="function"){if(txt!=E.audUlt||Date.now()-(E.audT||0)>3000){E.audUlt=txt;E.audT=Date.now();lerAudC(txt)}}else if(txt){if(navigator.vibrate)navigator.vibrate(80);pararCam();lerCodigo(txt);return}}catch(e){}camLoop=setTimeout(passo,250)};passo()}
  catch(e){pararCam();E.camErro=/Permission|NotAllowed/i.test(e.name+e.message)?"A câmera foi bloqueada. Libere a câmera para este site nas configurações do navegador.":"Não foi possível abrir a câmera neste aparelho. Digite o número abaixo.";render()}}
function pararCam(){clearTimeout(camLoop);if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}E.camOn=false}
function lerCodigo(txt){txt=String(txt||"").trim();if(!txt)return;const m=txt.match(/[?&]t=([A-Za-z0-9_-]+)/);
  if(m){const a=(E.amb||[]).find(x=>x.qr_token==m[1]);if(a){E.ambSel=a.id;E.mtPrev="home";E.mt="amb";render();scrollTo(0,0);return}E.camErro="Este QR é de um ambiente que não pertence à sua unidade.";render();return}
  const t=txt.toUpperCase(),b=(E.bens||[]).find(x=>(x.patrimonio||"").toUpperCase()==t||(x.numero_serie||"").toUpperCase()==t);
  if(b){E.bemSel=b.id;E.mtPrev="home";E.mt="bem";render();scrollTo(0,0);return}E.camErro=`Nada encontrado para “${txt}”. Confira o número ou se o bem é da sua unidade.`;render()}

  <div class="bigs">${bigBtn("+","Abrir chamado aqui","Registrar um problema neste ambiente",`E.ncA='${a.id}';E.ncB='';irMan('novoch')`)}
  ${typeof abaRon=="function"&&tp!="fora"?bigBtn("R","Vistoriar este ambiente",MEDT.includes(tp)?"Medições do ambiente":"Ronda item por item",`vistDoAmb('${a.id}')`):""}
  ${typeof temAud=="function"&&temAud()?bigBtn("A","Auditar este ambiente","Conferir os bens com a câmera",`abrirAud('${a.id}')`):""}${typeof abrirEtqAmb=="function"&&souAdm()?bigBtn("▣","Etiqueta do QR","Prévia com a logo e impressão",`abrirEtqAmb()`):""}</div>
  ${typeof respAmbHTML=="function"?respAmbHTML(a):""}
  <div class="card"><b>Chamados em aberto (${C.length})</b>${C.map(linhaCh).join("")||`<p class="muted">Nenhum chamado em aberto aqui.</p>`}</div>
  <button class="btn ghost full" style="margin:0 0 12px" onclick="novoBemEm('${a.id}')">＋ Cadastrar bem neste ambiente</button>

/* ---- IndexedDB (com reserva em memória se o navegador bloquear) ---- */
let offIdbP=null;
function offIdb(){if(!("indexedDB" in window))return Promise.reject(new Error("sem IndexedDB"));return offIdbP||(offIdbP=new Promise((ok,er)=>{try{const r=indexedDB.open(DEMO?"atalaia-off-demo":"atalaia-off",1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("cache"))d.createObjectStore("cache");if(!d.objectStoreNames.contains("fila"))d.createObjectStore("fila",{keyPath:"seq",autoIncrement:true});if(!d.objectStoreNames.contains("mapa"))d.createObjectStore("mapa")};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}catch(e){er(e)}}))}
async function offTx(store,mode,fn){const d=await offIdb();return new Promise((ok,er)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let res;const q=fn(s);if(q)q.onsuccess=()=>{res=q.result};t.oncomplete=()=>ok(res);t.onerror=()=>er(t.error);t.onabort=()=>er(t.error)})}
async function cacheGet(k){if(k in OFF.mem)return OFF.mem[k];try{const v=await offTx("cache","readonly",s=>s.get(k));if(v!==undefined)OFF.mem[k]=v;return v}catch(e){return undefined}}
async function cachePut(k,v){OFF.mem[k]=v;try{await offTx("cache","readwrite",s=>s.put(v,k))}catch(e){}}
async function cachePatch(k,fn,base){let v=await cacheGet(k);if(v===undefined)v=base!==undefined?base:[];try{v=fn(structuredClone?structuredClone(v):JSON.parse(JSON.stringify(v)))??v}catch(e){}await cachePut(k,v)}

async function offLimparTudo(){OFF.mem={};OFF.fila=[];OFF.mapa={};OFF.erros=[];try{await offTx("cache","readwrite",s=>s.clear());await offTx("fila","readwrite",s=>s.clear());await offTx("mapa","readwrite",s=>s.clear())}catch(e){}updOffBar()}
async function offCarregarFila(){try{OFF.fila=await offTx("fila","readonly",s=>s.getAll())||[];const ks=await offTx("mapa","readonly",s=>s.getAllKeys())||[],vs=await offTx("mapa","readonly",s=>s.getAll())||[];ks.forEach((k,i)=>OFF.mapa[k]=vs[i])}catch(e){}}

/* ---- troca dos números provisórios pelos reais ---- */
function offTrocar(x){if(typeof x=="string"){for(const [k,v] of Object.entries(OFF.mapa)){if(x===k)return v;if(x.includes(k))x=x.split(k).join(String(v))}return x}
  if(Array.isArray(x))return x.map(offTrocar);if(x&&typeof x=="object"&&!(x instanceof Blob)){const o={};for(const k in x)o[k]=offTrocar(x[k]);return o}return x}

    const lidos=((E.aud&&E.aud.L)||[]).filter(x=>x.resultado!="repetido"&&x._bid).map(x=>x._bid);
    const r=!b?"sem_cadastro":lidos.includes(b.id)?"repetido":b.ambiente_id==amb?"localizado":"outro_ambiente";
    return {resultado:r,bem:b?b.nome:null,patrimonio:b?b.patrimonio:null,ambiente_cadastro:b?nomeAmbC(b.ambiente_id):null,_bid:b?b.id:null,_off:true}},
  fimAud:id=>{const amb=E.aud&&E.aud.amb,L=(E.aud&&E.aud.L)||[],B=(E.bens||[]).filter(b=>b.ambiente_id==amb&&b.ativo!==false),lid=L.map(x=>x._bid).filter(Boolean);
    const nl=B.filter(b=>!lid.includes(b.id)&&!L.some(x=>x.patrimonio&&x.patrimonio==b.patrimonio&&x.resultado=="localizado")).map(b=>({id:b.id,patrimonio:b.patrimonio,nome:b.nome}));
    return {esperados:B.length,localizados:L.filter(x=>x.resultado=="localizado").length,outro_ambiente:L.filter(x=>x.resultado=="outro_ambiente").length,sem_cadastro:L.filter(x=>x.resultado=="sem_cadastro").length,nao_localizados:nl,qtd_nao_localizados:nl.length,_off:true}},
  decidirTroca:(id,ok,motivo)=>{const t=(E.trocas||[]).find(x=>x.id==id)||{},b=(E.bens||[]).find(x=>x.id==t.bem_id)||{};if(!ok&&(motivo||"").trim().length<3)throw new Error("Escreva o motivo para descartar.");
    if(t.situacao&&t.situacao!="pendente")throw new Error("Esta troca já foi decidida.");return {situacao:ok?"confirmada":"descartada",novo_patrimonio:t.patrimonio_informado||null,velho_patrimonio:b.patrimonio||null,_off:true}},
  salvarResp:(id,d)=>({...((E.amb||[]).find(a=>a.id==id)||{id}),...d,_off:true}),
  gerarTermo:()=>({numero:"(sai quando a internet voltar)",_off:true})};
/* o que muda nos dados guardados, para a tela mostrar o que foi feito sem internet */
async function offAplicar(k,a,r){const c=E.v&&E.v.contratante_id,ag=new Date().toISOString();
  if(k=="abrirChM")await cachePatch(ck("chs",[c]),L=>[r,...L]);
  if(k=="acaoCh")await cachePatch(ck("chs",[c]),L=>L.map(x=>x.id==a[0]?{...x,...r}:x));
  if(k=="ajudar")await cachePatch(ck("ajudantes",[a[0]]),L=>[...L,{user_id:meuId(),nome:E.v.nome,em:ag}]);
  if(k=="regFoto")await cachePatch(ck("fotosCh",[a[0]]),L=>[...L,{path:a[1],etapa:a[2],tirada_em:a[3],na_hora:true,carimbo:a[5]}]);
  if(k=="assinarOS")await cachePatch(ck("assinaturas",[a[0]]),L=>[...L,{papel:a[1],nome:a[2],assinado_em:ag}]);
  if(k=="iniRonda")await cachePatch(ck("rondasDia",[c,a[0]]),L=>[...L,{id:r,estabelecimento_id:a[0],tipo:a[1],iniciada_em:ag}]);
  if(k=="regAmb")await cachePatch(ck("regsRonda",[a[0]]),L=>[...L,...(a[2]||[]).map(i=>({ambiente_id:a[1],item:i.item,resultado:i.resultado}))]);
  if(k=="fimRonda"){for(const key of Object.keys(OFF.mem).filter(x=>x.startsWith(OFF.uid+"|rondasDia|")))await cachePatch(key,L=>L.map(x=>x.id==a[0]?{...x,concluida_em:ag}:x))}
  if(k=="addRealizado")await cachePatch(ck("realizadosBem",[r.bem_id]),L=>[r,...L]);
  if(k=="addDoc")await cachePatch(ck("docsBem",[r.bem_id]),L=>[r,...L]);
  if(k=="informarTroca")await cachePatch(ck("trocas",[c]),L=>[r,...L]);
  if(k=="decidirTroca"){const up=L=>L.map(x=>x.id==a[0]?{...x,situacao:r.situacao,decidido_em:ag,decidido_por:E.v.nome,motivo:a[2]||null}:x);await cachePatch(ck("trocas",[c]),up);E.trocas=up(E.trocas||[])}
  if(k=="salvarResp"){for(const key of Object.keys(OFF.mem).filter(x=>x.startsWith(OFF.uid+"|ambientes|")))await cachePatch(key,L=>Array.isArray(L)?L.map(x=>x.id==a[0]?{...x,...a[1]}:x):L)}}

/* ---- embrulha os métodos do DB ---- */
function offEmbrulhar(){
  OFF_LER.forEach(k=>{const f=DB[k];if(typeof f!="function"||f._off)return;const g=async(...a)=>{a=offTrocar(a);const key=ck(k,a);
    if(temTmp(a)){const v=await cacheGet(key);return v!==undefined?v:[]}
    if(semRede()){const v=await cacheGet(key);if(v!==undefined)return v;if(OFF_VAZIO.includes(k))return [];throw new Error("Sem internet e sem dados guardados desta tela. Abra-a uma vez com internet.")}
    try{const r=await f.apply(DB,a);if(Array.isArray(r)&&!r.length){const v=await cacheGet(key);if(Array.isArray(v)&&v.length&&!(k in OFF_PODE_ESVAZIAR))return v}if(r!==undefined)cachePut(key,r);return r}catch(e){if(erroRede(e)){const v=await cacheGet(key);if(v!==undefined)return v;if(OFF_VAZIO.includes(k))return []}throw e}};g._off=1;DB[k]=g});
  OFF_FILA.forEach(k=>{const f=DB[k];if(typeof f!="function"||f._off)return;OFF[k]=f;const g=async(...a)=>{a=offTrocar(a);
    if(!semRede()&&!temTmp(a)&&!OFF.fila.length){try{return await f.apply(DB,a)}catch(e){if(!erroRede(e))throw e}}
    return offGuardar(k,a)};g._off=1;DB[k]=g});
  if(DB.carimbo&&!DB.carimbo._off){const f=DB.carimbo;const loc=id=>{const c=chLocal(id)||{};return {numero:c.numero||"(sem internet)",unidade:nomeUni(c.estabelecimento_id)||"",ambiente:nomeAmbC(c.ambiente_id),empresa:E.v.contratantes.nome,agora:new Date().toLocaleString("pt-BR")+" (hora do aparelho)"}};
    DB.carimbo=async id=>{id=offTrocar(id);if(semRede()||temTmp([id]))return loc(id);try{return await f.call(DB,id)}catch(e){if(erroRede(e))return loc(id);throw e}};DB.carimbo._off=1}
  if(DB.urlFoto&&!DB.urlFoto._off){const f=DB.urlFoto;DB.urlFoto=async p=>{if(!p||semRede()||String(p).startsWith("off/"))return E.fotos[p]||null;try{return await f.call(DB,p)}catch(e){return null}};DB.urlFoto._off=1}
  if(DB.registrar&&!DB.registrar._off){const f=DB.registrar;DB.registrar=async(...a)=>{if(semRede())return null;try{return await f.apply(DB,a)}catch(e){return null}};DB.registrar._off=1}
  if(DB.sessao&&!DB.sessao._off){const f=DB.sessao;DB.sessao=async()=>{const s=await f.call(DB);if(s&&s.user)OFF.uid=s.user.id||s.user.email||"anon";return s};DB.sessao._off=1}
  if(DB.entrar&&!DB.entrar._off){const f=DB.entrar;DB.entrar=async(...a)=>{const r=await f.apply(DB,a);try{await DB.sessao()}catch(e){}return r};DB.entrar._off=1}
  if(DB.sair&&!DB.sair._off){const f=DB.sair;DB.sair=async(...a)=>{if(OFF.fila.length&&!confirm(`Há ${OFF.fila.length} registro(s) feitos sem internet que ainda não foram enviados. Se sair agora, eles serão perdidos. Sair mesmo assim?`))throw new Error("Saída cancelada. Conecte-se à internet para enviar os registros.");await offLimparTudo();return f.apply(DB,a)};DB.sair._off=1}}

async function offGuardar(k,a){const opt=OFF_OTM[k](...a);const it={k,args:a,opt,desc:OFF_DESC[k]||k,em:new Date().toISOString(),quem:E.v&&E.v.nome};
  try{it.seq=await offTx("fila","readwrite",s=>s.add(it))}catch(e){it.seq=Date.now()+Math.random()}OFF.fila.push(it);
  await offAplicar(k,a,opt);offMarcar();updOffBar();if(!semRede())setTimeout(()=>offEnviar(),400);return opt}
function offMarcar(){OFF.ultimo=Date.now()}

/* ---- envio da fila quando a internet volta ---- */
async function offEnviar(manual){if(OFF.enviando||!OFF.fila.length)return;if(semRede()){if(manual)toast("Ainda sem internet. Os registros continuam guardados no aparelho.");return}
  OFF.enviando=true;updOffBar();let ok=0,parou=false;
  while(OFF.fila.length){const it=OFF.fila[0];const f=OFF[it.k];let args=offTrocar(it.args);
    try{if(temTmp(args))throw new Error("Depende de um registro que o servidor recusou.");const r=await f.apply(DB,args);
      if(typeof it.opt=="string"&&typeof r=="string"&&it.opt!==r)OFF.mapa[it.opt]=r;
      else if(it.opt&&typeof it.opt=="object"&&it.opt.id&&r&&typeof r=="object"&&r.id)OFF.mapa[it.opt.id]=r.id;
      try{for(const [kk,vv] of Object.entries(OFF.mapa))await offTx("mapa","readwrite",s=>s.put(vv,kk))}catch(e){}
      ok++}
    catch(e){if(erroRede(e)){parou=true;break}OFF.erros.push({desc:it.desc,em:it.em,erro:e.message,k:it.k})}
    OFF.fila.shift();try{await offTx("fila","readwrite",s=>s.delete(it.seq))}catch(e){}updOffBar()}
  OFF.enviando=false;if(E.chSel&&OFF.mapa[E.chSel])E.chSel=OFF.mapa[E.chSel];if(!OFF.fila.length){OFF.mapa={};try{await offTx("mapa","readwrite",s=>s.clear())}catch(e){}}
  updOffBar();
  if(ok){toast(`${ok} registro(s) feitos sem internet foram enviados.`);try{if(E.v){const c=E.v.contratante_id;E.chs=await DB.chs(c);if(typeof carregarRon=="function"&&E.ron)await carregarRon();E.fic=null;E.agenda=null;if(E.mt=="item"&&typeof carregarItem=="function")carregarItem();render()}}catch(e){}}
  if(OFF.erros.length&&!parou)OFF.aberto=true,updOffBar()}

/* ---- faixa de aviso ---- */
function updOffBar(){let el=document.getElementById("offbar");if(!el){el=document.createElement("div");el.id="offbar";el.setAttribute("role","status");document.body.appendChild(el)}
  const n=OFF.fila.length,off=semRede(),er=OFF.erros.length;
  if(!off&&!n&&!er){el.style.display="none";el.innerHTML="";document.body.style.paddingBottom="";return}
  const cor=er?"#c8372d":off?"#5b6470":"#2f6fb5";
  el.style.cssText=`display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:60;width:min(560px,calc(100% - 24px));background:${cor};color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.9rem`;
  const tit=OFF.enviando?`Enviando ${n} registro(s)…`:off?`📶 Sem internet${n?` · ${n} registro(s) guardado(s) no aparelho`:" · mostrando os últimos dados salvos"}`:n?`${n} registro(s) esperando para enviar`:`${er} registro(s) não foram aceitos pelo servidor`;
  el.innerHTML=`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><b>${tit}</b><span style="display:flex;gap:6px">${n&&!off&&!OFF.enviando?`<button onclick="offEnviar(true)" style="background:#fff;color:#111;border:0;border-radius:99px;padding:4px 10px;font-weight:700;cursor:pointer">Enviar agora</button>`:""}${n||er?`<button onclick="OFF.aberto=!OFF.aberto;updOffBar()" style="background:transparent;color:#fff;border:1px solid #fff;border-radius:99px;padding:4px 10px;cursor:pointer">${OFF.aberto?"Fechar":"Ver"}</button>`:""}</span></div>
  ${OFF.aberto?`<div style="margin-top:8px;max-height:40vh;overflow:auto;display:grid;gap:6px">${OFF.fila.map(it=>`<div style="background:rgba(255,255,255,.14);border-radius:8px;padding:6px 8px">⏳ ${esc(it.desc)} · ${hm(it.em)}</div>`).join("")}
   ${OFF.erros.map((x,i)=>`<div style="background:rgba(0,0,0,.2);border-radius:8px;padding:6px 8px">✖ ${esc(x.desc)} · ${hm(x.em)}<br><span style="opacity:.9">${esc(x.erro)}</span></div>`).join("")}
   ${er?`<button onclick="OFF.erros=[];OFF.aberto=false;updOffBar()" style="background:#fff;color:#111;border:0;border-radius:99px;padding:6px 10px;font-weight:700;cursor:pointer">Entendi, limpar avisos</button>`:""}
   <span style="opacity:.85;font-size:.8rem">Os registros são enviados sozinhos, na ordem em que foram feitos, assim que a internet voltar. Fotos feitas sem internet ficam com a hora do aparelho no carimbo.</span></div>`:""}`;document.body.style.paddingBottom=`calc(${el.offsetHeight+90}px + env(safe-area-inset-bottom))`}

/* ---- avisos nas mensagens ---- */
{const t0=toast;toast=function(t){if(Date.now()-OFF.ultimo<1500&&!/sem internet|guardado/i.test(t))t+=" · guardado no aparelho, será enviado quando a internet voltar.";return t0(t)}}

/* ---- ligar tudo ---- */
offEmbrulhar();
offCarregarFila().then(()=>{updOffBar();setTimeout(()=>offEnviar(),3000)});
addEventListener("online",()=>{updOffBar();setTimeout(()=>offEnviar(),800)});
addEventListener("offline",()=>{updOffBar();toast("Sem internet. Você pode continuar: o que fizer fica guardado e é enviado depois.")});
setInterval(()=>{if(OFF.fila.length&&!semRede())offEnviar()},30000);
if("serviceWorker" in navigator&&(location.protocol=="https:"||location.hostname=="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});

iniciar();


/* ---------------- Foto do usuário e logo da empresa ---------------- */
async function trocarMinhaFoto(inp){const f=inp.files[0];if(!f)return;try{const bl=await comprimirQuadrado(f,320);const p=await DB.enviarPerfil(E.v.contratante_id,bl);E.v.foto_path=p;E.fotoUrl=await DB.urlFoto(p);E.menuConta=false;toast("Foto atualizada.");render()}catch(e){toast(e.message)}}
async function trocarLogoEmpresa(inp){const f=inp.files[0];if(!f)return;if(f.size>2097152){toast("A logo precisa ter até 2 MB.");return}
  try{const bl=await comprimir(f).then(b=>b);const d=await DB.enviarLogo(E.v.contratante_id,bl,E.v.contratantes.design);E.v.contratantes.design=d;E.logoUrl=await DB.urlFoto(d.logo);E.menuConta=false;toast("Logo da empresa atualizada.");render()}catch(e){toast(e.message)}}
function comprimirQuadrado(file,M){return new Promise((ok,er)=>{const img=new Image();img.onload=()=>{const l=Math.min(img.width,img.height),cv=document.createElement("canvas");cv.width=cv.height=M;cv.getContext("2d").drawImage(img,(img.width-l)/2,(img.height-l)/2,l,l,0,0,M,M);cv.toBlob(b=>b?ok(b):er(new Error("Não foi possível ler a foto.")),"image/jpeg",.85)};img.onerror=()=>er(new Error("Não foi possível ler a foto."));img.src=URL.createObjectURL(file)})}
document.addEventListener("click",e=>{if(E.menuConta&&!e.target.closest(".menu-conta")&&!e.target.closest(".avatar")){E.menuConta=false;render()}});
// Mostrar / ocultar senha em todos os campos de senha
(function(){
  function olho(inp){
    if(inp.dataset.olho)return; inp.dataset.olho="1";
    var box=document.createElement("span"); box.className="senha-box";
    inp.parentNode.insertBefore(box,inp); box.appendChild(inp);
    var b=document.createElement("button"); b.type="button"; b.className="senha-olho";
    b.textContent="\u{1F441} Mostrar"; b.setAttribute("aria-label","Mostrar senha");
    b.onclick=function(){var mostrar=inp.type==="password"; inp.type=mostrar?"text":"password";
      b.textContent=mostrar?"\u{1F648} Ocultar":"\u{1F441} Mostrar"; b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha"); inp.focus();};
    box.appendChild(b);
  }
  function varrer(){document.querySelectorAll('input[type="password"]:not([data-olho])').forEach(olho);}
  new MutationObserver(varrer).observe(document.body,{childList:true,subtree:true}); varrer();
})();
