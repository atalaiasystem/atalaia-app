<style>
:root{--ink:#1d1f23;--amb:#f2a33a;--mut:#6b7078;--line:#e3e0da;--bg:#f5f3ef;--card:#fff;--ok:#1f9a55;--bad:#B02E25;--warn:#b7791f;--soft:#efece6}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:14px 0 16px;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:12px}
header svg{width:34px;height:34px;flex-shrink:0}
header b{font-size:1.05rem;letter-spacing:.04em;display:block}
header small{color:#c9cdd2;font-size:.78rem}
.pill{display:inline-block;background:var(--amb);color:var(--ink);font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
h1{font-size:1.35rem;margin:18px 0 4px}h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;min-height:46px}
.btn.amb{background:var(--amb);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.88rem}.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:grid;gap:5px;font-size:.88rem;font-weight:600;margin-bottom:12px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amb);border-color:var(--amb)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.bem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.bem:first-child{border-top:0}
.bem .ft{width:64px;height:64px;border-radius:10px;background:var(--soft);object-fit:cover;display:grid;place-items:center;color:var(--mut);font-size:.7rem;text-align:center}
.bem b{display:block}.pat{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--mut)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{background:none;border:0;padding:10px 4px;font-size:.78rem;color:var(--mut);display:grid;justify-items:center;gap:3px;cursor:pointer}
nav.tabs button[aria-current=true]{color:var(--ink);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.lock{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lock div{border:1px dashed #cfcac2;border-radius:10px;padding:10px;font-size:.85rem;color:var(--mut)}
.lock div b{display:block;color:var(--ink);font-size:.88rem}
.msg{padding:10px 12px;border-radius:10px;font-size:.9rem;margin-bottom:12px}
.msg.err{background:#fbe9e7;color:var(--bad)}.msg.ok{background:#e6f4ec;color:var(--ok)}.msg.info{background:#fff4e2;color:#7a4e0c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;align-items:end;z-index:20}
.modal .sheet{background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center;justify-items:center}.modal .sheet{border-radius:18px;width:640px}}
.foto-prev{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:var(--soft);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:.9rem;max-width:90vw}
.center{min-height:80vh;display:grid;align-content:center}
.muted{color:var(--mut);font-size:.88rem}
.chk{list-style:none;padding:0;margin:-4px 0 12px;font-size:.84rem;display:grid;gap:2px}.chk li{color:var(--mut)}.chk li.ok{color:var(--ok)}.chk li:before{content:"○ "}.chk li.ok:before{content:"✓ "}
.qr{display:block;width:200px;height:200px;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;word-break:break-all;background:var(--soft);padding:8px 10px;border-radius:8px;font-size:.85rem}
.otp{font-size:1.6rem;letter-spacing:.4em;text-align:center;font-family:ui-monospace,Menlo,monospace}
.demo{background:var(--amb);color:var(--ink);text-align:center;font-size:.8rem;font-weight:700;padding:4px}
.senha-box{position:relative;display:block}.senha-box input{padding-right:86px}.senha-olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:.82rem;font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px;opacity:.85}.senha-olho:hover,.senha-olho:focus{opacity:1;text-decoration:underline}
.voltar{background:none;border:0;font-weight:700;padding:6px 0;margin:0 0 8px;cursor:pointer;color:var(--ink);font-size:.95rem}
.fotos-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.fg{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}.fg img{width:100%;height:100%;object-fit:cover;display:block}
.fg-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(29,31,35,.8);color:#fff;font-weight:700;cursor:pointer}.fg-capa{position:absolute;left:4px;bottom:4px;background:var(--amb);color:var(--ink);font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:6px}
.btn-foto{display:inline-flex!important;align-items:center;gap:6px;cursor:pointer}
.nova-versao{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
.opc-baixar{display:grid;gap:10px;margin:12px 0}.opc-baixar button{text-align:left;padding:14px}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:var(--amb);color:var(--ink);font-weight:800;display:grid;place-items:center;overflow:hidden;cursor:pointer;flex-shrink:0;padding:0;font-size:.9rem}.avatar img{width:100%;height:100%;object-fit:cover}
.logo-emp{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;flex-shrink:0}
.menu-conta{position:absolute;right:12px;top:64px;width:min(320px,calc(100vw - 24px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;z-index:20;display:grid;gap:2px}
.mc-item{display:block;text-align:left;background:none;border:0;padding:10px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--ink);margin:0}.mc-item:hover{background:var(--soft)}

.bigs{display:grid;gap:10px;margin:6px 0 14px}.big{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;width:100%;position:relative}.big:disabled{opacity:.55;cursor:default}
.big .ico{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex:none}.big .tx{display:grid;gap:2px;min-width:0}.big .tx span{color:var(--mut);font-size:.85rem}.big .tagp{position:absolute;top:8px;right:10px;font-size:.68rem;background:var(--soft);border-radius:99px;padding:2px 8px;color:var(--mut)}
.rowch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer}.rowch:first-of-type{border-top:0}.rowch .dot{width:10px;height:10px;border-radius:50%;background:var(--pc);margin-top:6px;flex:none}.rowch .tx{display:grid;gap:2px;min-width:0}.rowch .tx>span{color:var(--mut);font-size:.84rem}
.tg{display:inline-block;font-size:.72rem;font-weight:700;color:var(--tc);border:1.5px solid var(--tc);border-radius:99px;padding:1px 8px;margin-top:3px}
.chps{display:flex;gap:6px;flex-wrap:wrap}.chp{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.84rem;cursor:pointer}.chp[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.faixa{background:var(--tc);color:#fff;font-weight:700;border-radius:12px;padding:10px 14px;margin:0 0 12px}
.campo-leitor{display:flex;gap:6px;align-items:stretch}.campo-leitor input{flex:1;min-width:0}.campo-leitor .btn{margin:0;white-space:nowrap}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.9rem}.dl dt{color:var(--mut)}.dl dd{margin:0;min-width:0}
.fotos-ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}.fotos-ch figure{margin:0}.fotos-ch img,.fotos-ch .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--soft);display:block}.fotos-ch figcaption{font-size:.78rem;color:var(--mut);margin-top:3px}
.fpick{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}.fpick.ok{border-style:solid;border-color:#1f9a55}

/* paletas de cores (escolhidas no painel › Configurações › Design) */
:root[data-pal]:not([data-pal="classico"]){--bg:var(--p-bg);--line:var(--p-line);--soft:var(--p-soft)}
:root[data-pal]:not([data-pal="classico"]) header{background:linear-gradient(110deg,var(--p-h1),var(--p-h2));color:var(--p-hink)}:root[data-pal]:not([data-pal="classico"]) header small{color:inherit;opacity:.75}
:root[data-pal]:not([data-pal="classico"]) header svg path[stroke="#fff"]{stroke:var(--p-hink)}
:root[data-pal]:not([data-pal="classico"]) .btn:not(.amb):not(.ghost){background:var(--p-pri);color:#fff}
:root[data-pal]:not([data-pal="classico"]) .big .ico,:root[data-pal]:not([data-pal="classico"]) .ico{background:linear-gradient(135deg,var(--p-pri),var(--p-k2))}
:root[data-pal]:not([data-pal="classico"]) .bigs>.big:nth-child(4n+2) .ico{background:linear-gradient(135deg,var(--p-k2),var(--p-pri))}:root[data-pal]:not([data-pal="classico"]) .bigs>.big:nth-child(4n+3) .ico{background:linear-gradient(135deg,var(--p-k3),var(--p-acc))}:root[data-pal]:not([data-pal="classico"]) .bigs>.big:nth-child(4n+4) .ico{background:linear-gradient(135deg,var(--p-k4),var(--p-k3))}
:root[data-pal]:not([data-pal="classico"]) nav.tabs button[aria-current=true]{color:var(--p-pri)}
:root[data-pal]:not([data-pal="classico"]) .chp[aria-pressed=true]{background:var(--p-pri);border-color:var(--p-pri)}
:root[data-pal]:not([data-pal="classico"]) .card{border-color:transparent;box-shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
:root[data-pal]:not([data-pal="classico"]) h1{color:var(--p-tit)}

.campo-erro{outline:2px solid #c0392b!important;outline-offset:1px;background:#fff5f4!important}
.msg.err.fx{margin:8px 0 12px;font-weight:600}
/* ===== Visual Corporativo (padrão desde 0.3.36) ===== */
:root[data-estilo="corporativo"]{--cp:#1F5FA8;--ink:#1A1D21!important;--mut:#5B6470!important;--line:#E3E6EA!important;--bg:#F6F7F9!important;--card:#fff!important;--soft:#EEF2F7!important;--ok:#1E7F45;--bad:#B02E25;--warn:#8F5600;--amb:var(--cp)!important}
:root[data-estilo="corporativo"] body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-estilo="corporativo"] header{background:#fff!important;color:var(--ink)!important;border-bottom:1px solid var(--line)}
:root[data-estilo="corporativo"] header small{color:var(--mut)!important;opacity:1}
:root[data-estilo="corporativo"] header svg path[stroke="#fff"]{stroke:#111827!important}
:root[data-estilo="corporativo"] .logo-emp{border:1px solid var(--line)}
:root[data-estilo="corporativo"] .avatar{background:var(--soft)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
:root[data-estilo="corporativo"] .pill{background:var(--soft)!important;color:var(--ink)!important;border-radius:6px;font-weight:600}
:root[data-estilo="corporativo"] .card,:root[data-estilo="corporativo"] .big{border-radius:8px!important;border:1px solid var(--line)!important;box-shadow:none!important}
:root[data-estilo="corporativo"] .big .ico,:root[data-estilo="corporativo"] .ico,:root[data-estilo="corporativo"] .bigs>.big .ico{background:#EEF2F7!important;color:var(--cp)!important;border-radius:8px}
:root[data-estilo="corporativo"] .btn,:root[data-estilo="corporativo"] .btn:not(.amb):not(.ghost){background:var(--cp)!important;color:#fff!important;border-radius:8px}
:root[data-estilo="corporativo"] .btn.amb{background:var(--cp)!important;color:#fff!important}
:root[data-estilo="corporativo"] .btn.ghost{background:#fff!important;color:var(--ink)!important;border:1px solid #D1D5DB!important}
:root[data-estilo="corporativo"] .chp{border-radius:8px}:root[data-estilo="corporativo"] .chp[aria-pressed=true]{background:var(--cp)!important;border-color:var(--cp)!important;color:#fff}
:root[data-estilo="corporativo"] input,:root[data-estilo="corporativo"] select,:root[data-estilo="corporativo"] textarea{border-radius:8px;border-width:1px}
:root[data-estilo="corporativo"] input:focus,:root[data-estilo="corporativo"] select:focus,:root[data-estilo="corporativo"] textarea:focus{outline:2px solid var(--cp);border-color:var(--cp)}
:root[data-estilo="corporativo"] nav.tabs button[aria-current=true]{color:var(--cp)!important}
:root[data-estilo="corporativo"] .bar i{background:#4B5563!important}
:root[data-estilo="corporativo"] h1{color:var(--ink)!important;font-weight:600}
:root[data-estilo="corporativo"] .demo{background:#FEF3C7!important;color:#78350F!important}
:root[data-estilo="corporativo"] .fg-capa{background:var(--ink)!important;color:#fff!important}
</style>

function fecharNivel(){
  if(E.modal){E.modal=null;render();return true}
  if(E.tela=="senha"&&E.modoSenha=="trocar"){E.tela="app";E.msg=null;render();return true}
  if(E.tela=="app"&&E.aba=="man"&&E.mt&&E.mt!="home"){if(typeof pararCam=="function")pararCam();const P=E.mtPilha||[];let nx=P.pop();while(nx&&(nx==E.mt||nx=="qr"))nx=P.pop();E.mt=nx||"home";E.mtPilha=P;E.mtPrev=P[P.length-1]||"home";render();scrollTo(0,0);if(E.mt!="home")abrirNivel();if(E.mt=="item"&&typeof carregarItem=="function")carregarItem();return true}
  if(E.tela=="app"&&E.aba=="ron"&&E.rt&&E.rt!="home"){E.rt="home";render();scrollTo(0,0);return true}
  if(E.tela=="app"&&E.aba!=abaRaiz()){E.aba=abaRaiz();render();scrollTo(0,0);return true}
  return false}

function gs1(txt){const t=String(txt).replace(/^\]..?/,"");const o={};

  if(!/^(01|00|02|10|11|17|21|240|241)/.test(t))return o;

    if(FIX[a2]!=null){ai=a2;len=FIX[a2]}else if(["10","21","22"].includes(a2))ai=a2;else if(["240","241","250","251"].includes(a3))ai=a3;else break;
    i+=ai.length;let v;if(len){v=t.substr(i,len);i+=len}else{const j=t.indexOf("\x1d",i);v=j<0?t.slice(i):t.slice(i,j);i=j<0?t.length:j+1}o[ai]=v}

    const kv=[...c.matchAll(/(S\/?N|SN|SERIAL|S[ÉE]RIE|MOD(?:EL|ELO)?|REF|P\/?N)\s*[:=]\s*([^\s;|,]+)/gi)];
    if(kv.length){kv.forEach(([,k,v])=>{if(/S\/?N|SN|SERIAL|S[ÉE]RIE/i.test(k)){if(!r.serie)r.serie=v}else if(!r.modelo)r.modelo=v});continue}

/* ---- foto com carimbo ---- */
/* hora do servidor no fuso da unidade; sem internet, hora do aparelho (marcada) */
async function horaFoto(estab){try{if(typeof semRede=="function"&&semRede())throw 0;const h=await DB.horaLocal(estab);return `${h.agora} (${h.rotulo}${/demonstra/.test(h.rotulo)?"":", hora do servidor"})`}catch(e){return new Date().toLocaleString("pt-BR")+" (hora do aparelho)"}}
function pegarGPS(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>ok(null),{enableHighAccuracy:true,timeout:7000,maximumAge:60000})})}
async function fotoCh(inp,etapa){const f=inp.files&&inp.files[0];if(!f)return;const c=(E.chs||[]).find(x=>x.id==E.chSel);toast("Preparando a foto com carimbo…");
  try{const [cb,g]=await Promise.all([DB.carimbo(c.id),pegarGPS()]);
    const L=[`Chamado nº ${cb.numero} · ${ETAPAS_F[etapa]||etapa}`,[cb.unidade,cb.ambiente].filter(Boolean).join(" · "),(cb.rotulo?`${cb.agora} (${cb.rotulo}, hora do servidor)`:cb.agora),g?`GPS ${g.lat}, ${g.lng} (±${g.acc} m)`:"Localização não autorizada",`Atalaia System · ${E.v.nome||""}`];
    const blob=await carimbar(f,L);const p=await DB.subirFotoCh(E.v.contratante_id,c.id,blob,etapa);
    const r=await DB.regFoto(c.id,p,etapa,new Date(f.lastModified||Date.now()).toISOString(),g,L.join(" | "));
    toast(r&&r.na_hora===false?"Foto enviada, mas marcada como “não tirada na hora”.":`Foto ${ETAPAS_F[etapa].toLowerCase()} enviada.`);carregarItem()}catch(e){toast(e.message||"Não foi possível enviar a foto.")}inp.value=""}
async function carimbar(file,linhas){const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(file)});
  const s=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),fs=Math.max(14,Math.round(w/42)),lh=Math.round(fs*1.35),band=lh*linhas.length+fs;
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.drawImage(im,0,0,w,h);
  x.fillStyle="rgba(0,0,0,.62)";x.fillRect(0,h-band,w,band);x.fillStyle="#fff";x.textBaseline="top";
  linhas.forEach((t,i)=>{x.font=`${i==0?"700 ":""}${i==linhas.length-1?Math.round(fs*.8):fs}px system-ui,Arial,sans-serif`;x.fillStyle=i==0?"#f2a33a":"#fff";x.fillText(t,Math.round(fs*.6),h-band+Math.round(fs/2)+i*lh,w-fs)});
  return await new Promise(ok=>cv.toBlob(ok,"image/jpeg",.82))}

function prepAssin(limpar){const cv=$("#acv");if(!cv)return;const x=cv.getContext("2d");x.lineWidth=3;x.lineCap="round";x.strokeStyle="#1d1f23";if(limpar){x.clearRect(0,0,cv.width,cv.height);E.modal.risco=false;return}
  let on=false;const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};

/* ---- IndexedDB (com reserva em memória se o navegador bloquear) ---- */
let offIdbP=null;
function offIdb(){if(!("indexedDB" in window))return Promise.reject(new Error("sem IndexedDB"));return offIdbP||(offIdbP=new Promise((ok,er)=>{try{const r=indexedDB.open(DEMO?"atalaia-off-demo":"atalaia-off",1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("cache"))d.createObjectStore("cache");if(!d.objectStoreNames.contains("fila"))d.createObjectStore("fila",{keyPath:"seq",autoIncrement:true});if(!d.objectStoreNames.contains("mapa"))d.createObjectStore("mapa")};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}catch(e){er(e)}}))}
async function offTx(store,mode,fn){const d=await offIdb();return new Promise((ok,er)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let res;const q=fn(s);if(q)q.onsuccess=()=>{res=q.result};t.oncomplete=()=>ok(res);t.onerror=()=>er(t.error);t.onabort=()=>er(t.error)})}
async function cacheGet(k){if(k in OFF.mem)return OFF.mem[k];try{const v=await offTx("cache","readonly",s=>s.get(k));if(v!==undefined)OFF.mem[k]=v;return v}catch(e){return undefined}}
async function cachePut(k,v){OFF.mem[k]=v;try{await offTx("cache","readwrite",s=>s.put(v,k))}catch(e){}}
async function cachePatch(k,fn,base){let v=await cacheGet(k);if(v===undefined)v=base!==undefined?base:[];try{v=fn(structuredClone?structuredClone(v):JSON.parse(JSON.stringify(v)))??v}catch(e){}await cachePut(k,v)}
const ck=(k,a)=>OFF.uid+"|"+k+"|"+JSON.stringify(a);
async function offLimparTudo(){OFF.mem={};OFF.fila=[];OFF.mapa={};OFF.erros=[];try{await offTx("cache","readwrite",s=>s.clear());await offTx("fila","readwrite",s=>s.clear());await offTx("mapa","readwrite",s=>s.clear())}catch(e){}updOffBar()}
async function offCarregarFila(){try{OFF.fila=await offTx("fila","readonly",s=>s.getAll())||[];const ks=await offTx("mapa","readonly",s=>s.getAllKeys())||[],vs=await offTx("mapa","readonly",s=>s.getAll())||[];ks.forEach((k,i)=>OFF.mapa[k]=vs[i])}catch(e){}}

/* ---- troca dos números provisórios pelos reais ---- */
function offTrocar(x){if(typeof x=="string"){for(const [k,v] of Object.entries(OFF.mapa)){if(x===k)return v;if(x.includes(k))x=x.split(k).join(String(v))}return x}
  if(Array.isArray(x))return x.map(offTrocar);if(x&&typeof x=="object"&&!(x instanceof Blob)){const o={};for(const k in x)o[k]=offTrocar(x[k]);return o}return x}
const temTmp=a=>/off-[0-9a-f-]{36}|off\/[0-9a-f-]{36}/.test(JSON.stringify(a,(k,v)=>v instanceof Blob?null:v));

    if(t.situacao&&t.situacao!="pendente")throw new Error("Esta troca já foi decidida.");return {situacao:ok?"confirmada":"descartada",novo_patrimonio:t.patrimonio_informado||null,velho_patrimonio:b.patrimonio||null,_off:true}},

/* o que muda nos dados guardados, para a tela mostrar o que foi feito sem internet */
async function offAplicar(k,a,r){const c=E.v&&E.v.contratante_id,ag=new Date().toISOString();
  if(k=="abrirChM")await cachePatch(ck("chs",[c]),L=>[r,...L]);

  if(k=="ajudar")await cachePatch(ck("ajudantes",[a[0]]),L=>[...L,{user_id:meuId(),nome:E.v.nome,em:ag}]);
  if(k=="regFoto")await cachePatch(ck("fotosCh",[a[0]]),L=>[...L,{path:a[1],etapa:a[2],tirada_em:a[3],na_hora:true,carimbo:a[5]}]);
  if(k=="assinarOS")await cachePatch(ck("assinaturas",[a[0]]),L=>[...L,{papel:a[1],nome:a[2],assinado_em:ag}]);
  if(k=="iniRonda")await cachePatch(ck("rondasDia",[c,a[0]]),L=>[...L,{id:r,estabelecimento_id:a[0],tipo:a[1],iniciada_em:ag}]);
  if(k=="regAmb")await cachePatch(ck("regsRonda",[a[0]]),L=>[...L,...(a[2]||[]).map(i=>({ambiente_id:a[1],item:i.item,resultado:i.resultado}))]);
  if(k=="fimRonda"){for(const key of Object.keys(OFF.mem).filter(x=>x.startsWith(OFF.uid+"|rondasDia|")))await cachePatch(key,L=>L.map(x=>x.id==a[0]?{...x,concluida_em:ag}:x))}
  if(k=="addRealizado")await cachePatch(ck("realizadosBem",[r.bem_id]),L=>[r,...L]);
  if(k=="addDoc")await cachePatch(ck("docsBem",[r.bem_id]),L=>[r,...L]);
  if(k=="informarTroca")await cachePatch(ck("trocas",[c]),L=>[r,...L]);
  if(k=="decidirTroca"){const up=L=>L.map(x=>x.id==a[0]?{...x,situacao:r.situacao,decidido_em:ag,decidido_por:E.v.nome,motivo:a[2]||null}:x);await cachePatch(ck("trocas",[c]),up);E.trocas=up(E.trocas||[])}

/* ---- embrulha os métodos do DB ---- */
function offEmbrulhar(){
  OFF_LER.forEach(k=>{const f=DB[k];if(typeof f!="function"||f._off)return;const g=async(...a)=>{a=offTrocar(a);const key=ck(k,a);
    if(temTmp(a)){const v=await cacheGet(key);return v!==undefined?v:[]}
    if(semRede()){const v=await cacheGet(key);if(v!==undefined)return v;if(OFF_VAZIO.includes(k))return [];throw new Error("Sem internet e sem dados guardados desta tela. Abra-a uma vez com internet.")}
    try{const r=await f.apply(DB,a);if(Array.isArray(r)&&!r.length){const v=await cacheGet(key);if(Array.isArray(v)&&v.length&&!(k in OFF_PODE_ESVAZIAR))return v}if(r!==undefined)cachePut(key,r);return r}catch(e){if(erroRede(e)){const v=await cacheGet(key);if(v!==undefined)return v;if(OFF_VAZIO.includes(k))return []}throw e}};g._off=1;DB[k]=g});
  OFF_FILA.forEach(k=>{const f=DB[k];if(typeof f!="function"||f._off)return;OFF[k]=f;const g=async(...a)=>{a=offTrocar(a);
    if(!semRede()&&!temTmp(a)&&!OFF.fila.length){try{return await f.apply(DB,a)}catch(e){if(!erroRede(e))throw e}}
    return offGuardar(k,a)};g._off=1;DB[k]=g});
  if(DB.carimbo&&!DB.carimbo._off){const f=DB.carimbo;const loc=id=>{const c=chLocal(id)||{};return {numero:c.numero||"(sem internet)",unidade:nomeUni(c.estabelecimento_id)||"",ambiente:nomeAmbC(c.ambiente_id),empresa:E.v.contratantes.nome,agora:new Date().toLocaleString("pt-BR")+" (hora do aparelho)"}};
    DB.carimbo=async id=>{id=offTrocar(id);if(semRede()||temTmp([id]))return loc(id);try{return await f.call(DB,id)}catch(e){if(erroRede(e))return loc(id);throw e}};DB.carimbo._off=1}
  if(DB.urlFoto&&!DB.urlFoto._off){const f=DB.urlFoto;DB.urlFoto=async p=>{if(!p||semRede()||String(p).startsWith("off/"))return E.fotos[p]||null;try{return await f.call(DB,p)}catch(e){return null}};DB.urlFoto._off=1}
  if(DB.registrar&&!DB.registrar._off){const f=DB.registrar;DB.registrar=async(...a)=>{if(semRede())return null;try{return await f.apply(DB,a)}catch(e){return null}};DB.registrar._off=1}
  if(DB.sessao&&!DB.sessao._off){const f=DB.sessao;DB.sessao=async()=>{const s=await f.call(DB);if(s&&s.user)OFF.uid=s.user.id||s.user.email||"anon";return s};DB.sessao._off=1}
  if(DB.entrar&&!DB.entrar._off){const f=DB.entrar;DB.entrar=async(...a)=>{const r=await f.apply(DB,a);try{await DB.sessao()}catch(e){}return r};DB.entrar._off=1}
  if(DB.sair&&!DB.sair._off){const f=DB.sair;DB.sair=async(...a)=>{if(OFF.fila.length&&!confirm(`Há ${OFF.fila.length} registro(s) feitos sem internet que ainda não foram enviados. Se sair agora, eles serão perdidos. Sair mesmo assim?`))throw new Error("Saída cancelada. Conecte-se à internet para enviar os registros.");await offLimparTudo();return f.apply(DB,a)};DB.sair._off=1}}

async function offGuardar(k,a){const opt=OFF_OTM[k](...a);const it={k,args:a,opt,desc:OFF_DESC[k]||k,em:new Date().toISOString(),quem:E.v&&E.v.nome};
  try{it.seq=await offTx("fila","readwrite",s=>s.add(it))}catch(e){it.seq=Date.now()+Math.random()}OFF.fila.push(it);
  await offAplicar(k,a,opt);offMarcar();updOffBar();if(!semRede())setTimeout(()=>offEnviar(),400);return opt}
function offMarcar(){OFF.ultimo=Date.now()}

/* ---- envio da fila quando a internet volta ---- */
async function offEnviar(manual){if(OFF.enviando||!OFF.fila.length)return;if(semRede()){if(manual)toast("Ainda sem internet. Os registros continuam guardados no aparelho.");return}
  OFF.enviando=true;updOffBar();let ok=0,parou=false;
  while(OFF.fila.length){const it=OFF.fila[0];const f=OFF[it.k];let args=offTrocar(it.args);
    try{if(temTmp(args))throw new Error("Depende de um registro que o servidor recusou.");const r=await f.apply(DB,args);
      if(typeof it.opt=="string"&&typeof r=="string"&&it.opt!==r)OFF.mapa[it.opt]=r;
      else if(it.opt&&typeof it.opt=="object"&&it.opt.id&&r&&typeof r=="object"&&r.id)OFF.mapa[it.opt.id]=r.id;
      try{for(const [kk,vv] of Object.entries(OFF.mapa))await offTx("mapa","readwrite",s=>s.put(vv,kk))}catch(e){}
      ok++}
    catch(e){if(erroRede(e)){parou=true;break}OFF.erros.push({desc:it.desc,em:it.em,erro:e.message,k:it.k})}
    OFF.fila.shift();try{await offTx("fila","readwrite",s=>s.delete(it.seq))}catch(e){}updOffBar()}
  OFF.enviando=false;if(E.chSel&&OFF.mapa[E.chSel])E.chSel=OFF.mapa[E.chSel];if(!OFF.fila.length){OFF.mapa={};try{await offTx("mapa","readwrite",s=>s.clear())}catch(e){}}
  updOffBar();
  if(ok){toast(`${ok} registro(s) feitos sem internet foram enviados.`);try{if(E.v){const c=E.v.contratante_id;E.chs=await DB.chs(c);if(typeof carregarRon=="function"&&E.ron)await carregarRon();E.fic=null;E.agenda=null;if(E.mt=="item"&&typeof carregarItem=="function")carregarItem();render()}}catch(e){}}
  if(OFF.erros.length&&!parou)OFF.aberto=true,updOffBar()}

/* ---- faixa de aviso ---- */
function updOffBar(){let el=document.getElementById("offbar");if(!el){el=document.createElement("div");el.id="offbar";el.setAttribute("role","status");document.body.appendChild(el)}
  const n=OFF.fila.length,off=semRede(),er=OFF.erros.length;
  if(!off&&!n&&!er){el.style.display="none";el.innerHTML="";document.body.style.paddingBottom="";return}
  const cor=er?"#B02E25":off?"#5b6470":"#2f6fb5";
  el.style.cssText=`display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:60;width:min(560px,calc(100% - 24px));background:${cor};color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.9rem`;
  const tit=OFF.enviando?`Enviando ${n} registro(s)…`:off?`📶 Sem internet${n?` · ${n} registro(s) guardado(s) no aparelho`:" · mostrando os últimos dados salvos"}`:n?`${n} registro(s) esperando para enviar`:`${er} registro(s) não foram aceitos pelo servidor`;

  ${OFF.aberto?`<div style="margin-top:8px;max-height:40vh;overflow:auto;display:grid;gap:6px">${OFF.fila.map(it=>`<div style="background:rgba(255,255,255,.14);border-radius:8px;padding:6px 8px">⏳ ${esc(it.desc)} · ${hm(it.em)}</div>`).join("")}
   ${OFF.erros.map((x,i)=>`<div style="background:rgba(0,0,0,.2);border-radius:8px;padding:6px 8px">✖ ${esc(x.desc)} · ${hm(x.em)}<br><span style="opacity:.9">${esc(x.erro)}</span></div>`).join("")}
   ${er?`<button onclick="OFF.erros=[];OFF.aberto=false;updOffBar()" style="background:#fff;color:#111;border:0;border-radius:99px;padding:6px 10px;font-weight:700;cursor:pointer">Entendi, limpar avisos</button>`:""}
   <span style="opacity:.85;font-size:.8rem">Os registros são enviados sozinhos, na ordem em que foram feitos, assim que a internet voltar. Fotos feitas sem internet ficam com a hora do aparelho no carimbo.</span></div>`:""}`;document.body.style.paddingBottom=`calc(${el.offsetHeight+90}px + env(safe-area-inset-bottom))`}

/* ---------------- Foto do usuário e logo da empresa ---------------- */
async function trocarMinhaFoto(inp){const f=inp.files[0];if(!f)return;try{const bl=await comprimirQuadrado(f,320);const p=await DB.enviarPerfil(E.v.contratante_id,bl);E.v.foto_path=p;E.fotoUrl=await DB.urlFoto(p);E.menuConta=false;toast("Foto atualizada.");render()}catch(e){toast(e.message)}}
async function trocarLogoEmpresa(inp){const f=inp.files[0];if(!f)return;if(f.size>2097152){toast("A logo precisa ter até 2 MB.");return}
  try{const bl=await comprimir(f).then(b=>b);const d=await DB.enviarLogo(E.v.contratante_id,bl,E.v.contratantes.design);E.v.contratantes.design=d;E.logoUrl=await DB.urlFoto(d.logo);E.menuConta=false;toast("Logo da empresa atualizada.");render()}catch(e){toast(e.message)}}
function comprimirQuadrado(file,M){return new Promise((ok,er)=>{const img=new Image();img.onload=()=>{const l=Math.min(img.width,img.height),cv=document.createElement("canvas");cv.width=cv.height=M;cv.getContext("2d").drawImage(img,(img.width-l)/2,(img.height-l)/2,l,l,0,0,M,M);cv.toBlob(b=>b?ok(b):er(new Error("Não foi possível ler a foto.")),"image/jpeg",.85)};img.onerror=()=>er(new Error("Não foi possível ler a foto."));img.src=URL.createObjectURL(file)})}
document.addEventListener("click",e=>{if(E.menuConta&&!e.target.closest(".menu-conta")&&!e.target.closest(".avatar")){E.menuConta=false;render()}});
// Mostrar / ocultar senha em todos os campos de senha
(function(){
  function olho(inp){
    if(inp.dataset.olho)return; inp.dataset.olho="1";
    var box=document.createElement("span"); box.className="senha-box";
    inp.parentNode.insertBefore(box,inp); box.appendChild(inp);
    var b=document.createElement("button"); b.type="button"; b.className="senha-olho";
    b.textContent="\u{1F441} Mostrar"; b.setAttribute("aria-label","Mostrar senha");
    b.onclick=function(){var mostrar=inp.type==="password"; inp.type=mostrar?"text":"password";
      b.textContent=mostrar?"\u{1F648} Ocultar":"\u{1F441} Mostrar"; b.setAttribute("aria-label",mostrar?"Ocultar senha":"Mostrar senha"); inp.focus();};
    box.appendChild(b);
  }
  function varrer(){document.querySelectorAll('input[type="password"]:not([data-olho])').forEach(olho);}
  new MutationObserver(varrer).observe(document.body,{childList:true,subtree:true}); varrer();
})();
</script>
