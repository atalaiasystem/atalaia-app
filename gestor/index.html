<style>
:root{--bg:#f5f3ef;--surface:#fff;--ink:#1d1f23;--muted:#6b7078;--line:#e3e0da;--soft:#efece6;--client:#1d1f23;--client-ink:#fff;--client-soft:#ecebe8;--amb:#f2a33a;--ok:#1f9a55;--warn:#b7791f;--bad:#c8372d;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="escuro"]{--bg:#111316;--surface:#1a1d21;--ink:#e8e9eb;--muted:#a0a5ad;--line:#2c3036;--soft:#23272c;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#111316;--surface:#1a1d21;--ink:#e8e9eb;--muted:#a0a5ad;--line:#2c3036;--soft:#23272c;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:var(--ink)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:grid;grid-template-columns:36px 1fr;gap:2px 10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .lg{grid-row:span 2;width:36px;height:36px;border-radius:9px;background:var(--client);display:grid;place-items:center;overflow:hidden}
.brand .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{font-weight:800;font-size:1rem;line-height:1.1;overflow-wrap:anywhere}.brand span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
nav.menu{display:grid;gap:2px}
nav.menu button{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:8px;padding:8px 10px;font-weight:600;font-size:.9rem;text-align:left;cursor:pointer;color:var(--ink)}
nav.menu button svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
nav.menu button .lk{margin-left:auto;font-size:.75rem;opacity:.7}
nav.menu button[aria-current=true]{background:var(--client-soft);color:var(--ink)}
nav.menu button[aria-current=true] svg{color:var(--ink)}
nav.menu .sep{height:1px;background:var(--line);margin:8px 4px}
main{padding:20px 22px 48px;min-width:0}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-weight:800;font-size:1.55rem;line-height:1.15;margin:0}h2{font-weight:700;font-size:1.06rem;margin:0}h3{font-weight:700;font-size:.95rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}.note{color:var(--muted);font-size:.84rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .lab{font-size:.8rem;color:var(--muted);font-weight:600}.kpi .val{font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}.kpi .cmp{font-size:.8rem;color:var(--muted)}
.hero{background:var(--client);color:var(--client-ink);border-radius:16px;padding:20px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h1{color:inherit}.hero p{margin:4px 0 0;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.filters label{display:grid;gap:4px;font-weight:600;font-size:.78rem;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
label.f{display:grid;gap:5px;font-weight:600;font-size:.85rem;margin-bottom:10px}label.f input,label.f select,label.f textarea{width:100%}
.btn{background:var(--client);color:var(--client-ink);border:0;border-radius:9px;padding:9px 15px;font-weight:700;font-size:.88rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.amb{background:var(--amb);color:#1d1f23}.btn.sm{padding:5px 10px;font-size:.8rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--client)}
.clk{cursor:pointer}.clk .seta,h2.clk .seta{color:var(--muted);font-weight:700}button.card.kpi{text-align:left;font:inherit;color:inherit;width:100%}button.card.kpi:hover,.hb.clk:hover,h2.clk:hover{outline:2px solid var(--amb);outline-offset:2px;border-radius:8px}.hb.clk:hover b{text-decoration:underline}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.86rem}.hb .bar{height:12px}
.msg{padding:10px 12px;border-radius:10px;font-size:.9rem}.msg.err{background:#fbe9e7;color:var(--bad)}.msg.ok{background:#e6f4ec;color:var(--ok)}.msg.info{background:#fff4e2;color:#7a4e0c}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:50;font-size:.9rem}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}.center .card{width:min(440px,100%)}
.ft{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:.6rem;color:var(--muted)}
.lock{border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.feat div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.88rem}.feat b{display:block;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:16px}.modal .card{width:min(680px,100%);max-height:92vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.prev{border:1px solid var(--line);border-radius:12px;overflow:hidden}.prev .ph{padding:14px;color:#fff}
.mob{display:none}
.so-cel,.barra-cel,.veu{display:none}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}aside{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:100vh;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}aside.aberto{transform:none}.veu.aberto{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}nav.menu{grid-template-columns:1fr}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}main{padding:12px 12px 78px}
 .so-cel{display:inline-flex}.topo{padding:8px 4px 0;flex-wrap:wrap;gap:6px}.topo>.note{display:none}.topo .buscag{order:9;max-width:none!important;flex-basis:100%}.topo .visao{max-width:100%!important;flex:1}.so-pc{display:none!important}
 .barra-cel{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}.barra-cel button{background:none;border:0;color:var(--muted);font:inherit;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}.barra-cel button svg{width:22px;height:22px}.barra-cel button[aria-current=true]{color:var(--ink);font-weight:700}
 .modal{display:block;padding:6px;overflow:auto;z-index:70}.top>div{min-width:0;max-width:100%}.wrap{grid-template-columns:minmax(0,1fr)}.wrap>*{min-width:0}.modal>.card{max-height:none;width:auto!important;max-width:100%;min-width:0;margin:0 auto}.tbl{overflow-x:auto;max-width:100%}main{min-width:0;overflow-x:hidden}.top{flex-wrap:wrap}.tabs,.subtabs{overflow-x:auto;flex-wrap:nowrap}}
@media (max-width:560px){.g4,.g3,.row,.row3{grid-template-columns:1fr}}
.paleta{display:grid;gap:6px;margin:6px 0 4px}.pal-l{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}.pal-n{font-size:.78rem;font-weight:600;color:var(--mut)}.pal-c{display:flex;gap:6px;flex-wrap:wrap}.pal-c button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}.pal-c button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}.pal-outra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.84rem;font-weight:600}@media(max-width:420px){.pal-l{grid-template-columns:1fr}}
.voltar{background:none;border:0;font-weight:700;padding:4px 0;margin:0 0 6px;cursor:pointer;color:var(--ink);font-size:.92rem;justify-self:start;align-self:start;text-align:left;width:auto}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mini div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.mini span{display:block;font-size:.74rem;color:var(--muted);font-weight:600}.mini b{font-size:.98rem}.mini i{display:block;font-style:normal;font-size:.74rem;color:var(--muted)}
.sit{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.sit.aberto{background:#fdecc8;color:#7a4e0c}.sit.aceito{background:#dcebff;color:#1e4b8f}.sit.em_atendimento{background:#e8e2fb;color:#4b2fa3}.sit.concluido{background:#d9f2e3;color:#1f7a45}.sit.confirmado{background:#cfeedd;color:#155c34}
.pri{font-size:.72rem;font-weight:700}.pri.urgente{color:#b42318}.pri.alta{color:#c2410c}.pri.media{color:#7a4e0c}.pri.baixa{color:var(--muted)}
.atraso{color:var(--bad);font-weight:700}.noprazo{color:var(--ok);font-weight:700}
.linha{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}.linha div{position:relative;padding:4px 0 10px}.linha div:before{content:"";position:absolute;left:-21px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--client);border:2px solid var(--surface)}
.qrbox{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;border:1px solid var(--line)}.qrbox svg{width:220px;height:220px}.qrmini{padding:6px}.qrmini svg{width:136px;height:136px}
.senha-box{position:relative;display:block}.senha-box input{padding-right:86px}.senha-olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:.82rem;font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px;opacity:.85;color:inherit}.senha-olho:hover,.senha-olho:focus{opacity:1;text-decoration:underline}
.topo{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 24px 0;position:relative}.topo .note{margin-right:auto}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--amb);color:#1d1f23;font-weight:800;display:grid;place-items:center;overflow:hidden;cursor:pointer;flex-shrink:0;padding:0;font-size:.9rem}.avatar img{width:100%;height:100%;object-fit:cover}
.menu-conta{position:absolute;right:24px;top:58px;width:min(320px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;z-index:30;display:grid;gap:2px}
.mc-item{display:block;text-align:left;background:none;border:0;padding:10px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--ink);margin:0}.mc-item:hover{background:var(--soft)}

/* paletas de cores (escolhidas em Configurações › Design) */
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"]{--bg:var(--p-bg);--line:var(--p-line);--soft:var(--p-soft)}
:root[data-pal]:not([data-pal="classico"]){--amb:var(--p-acc)}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] aside{background:linear-gradient(180deg,var(--p-s1),var(--p-s2));border-right:0}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] aside .brand{border-bottom-color:rgba(127,127,127,.2)}:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] aside .brand b{color:var(--p-sink)}:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] aside .brand span{color:var(--p-smut)}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu button{color:var(--p-sink)}:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu button svg{color:var(--p-icon)}:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu button:hover{background:rgba(127,127,127,.12)}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu button[aria-current=true]{background:var(--p-sact);color:var(--p-sink);box-shadow:inset 3px 0 0 var(--p-str)}:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu button[aria-current=true] svg{color:var(--p-str)}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu .sep{background:rgba(127,127,127,.22)}:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] nav.menu button .lk{color:var(--p-smut)}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] h1{color:var(--p-tit)}
:root[data-pal]:not([data-pal="classico"])[data-theme="claro"] .card{border-color:transparent;box-shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+1){box-shadow:inset 4px 0 0 var(--p-k1),0 4px 14px rgba(16,24,40,.06);background:linear-gradient(135deg,color-mix(in srgb,var(--p-k1) 10%,var(--surface)),var(--surface) 65%)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+2){box-shadow:inset 4px 0 0 var(--p-k2),0 4px 14px rgba(16,24,40,.06);background:linear-gradient(135deg,color-mix(in srgb,var(--p-k2) 10%,var(--surface)),var(--surface) 65%)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+3){box-shadow:inset 4px 0 0 var(--p-k3),0 4px 14px rgba(16,24,40,.06);background:linear-gradient(135deg,color-mix(in srgb,var(--p-k3) 10%,var(--surface)),var(--surface) 65%)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+4){box-shadow:inset 4px 0 0 var(--p-k4),0 4px 14px rgba(16,24,40,.06);background:linear-gradient(135deg,color-mix(in srgb,var(--p-k4) 10%,var(--surface)),var(--surface) 65%)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+1) .val{color:var(--p-k1)}:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+2) .val{color:var(--p-k2)}:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+3) .val{color:var(--p-k3)}:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+4) .val{color:var(--p-k4)}
:root[data-pal]:not([data-pal="classico"]) .bar i{background:linear-gradient(90deg,var(--p-pri),var(--p-k2))}
:root[data-herogr="1"] .hero h1,:root[data-herogr="1"] .hero p,:root[data-herogr="1"] .hero b{color:inherit!important}
:root[data-herogr="1"] .hero{background:linear-gradient(120deg,var(--p-h1),var(--p-h2));color:var(--p-hink);box-shadow:0 10px 30px color-mix(in srgb,var(--p-pri) 18%,transparent)}
.palc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 6px}
.palc button{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.palc button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--amb)}
.palc .pv{display:grid;grid-template-columns:28% 1fr;height:62px}.palc .pv i{display:block}.palc .pv div{display:grid;grid-template-rows:22px 1fr;gap:5px;padding:6px}
.palc .pv .hd{border-radius:5px}.palc .pv .ks{display:flex;gap:4px}.palc .pv .ks span{flex:1;border-radius:4px}
.palc b{display:block;padding:6px 8px 7px;font-size:.84rem}

/* dashboard */
.hero .hero-rel{background:rgba(255,255,255,.85);color:#1d1f23;border-color:transparent}
.hero .eyebrow{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.kpi .kic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:8px;font-size:.85rem;font-weight:800;background:var(--soft);color:var(--ink);vertical-align:middle}
.kpi .lab{display:flex;align-items:center}
.dash-k .kpi{padding:14px 16px}.dash-k2 .kpi .val{font-size:1.35rem}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+1) .kic{background:color-mix(in srgb,var(--p-k1) 16%,transparent);color:var(--p-k1)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+2) .kic{background:color-mix(in srgb,var(--p-k2) 16%,transparent);color:var(--p-k2)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+3) .kic{background:color-mix(in srgb,var(--p-k3) 16%,transparent);color:var(--p-k3)}
:root[data-pal]:not([data-pal="classico"]) .grid.g4>.kpi:nth-child(4n+4) .kic{background:color-mix(in srgb,var(--p-k4) 16%,transparent);color:var(--p-k4)}
.rosca{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}.rosca svg{width:150px;height:150px;transform:rotate(0deg)}.rosca .rt{font-size:7px;font-weight:800;fill:var(--ink)}
.rleg{display:grid;gap:4px}.rl{display:grid;grid-template-columns:12px 1fr auto 42px;gap:8px;align-items:center;background:none;border:0;padding:5px 6px;border-radius:8px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;font-size:.86rem}
.rl:hover{background:var(--soft)}.rl i{width:12px;height:12px;border-radius:4px}.rl em{font-style:normal;color:var(--muted);text-align:right;font-size:.8rem}

function cnpjOk(v){const c=String(v||"").replace(/[^0-9A-Za-z]/g,"").toUpperCase();if(!/^[0-9A-Z]{12}[0-9]{2}$/.test(c)||/^(.)\1{13}$/.test(c))return false;const dv=n=>{const w=n==12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];let s=0;for(let i=0;i<n;i++)s+=(c.charCodeAt(i)-48)*w[i];const r=s%11;return r<2?0:11-r};return dv(12)==c.charCodeAt(12)-48&&dv(13)==c.charCodeAt(13)-48}
function fmtCnpj(v){const c=String(v||"").replace(/[^0-9A-Za-z]/g,"").toUpperCase();return c.length==14?`${c.slice(0,2)}.${c.slice(2,5)}.${c.slice(5,8)}/${c.slice(8,12)}-${c.slice(12)}`:c}

  return `<div class="top"><div><h1>Excluídos e histórico</h1><p class="sub">Nada é apagado de verdade. Aqui ficam os itens excluídos de todas as unidades, com quem excluiu, quando e o motivo, e o histórico de criações e alterações. Só o Gestor vê esta tela.</p></div></div>
  <div style="display:flex;gap:4px;border-bottom:1px solid var(--line)">${[["exc","Caixa Excluídos"],["hist","Histórico de alterações"]].map(([k,n])=>`<button onclick="E.excTab='${k}';render()" style="background:none;border:0;border-bottom:3px solid ${t==k?"var(--client)":"transparent"};padding:8px 12px;font-weight:700;cursor:pointer;color:${t==k?"var(--ink)":"var(--muted)"}">${n}</button>`).join("")}</div>
  ${t=="exc"?`<div class="card"><div class="tbl"><table><tr><th>Quando</th><th>O quê</th><th>Item</th><th>Unidade</th><th>Quem excluiu</th><th>Motivo</th><th></th></tr>${E.exc.map((x,i)=>`<tr><td>${dh(x.quando)}</td><td>${{bens:"Bem",ambientes:"Ambiente",chamados:"Chamado"}[x.tabela]||esc(x.tabela)}</td><td><b>${esc(x.item)}</b></td><td>${esc(x.unidade||"—")}</td><td>${esc(x.quem||"—")}</td><td>${esc(x.motivo||"")}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="E.verExc=${i};render()">Como estava</button> <button class="btn sm" onclick="restaurarItem('${x.tabela}','${x.id}')">Restaurar</button></td></tr>${E.verExc===i?`<tr><td colspan="7"><pre style="white-space:pre-wrap;font-size:.78rem;background:var(--soft);padding:8px;border-radius:8px;margin:0">${esc(resumoJson(x.como_estava))}</pre></td></tr>`:""}`).join("")||`<tr><td colspan="7" class="note">Nenhum item excluído.</td></tr>`}</table></div></div>`
  :`<div class="card"><div class="tbl"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Item</th><th>Unidade</th><th>Mudança</th></tr>${E.hist.map(h=>`<tr><td>${dh(h.criado_em)}</td><td>${esc(h.quem||"")}</td><td><span class="pill">${esc(h.acao)}</span></td><td>${esc(h.item||h.tabela)}</td><td>${esc(nomeUni(h.estabelecimento_id))}</td><td class="note">${h.acao=="alterou"?esc(mudancas(h.antes,h.depois)):esc(h.motivo||"")}</td></tr>`).join("")||`<tr><td colspan="6" class="note">Sem registros ainda.</td></tr>`}</table></div><p class="note">O histórico é protegido: ninguém consegue alterar nem apagar estes registros.</p></div>`}`}
async function carregarExcl(){try{[E.exc,E.hist]=await Promise.all([DB.excluidos(E.v.contratante_id),DB.historico(E.v.contratante_id)]);render()}catch(e){E.msg=["err",e.message];render()}}
const CAMPOS={nome:"Nome",estado:"Estado",categoria:"Categoria",marca:"Marca",modelo:"Modelo",numero_serie:"Nº de série",valor:"Valor",ambiente_id:"Ambiente",observacao:"Observação",data_aquisicao:"Data de compra",situacao:"Situação",descricao:"Descrição",prioridade:"Prioridade",perfil:"Perfil",ativo:"Ativo"};
function mudancas(a,d){if(!d)return "";return Object.keys(d).filter(k=>CAMPOS[k]).map(k=>`${CAMPOS[k]}: ${fmtV(k,a&&a[k])} → ${fmtV(k,d[k])}`).join(" · ")||"outros campos"}
function fmtV(k,v){if(v==null||v==="")return "vazio";if(k=="ambiente_id")return nomeAmbi(v);if(k=="valor")return veValor()?brl(v):"🔒 restrito";return String(v)}
function resumoJson(o){if(!o)return "";return Object.entries(o).filter(([k,v])=>CAMPOS[k]&&v!=null&&v!=="").map(([k,v])=>`${CAMPOS[k]}: ${fmtV(k,v)}`).join("\n")||JSON.stringify(o)}
async function restaurarItem(t,id){if(!confirm("Restaurar este item? Ele volta para a lista da unidade."))return;try{await DB.restaurar(t,id);toast("Item restaurado.");E.verExc=null;await carregarExcl();await recarregar()}catch(e){toast(e.message)}}

/* ---------------- Equipe: Gestor ajusta perfil e unidade ---------------- */
function editarMembro(u){E.editMem=u;render()}
async function salvarMembro(){const u=E.editMem,p=$("#mp").value,un=p=="gestor"?null:$("#mu").value,at=$("#ma2").value=="1",m=E.mem.find(x=>x.user_id==u)||{};
  if(m.ativo&&!at){E.editMem=null;E.eqTab="ativos";E.inaMem=u;render();toast("Para inativar, escreva o motivo.");return}

  try{await DB.atualizarMembro(u,p,un,m.ativo||at);E.editMem=null;toast("Equipe atualizada.");await recarregar()}catch(e){E.msg=["err",e.message];render()}}

/* ---------------- Configurações: prazos de SLA ---------------- */
const SLA_PADRAO={urgente:[.5,4],media:[8,72],baixa:[24,168]};
function cfgSla(){if(!E.slaCarregado){E.slaCarregado=1;DB.sla(E.v.contratante_id).then(r=>{E.sla=r;render()}).catch(()=>{})}
  const v=k=>{const x=E.sla.find(s=>s.prioridade==k);return x?[x.atender_horas,x.resolver_horas]:SLA_PADRAO[k]};
  return `<form class="card" onsubmit="event.preventDefault();salvarSla()"><h2>Prazos de SLA</h2><p class="note">Todo chamado fica ligado a um destes três prazos: Baixa, Média ou Urgente. Tempo para atender (aceitar) e para resolver, conforme a prioridade. Vale para os chamados abertos a partir de agora; os já abertos mantêm o prazo com que foram registrados.</p>
  <div class="tbl"><table><tr><th>Prioridade</th><th>Atender em até (horas)</th><th>Resolver em até (horas)</th></tr>${Object.entries(PRI).map(([k,t])=>`<tr><td><span class="pri ${k}">${t}</span></td><td><input id="sa_${k}" type="number" min="0.25" step="0.25" value="${v(k)[0]}" style="max-width:120px"></td><td><input id="sr_${k}" type="number" min="1" step="1" value="${v(k)[1]}" style="max-width:120px"></td></tr>`).join("")}</table></div>
  <p class="note">Referência de engenharia clínica para equipamentos críticos: atender em até 30 minutos e resolver em até 24 horas.</p><button class="btn">Salvar prazos</button></form>`}
async function salvarSla(){const L=Object.keys(PRI).map(k=>({prioridade:k,atender_horas:Number($("#sa_"+k).value),resolver_horas:Number($("#sr_"+k).value)}));
  try{await DB.salvarSla(E.v.contratante_id,L);E.sla=L;toast("Prazos salvos.");render()}catch(e){E.msg=["err",e.message];render()}}


/* ---------------- Calibrações, preventivas, corretivas e teste de segurança elétrica ---------------- */
const TIPOS_M={calibracao:"Calibração",preventiva:"Preventiva",qualificacao:"Qualificação",inspecao:"Inspeção",corretiva:"Corretiva",seguranca_eletrica:"Segurança elétrica (TSE)"};
const bemDe=id=>E.bens.find(b=>b.id==id)||{};
const hojeISO=()=>new Date().toISOString().slice(0,10);
function situacaoProg(p){const h=hojeISO(),d30=new Date(Date.now()+30*864e5).toISOString().slice(0,10);return p.proxima<h?["vencida","Vencida","atraso"]:p.proxima<=d30?["vence","Vence em 30 dias","pri media"]:["em_dia","Em dia","noprazo"]}
function pgCal(){const F=E.calF,q=F.q.toLowerCase(),i=E.indM||{};
  const L=E.prog.filter(p=>{const b=bemDe(p.bem_id),st=situacaoProg(p)[0];return (!F.sit||st==F.sit)&&(!F.tipo||p.tipo==F.tipo)&&(!q||((b.patrimonio||"")+" "+(b.nome||"")+" "+(b.numero_serie||"")).toLowerCase().includes(q))});
  return `<div class="top"><div><h1>Calibrações, preventivas, corretivas e teste de segurança elétrica</h1><p class="sub">Uma linha por equipamento e tipo de serviço. Ao registrar o serviço feito, a próxima data é calculada sozinha (calibração: 12 meses; preventiva: 6 meses, ou o que você definir).</p></div>${ADMIN()?`<button class="btn" onclick="novoProg()">+ Programar serviço</button>`:""}</div>
  <div class="grid g4">${kpi("Em dia",pct(i.em_dia||0,i.programados||0),`${num(i.em_dia||0)} de ${num(i.programados||0)} programados`)}${kpi("Vencidos",num(i.vencidos||0),`${num(i.calibracoes_vencidas||0)} calibração · ${num(i.preventivas_vencidas||0)} preventiva`)}${kpi("Vencem em 30 dias",num(i.vencem_30_dias||0),"programe com a empresa")}${kpi("Sem manual",num(i.equipamentos_sem_manual||0),"equipamentos sem manual anexado")}</div>
  <div style="display:flex;gap:4px;border-bottom:1px solid var(--line)">${[["lista","Lista"],["agenda","Agenda do mês"],["tse","Analisadores e checklists"]].map(([k,t])=>`<button onclick="E.calTab='${k}';render()" style="background:none;border:0;border-bottom:3px solid ${E.calTab==k?"var(--client)":"transparent"};padding:8px 12px;font-weight:700;cursor:pointer;color:${E.calTab==k?"var(--ink)":"var(--muted)"}">${t}</button>`).join("")}</div>
  ${E.calTab=="agenda"?agendaCal():E.calTab=="tse"?abaTseCk():`<div class="card"><div class="filters"><label>Situação<select onchange="E.calF.sit=this.value;render()"><option value="">Todas</option>${[["vencida","Vencida"],["vence","Vence em 30 dias"],["em_dia","Em dia"]].map(([k,t])=>`<option value="${k}" ${F.sit==k?"selected":""}>${t}</option>`).join("")}</select></label>
   <label>Tipo<select onchange="E.calF.tipo=this.value;render()"><option value="">Todos</option>${["calibracao","preventiva","seguranca_eletrica","qualificacao","inspecao"].map(k=>`<option value="${k}" ${F.tipo==k?"selected":""}>${TIPOS_M[k]}</option>`).join("")}</select></label>
   <label>Buscar<input value="${esc(F.q)}" placeholder="Patrimônio, equipamento, série" oninput="E.calF.q=this.value;render();const i=document.querySelectorAll('.filters input')[0];i.focus();i.setSelectionRange(i.value.length,i.value.length)"></label><span class="note">${L.length} linha(s)</span></div>
  <div class="tbl"><table><tr><th>Equipamento</th><th>Patrimônio · série</th><th>Ambiente</th>${GESTOR()?"<th>Unidade</th>":""}<th>Tipo</th><th>Última</th><th>Próxima</th><th>Situação</th><th>Empresa</th><th></th></tr>
  ${L.map(p=>{const b=bemDe(p.bem_id),st=situacaoProg(p);return `<tr><td><b>${esc(b.nome||"")}</b>${b.critico?' <span class="pill" style="background:#fbe9e7;color:var(--bad)">crítico</span>':""}${b.indisponivel?' <span class="pill" style="background:#fbe9e7;color:var(--bad)">⛔ indisponível</span>':""}</td><td>${esc([b.patrimonio,b.numero_serie].filter(Boolean).join(" · "))}</td><td>${esc(nomeAmbi(b.ambiente_id))}</td>${GESTOR()?`<td>${esc(nomeUni(p.estabelecimento_id))}</td>`:""}<td>${TIPOS_M[p.tipo]}</td><td>${dt(p.ultima)}</td><td><b>${dt(p.proxima)}</b>${p.proxima_manual?' <span class="note">(ajustada)</span>':""}</td><td><span class="${st[2]}">${st[1]}</span></td><td>${esc((E.emps.find(e=>e.id==p.empresa_id)||{}).nome||"—")}</td>
   <td><div style="display:flex;gap:4px;flex-wrap:wrap;min-width:120px"><button class="btn sm" onclick="registrarServ('${p.id}')">Registrar feito</button>${ADMIN()?`<button class="btn ghost sm" onclick="editarProg('${p.id}')">Editar</button>`:""}<button class="btn ghost sm" onclick="abrirBem('${b.id}')">Ficha</button></div></td></tr>`}).join("")||`<tr><td colspan="10" class="note">Nenhum serviço programado. ${ADMIN()?"Clique em “+ Programar serviço”.":""}</td></tr>`}</table></div></div>`}`}
function agendaCal(){const d=E.calMes?new Date(E.calMes+"-01T12:00:00"):new Date();const ano=d.getFullYear(),mes=d.getMonth(),pri=new Date(ano,mes,1).getDay(),dias=new Date(ano,mes+1,0).getDate();
  const ym=`${ano}-${String(mes+1).padStart(2,"0")}`,porDia={};E.prog.filter(p=>p.proxima&&p.proxima.startsWith(ym)).forEach(p=>{(porDia[+p.proxima.slice(8)]||(porDia[+p.proxima.slice(8)]=[])).push(p)});
  const nav=k=>{const x=new Date(ano,mes+k,1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`};
  return `<div class="card"><div class="top"><button class="btn ghost sm" onclick="E.calMes='${nav(-1)}';render()">‹ Anterior</button><h2 style="margin:0">${d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h2><button class="btn ghost sm" onclick="E.calMes='${nav(1)}';render()">Próximo ›</button></div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(x=>`<b class="note" style="text-align:center">${x}</b>`).join("")}${Array(pri).fill('<div></div>').join("")}${Array.from({length:dias},(_,i)=>{const L=porDia[i+1]||[];return `<div style="min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:.74rem"><b>${i+1}</b>${L.map(p=>{const b=bemDe(p.bem_id),st=situacaoProg(p);return `<div class="${st[2]}" style="cursor:pointer;line-height:1.2;margin-top:2px" onclick="registrarServ('${p.id}')">${TIPOS_M[p.tipo].slice(0,4)}. ${esc((b.nome||"").slice(0,18))}</div>`}).join("")}</div>`}).join("")}</div></div>`}
async function liberarBemG(id){const m=prompt("Motivo da liberação (ex.: reparo feito e ensaio aprovado pela empresa X):");if(m===null)return;try{toast(await DB.liberarBem(id,m.trim()));E.modal=null;await recarregar()}catch(e){toast(e.message)}}
function novoProg(){E.modal={tipo:"prog",p:{tipo:"calibracao",periodicidade_meses:12}};render()}
function editarProg(id){E.modal={tipo:"prog",p:{...E.prog.find(x=>x.id==id)}};render()}
function modalProg(){const p=E.modal.p,novo=!p.id,eq=E.bens;
  return `<div class="modal" onclick="if(event.target==this){E.modal=null;render()}"><div class="card"><button class="voltar" onclick="E.modal=null;render()">← Voltar</button><h2>${novo?"Programar serviço":"Editar programação"}</h2>${E.modal.erro?`<div class="msg err">${esc(E.modal.erro)}</div>`:""}
  <form onsubmit="event.preventDefault();salvarProg()"><label class="f">Equipamento *<select id="pb" ${novo?"":"disabled"}>${eq.map(b=>`<option value="${b.id}" ${p.bem_id==b.id?"selected":""}>${esc((b.patrimonio?b.patrimonio+" · ":"")+b.nome)} · ${esc(nomeAmbi(b.ambiente_id))}</option>`).join("")}</select></label>
  <div class="row3"><label class="f">Tipo<select id="pt" ${novo?"":"disabled"} onchange="document.getElementById('pm').value=this.value=='preventiva'?6:12">${["calibracao","preventiva","seguranca_eletrica","qualificacao","inspecao"].map(k=>`<option value="${k}" ${p.tipo==k?"selected":""}>${TIPOS_M[k]}</option>`).join("")}</select></label>
  <label class="f">A cada (meses)<input id="pm" type="number" min="1" max="120" value="${p.periodicidade_meses||12}"></label>
  <label class="f">Última vez feita<input id="pu" type="date" value="${p.ultima||""}" max="${hojeISO()}"></label></div>
  <label class="f">Empresa responsável<select id="pe"><option value="">Equipe própria</option>${E.emps.map(e=>`<option value="${e.id}" ${p.empresa_id==e.id?"selected":""}>${esc(e.nome)}</option>`).join("")}</select></label>
  <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pa" style="width:auto" ${p.proxima_manual?"checked":""} onchange="document.getElementById('pxw').style.display=this.checked?'':'none'"> Ajustar a próxima data à mão</label>
  <label class="f" id="pxw" style="${p.proxima_manual?"":"display:none"}">Próxima data<input id="px" type="date" value="${p.proxima||""}"></label>
  <label class="f">Observação<textarea id="po" rows="2" maxlength="500">${esc(p.observacao||"")}</textarea></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">${novo?"Programar":"Salvar"}</button>${novo?"":`<button type="button" class="btn ghost" style="color:var(--bad)" onclick="excluirProg('${p.id}')">🗑 Excluir programação</button>`}</div></form>
  <p class="note" style="margin-top:8px">Sem ajuste manual, a próxima data = última + periodicidade. Ao registrar um serviço feito, as datas se atualizam sozinhas.</p></div></div>`}
async function salvarProg(){const p=E.modal.p,man=$("#pa").checked,d={periodicidade_meses:Number($("#pm").value),ultima:$("#pu").value||null,empresa_id:$("#pe").value||null,observacao:$("#po").value.trim()||null,proxima_manual:man};
  if(man){if(!$("#px").value){E.modal.erro="Escolha a próxima data.";render();return}d.proxima=$("#px").value}
  try{if(p.id)await DB.updProg(p.id,d);else await DB.addProg({...d,contratante_id:E.v.contratante_id,bem_id:$("#pb").value,tipo:$("#pt").value});E.modal=null;toast("Programação salva.");await recarregar()}catch(e){E.modal.erro=e.message.includes("duplicate")||e.message.includes("igual")?"Este equipamento já tem esse tipo de serviço programado. Use Editar.":e.message;render()}}
async function excluirProg(id){const mot=prompt("Motivo da exclusão desta programação (obrigatório):");if(mot===null)return;if(mot.trim().length<5){toast("Escreva o motivo (pelo menos 5 letras).");return}
  try{await DB.excluir("servicos_programados",id,mot.trim());E.modal=null;toast("Programação excluída. O registro foi para a caixa Excluídos do Gestor.");await recarregar()}catch(e){E.modal.erro=e.message;render()}}
/* ---------------- Registrar serviço feito (4 tipos + TSE + checklist) · itens 49 e 50 ---------------- */
var CHKD=[{id:"ck1",contratante_id:null,codigo:"prev-geral",tipo_equipamento:"Equipamento eletromédico (geral)",tipo_servico:"preventiva",itens:["Identificação e etiqueta legíveis","Gabinete sem trincas ou peças soltas","Cabo de alimentação e plugue íntegros","Alarmes sonoros e visuais testados","Bateria conferida","Teste funcional conforme o fabricante"]},{id:"ck2",contratante_id:null,codigo:"prev-monitor",tipo_equipamento:"Monitor multiparamétrico",tipo_servico:"preventiva",itens:["Inspeção visual do gabinete e tela","Cabos de ECG, SpO2, PNI e temperatura sem danos","ECG conferido com simulador","SpO2 conferida com simulador","PNI: estanqueidade e leitura","Alarmes de limites testados","Bateria sem rede elétrica"]},{id:"ck3",contratante_id:null,codigo:"tse-geral",tipo_equipamento:"Equipamento eletromédico (geral)",tipo_servico:"seguranca_eletrica",itens:["Inspeção visual: gabinete, cabo, plugue, fusíveis e marcações","Acessórios do ensaio relacionados","Aterramento medido (classe I)","Isolamento medido","Fuga do equipamento medida","Fuga da parte aplicada medida (BF/CF)","Ensaio funcional após as medições","Etiqueta do ensaio com validade colada"]}];
var ANLD=[{id:"an1",nome:"Analisador de segurança elétrica (exemplo)",fabricante:"Fabricante X",modelo:"Modelo 1",numero_serie:"SN-0001",certificado_numero:"CERT-123",validade:new Date(Date.now()+200*864e5).toISOString().slice(0,10),ativo:true}];
const DEFIC={nenhuma:"Nenhuma deficiência",corrigir:"Deficiência sem risco direto: corrigir no próximo serviço",retirar_ate_corrigir:"Risco: retirar de uso até corrigir",nao_conforme:"Não conforme: retirar de uso"};
const CLASSE_T={I:"Classe I",II:"Classe II",interna:"Alimentação interna"};
/* mesmos limites usados pelo servidor (ABNT NBR IEC 62353) */
function avaliarTSE(m,classe,parte){const it=[];let ok=true;const n=v=>v===""||v==null||isNaN(Number(v))?null:Number(v);
  const add=(t,med,lim,bom)=>{it.push({item:t,medido:med,limite:lim,ok:bom});ok=ok&&bom};
  if("inspecao_ok" in m)add("Inspeção visual",m.inspecao_ok?"conforme":"não conforme","conforme",!!m.inspecao_ok);
  if(classe=="I"&&n(m.aterramento_ohm)!=null){const l=m.cabo_destacavel===false?0.5:0.3;add("Resistência de aterramento (Ω)",n(m.aterramento_ohm),"≤ "+l,n(m.aterramento_ohm)<=l)}
  if(n(m.isolamento_mohm)!=null){const l=classe=="II"?7:2;add("Resistência de isolamento (MΩ)",n(m.isolamento_mohm),"≥ "+l,n(m.isolamento_mohm)>=l)}
  if(["BF","CF"].includes(parte)&&n(m.isolamento_pa_mohm)!=null)add("Isolamento da parte aplicada (MΩ)",n(m.isolamento_pa_mohm),"≥ 70",n(m.isolamento_pa_mohm)>=70);
  if(n(m.fuga_equip_ua)!=null){const l=classe=="II"?100:500;add("Corrente de fuga do equipamento (µA)",n(m.fuga_equip_ua),"≤ "+l,n(m.fuga_equip_ua)<=l)}
  if(["BF","CF"].includes(parte)&&n(m.fuga_pa_ua)!=null){const l=parte=="CF"?50:5000;add("Corrente de fuga da parte aplicada (µA)",n(m.fuga_pa_ua),"≤ "+l,n(m.fuga_pa_ua)<=l)}
  if("funcional_ok" in m)add("Ensaio funcional",m.funcional_ok?"conforme":"não conforme","conforme",!!m.funcional_ok);
  return {aprovado:ok&&it.length>0,itens:it}}
function registrarServ(progId,bemId){const p=progId?E.prog.find(x=>x.id==progId):null;E.modal={tipo:"serv",p,bem_id:p?p.bem_id:bemId,t:p?p.tipo:"corretiva",docs:[]};render();const id=E.modal.bem_id;

async function salvarServ(){const m=E.modal,c=E.v.contratante_id,btn=$("#ssv"),t=$("#st").value,tse=t=="seguranca_eletrica",pr=tse&&$("#smodo").value=="propria";btn.disabled=true;btn.textContent="Registrando…";
  try{const fs=[...$("#sl").files];if(fs.some(f=>f.size>2097152))throw new Error("Cada arquivo precisa ter até 2 MB.");
    if(tse&&!pr&&!fs.length&&!confirm("Teste feito por empresa terceirizada sem o certificado anexado. Registrar mesmo assim? (o ideal é anexar o PDF do certificado)")){btn.disabled=false;btn.textContent="Registrar";return}
    let med=null;if(pr){med=medTSE();const a=avaliarTSE(med,med.classe,med.parte_aplicada);if(!a.itens.length)throw new Error("Preencha as medições do ensaio.")}
    const ck=$("#sck").value?[...document.querySelectorAll("[data-ck]")].map(x=>({item:((E.chks||[]).find(y=>y.id==$("#sck").value)||{itens:[]}).itens[+x.dataset.ck],r:x.value})):null;
    if(ck&&ck.some(x=>x.r=="nok")&&$("#sr").value=="aprovado"&&!confirm("Há itens do checklist marcados como “Não OK” e o resultado está “Aprovado”. Registrar assim mesmo?")){btn.disabled=false;btn.textContent="Registrar";return}
    const ps=[];for(const f of fs)ps.push(await DB.arquivo(c,f,f.name));const laudo=ps[0]||null;
    const d={contratante_id:c,bem_id:m.bem_id,programado_id:m.p?m.p.id:null,tipo:t,realizado_em:$("#sd").value,resultado:$("#sr").value,empresa_id:$("#se").value||null,custo:$("#sc").value===""?null:Number($("#sc").value),laudo_path:laudo,observacao:$("#so").value.trim()||null};
    if(t!="corretiva")Object.assign(d,{certificado_numero:$("#scn").value.trim()||null,validade:$("#sva").value||null,tecnico:$("#stc").value.trim()||null});
    if(tse)Object.assign(d,{modo:$("#smodo").value,ensaio:$("#sen").value,deficiencia:$("#sdf").value,medicoes:med,analisador_id:pr?($("#tan").value||null):null});
    if(ck)Object.assign(d,{checklist_id:$("#sck").value,checklist:ck});
    const r=await DB.addRealizado(d);
    for(let i=0;i<ps.length;i++)await DB.addDocumento({contratante_id:c,bem_id:m.bem_id,servico_id:r.id,tipo:fs[i].type.startsWith("image/")?"foto":(["calibracao","seguranca_eletrica"].includes(t)?"certificado":"laudo"),nome:fs[i].name,path:ps[i]});
    E.modal=null;toast(r&&r.resultado=="reprovado"||d.resultado=="reprovado"?"Serviço registrado como REPROVADO: equipamento indisponível e chamado urgente aberto.":"Serviço registrado. Próxima data atualizada.");await recarregar()}catch(e){E.modal.erro=e.message;render()}}

   <div class="row"><label class="f">Data da última limpeza *<input id="ca_limp" type="date" required max="${hojeISO()}" oninput="const w=document.getElementById('ca_lw');if(w)w.style.display=limpezaVencida(this.value,${c.caixa_limpeza_meses||6})?'':'none'"><span id="ca_lw" class="atraso" style="display:none;font-weight:700">Limpeza vencida: passou de ${c.caixa_limpeza_meses||6} meses. Programe a limpeza.</span></label><label class="f">Cloro residual (mg/L) · opcional<input id="ca_cloro" type="number" min="0" max="10" step="0.1"></label></div>

   <div class="row3"><label class="f">Compressor funcionando? *${sel("us_comp",[["ok","Sim"],["falha","Não, com falha"]])}</label><label class="f">Secador funcionando? *${sel("us_sec",[["ok","Sim"],["falha","Não, com falha"]])}</label><label class="f">Algum alarme ativo? *${sel("us_alarme",[["nao","Não"],["sim","Sim"]])}</label></div>

async function salvarMedicoes(){const m=E.modal,c=m.cfg,L=[];let q=null;
  if(m.t=="gases"){["pureza_o2","pressao_o2","pressao_ar","temperatura"].forEach(k=>{const el=$("#m_"+k);if(el)L.push({grupo:"gases",chave:k,valor:el.value})});(c.cilindros_m3||[10,7,3,1]).forEach(v=>{L.push({grupo:"cilindros",chave:"cheios_"+v,valor:$("#cc"+v).value||0},{grupo:"cilindros",chave:"vazios_"+v,valor:$("#cv"+v).value||0})});

  else{(c.geradores||["Gerador 1"]).forEach((g,i)=>{L.push({grupo:g,chave:"combustivel",valor:$("#gc"+i).value},{grupo:g,chave:"horimetro",valor:$("#gh"+i).value},{grupo:g,chave:"tensao",valor:$("#gt"+i).value||null},{grupo:g,chave:"partida_automatica",texto:$("#gp"+i).value})});L.push({grupo:"tanque",chave:"nivel",valor:$("#gtq").value})}

function etqCfgDe(x){x=x||{};const o={...ETQ_PADRAO,...x};if(x.mod&&!x.tam&&MODS[x.mod]){o.w=MODS[x.mod].w;o.h=MODS[x.mod].h;o.tam="pers";o.forma="ret";o.cod=x.cod||"ambos"}const T=ETQ_TAMS[o.tam];if(T&&T[1]){o.w=T[1];o.h=T[2]}o.w=Math.min(120,Math.max(15,+o.w||40));o.h=Math.min(80,Math.max(8,+o.h||15));return o}

  return P.map(p=>`<div class="fol" style="padding:${G.m}mm;gap:${G.g}mm;grid-template-columns:repeat(${G.c},${o.w}mm);grid-auto-rows:${o.h}mm">${p.map(n=>etiquetaHTML(n,o)).join("")}</div>`).join("")}
function imprimirEtiquetas(nums,o){const w=window.open("","_blank");if(!w){toast("Libere as janelas pop-up para imprimir.");return}
  w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Etiquetas ${esc(nums[0]||"")} a ${esc(nums[nums.length-1]||"")}</title><style>${CSS_A4}</style>${folhas(nums,o)}`);w.document.close();w.focus();setTimeout(()=>w.print(),700)}
function etqSet(k,v){E.etqCfg={...E.etqCfg,[k]:v};if(k=="tam"&&ETQ_TAMS[v]&&ETQ_TAMS[v][1]){E.etqCfg.w=ETQ_TAMS[v][1];E.etqCfg.h=ETQ_TAMS[v][2]}render()}
function etqCor(i){const c=ETQ_CORES[i];E.etqCfg={...E.etqCfg,fundo:c[1],texto:c[2],destaque:c[3]};render()}
async function etqLogoArq(inp){const f=inp.files[0];if(!f)return;try{const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(f)});const s=Math.min(1,360/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);const d=cv.toDataURL("image/png");if(d.length>250000)throw new Error("Imagem grande demais. Use um logo mais simples.");E.etqCfg={...E.etqCfg,logoImg:d,logo:E.etqCfg.logo=="sem"?"esq":E.etqCfg.logo};render()}catch(e){toast(e.message||"Não foi possível ler a imagem.")}}

async function cancelarLote(){const m=E.modal,mot=$("#clm").value.trim();m.motivo=mot;if(mot.length<5){m.erro="Escreva o motivo do cancelamento (pelo menos 5 letras).";render();return}const b=$("#clb");if(b){b.disabled=true;b.textContent="Cancelando…"}

  <div class="row3"><label class="f">Cor de fundo<span style="display:flex;gap:6px;align-items:center"><input id="ecf" type="color" value="${o.fundo}" onchange="etqSet('fundo',this.value)" style="width:46px;height:36px;padding:2px;flex:none"><input id="ecfh" maxlength="7" value="${o.fundo}" placeholder="#000000" style="font-family:monospace" onchange="if(/^#[0-9a-f]{6}$/i.test(this.value.trim()))etqSet('fundo',this.value.trim().toLowerCase());else toast('Use o código da cor no formato #RRGGBB, ex.: #0B4F8A')"></span></label><label class="f">Cor das letras e números<span style="display:flex;gap:6px;align-items:center"><input id="ect" type="color" value="${o.texto}" onchange="etqSet('texto',this.value)" style="width:46px;height:36px;padding:2px;flex:none"><input id="ecth" maxlength="7" value="${o.texto}" placeholder="#000000" style="font-family:monospace" onchange="if(/^#[0-9a-f]{6}$/i.test(this.value.trim()))etqSet('texto',this.value.trim().toLowerCase());else toast('Use o código da cor no formato #RRGGBB, ex.: #0B4F8A')"></span></label><label class="f">Cor de destaque (faixa e borda)<span style="display:flex;gap:6px;align-items:center"><input id="ecd2" type="color" value="${o.destaque}" onchange="etqSet('destaque',this.value)" style="width:46px;height:36px;padding:2px;flex:none"><input id="ecd2h" maxlength="7" value="${o.destaque}" placeholder="#000000" style="font-family:monospace" onchange="if(/^#[0-9a-f]{6}$/i.test(this.value.trim()))etqSet('destaque',this.value.trim().toLowerCase());else toast('Use o código da cor no formato #RRGGBB, ex.: #0B4F8A')"></span></label></div>

  <p class="note">Folha A4: cabem <b>${G.n}</b> placas por folha (${G.c} × ${G.r})${G.g?`, com ${G.g} mm entre elas`:", encostadas"}. ${o.h<16&&o.cod=="ambos"?"<b>Atenção:</b> em placas finas, QR Code e código de barras juntos ficam pequenos; prefira só um.":""} ${o.h<12&&o.cod!="num"?"Placa muito fina: teste a leitura do código antes de imprimir o lote.":""} *O tamanho real na tela depende do monitor; na impressão sai na medida exata (imprima em 100%, sem "ajustar à página").</p>
  ${GESTOR()?`<button type="button" class="btn ghost" onclick="salvarEtqPadrao()">Salvar como padrão da empresa</button>`:`<p class="note">O padrão da empresa é definido pelo Gestor. As mudanças aqui valem só para este lote.</p>`}</div>`}
function pgEtq(){if(!E.etqLibs){E.etqLibs=1;carregarLibs().then(render).catch(e=>toast(e.message))}if(!E.etqIni){E.etqIni=1;E.etqCfg=etqCfgDe({...(E.cfgE&&E.cfgE.etiqueta||{}),qtd:E.etqCfg&&E.etqCfg.qtd||24})}E.etqCfg=etqCfgDe(E.etqCfg);const t=E.etqTab,o=E.etqCfg,sig=E.v.contratantes.sigla;
  const usadas=Object.values(E.etqCont).reduce((s,x)=>s+x.usada,0),livres=Object.values(E.etqCont).reduce((s,x)=>s+x.livre,0);
  return `<div class="top"><div><h1>Etiquetas de patrimônio</h1><p class="sub">Benefício incluído: a empresa gera os próprios números de patrimônio, com a sua sigla (${esc(sig)}) e sequência a partir de 0001, imprime em folha A4 e controla o que foi usado, sem empresa terceirizada.</p></div></div>

async function gerarLote(){const q=Math.max(1,Math.min(1000,+$("#eqt").value||0));if(!confirm(`Reservar ${q} número(s) de patrimônio e gerar as etiquetas? Os números não voltam depois.`))return;

    toast(`Lote ${nums[0]} a ${nums[nums.length-1]} reservado.`);imprimirEtiquetas(nums,E.etqCfg);await recarregar()}catch(e){toast(e.message)}}
async function reimprimirLote(id){try{await carregarLibs();const L=await DB.etqDoLote(id),l=E.lotes.find(x=>x.id==id);imprimirEtiquetas(L.map(x=>x.numero),{...(l&&l.config&&l.config.w?{}:E.etqCfg),...(l&&l.config||{}),logoImg:E.etqCfg.logoImg})}catch(e){toast(e.message)}}
async function reimprimirBem(){const n=$("#rp").value.trim().toUpperCase(),b=E.bens.find(x=>(x.patrimonio||"").toUpperCase()==n);if(!b){toast("Patrimônio não encontrado.");return}
  try{await carregarLibs();await DB.reimprimir(b.id,$("#rm").value.trim());imprimirEtiquetas([b.patrimonio],E.etqCfg);toast("Reimpressão registrada.")}catch(e){toast(e.message)}}

     <div class="card"><h2>Chamados em aberto</h2>${s.ch.map(c=>`<p style="margin:4px 0;cursor:pointer" onclick="abrirChamadoDet('${c.id}')"><b>nº ${c.numero}</b> · ${esc(c.descricao)} · <span class="sit ${c.situacao}">${SIT[c.situacao]}</span> ${prazoTxt(c)}</p>`).join("")||`<p class="note">Nenhum chamado em aberto.</p>`}</div>`

async function relatorioAmbiente(id){const a=E.amb.find(x=>x.id==id),s=statusAmb(a);try{

  const linha=(t,b)=>{if(y>280){doc.addPage();topo()}doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(b?11:9);doc.splitTextToSize(t,W-2*M).forEach(l=>{doc.text(l,M,y);y+=b?6:4.6})};
  topo();linha(a.nome+" - "+nomeUni(a.estabelecimento_id),true);linha(`Situação: ${COR[s.cor][2]} · ${s.bens.length} bem(ns) · ${s.ch.length} chamado(s) em aberto (${s.atr.length} atrasado(s)) · ${s.venc.length} calibração/preventiva vencida(s)`);y+=3;
  linha("Chamados (todos)",true);E.ch.filter(c=>c.ambiente_id==a.id).forEach(c=>linha(`nº ${c.numero} · ${dh(c.aberto_em)} · ${PRI[c.prioridade]||c.prioridade} · ${SIT[c.situacao]} · ${c.descricao}`));y+=3;
  linha("Inventário",true);s.bens.forEach(b=>linha(`${b.patrimonio?b.patrimonio+" · ":""}${b.nome}${b.posicao?" · "+b.posicao:""}${b.numero_serie?" · série "+b.numero_serie:""} · ${b.estado}${b.valor&&relValor()?" · "+brl(b.valor):""}`));y+=3;
  linha("Calibrações e preventivas",true);s.prog.forEach(p=>{const b=bemDe(p.bem_id);linha(`${b.nome||""} · ${TIPOS_M[p.tipo]} · última ${dt(p.ultima)} · próxima ${dt(p.proxima)} · ${situacaoProg(p)[1]}`)});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(107,112,120);doc.text("Atalaia System - Sistema de Gestão de Patrimônio e Manutenção",M,290);doc.text(`Página ${i} de ${n}`,W-M,290,{align:"right"})}

function custosPeriodo(per,uk){const ok=x=>uk?okU(x,uk):uniOk(x),L=[];
  (E.ch||[]).filter(c=>ok(c)&&c.custo&&per.ok(c.concluido_em)).forEach(c=>L.push({d:c.concluido_em,o:"Chamado",u:c.estabelecimento_id,t:`nº ${c.numero} · ${c.descricao}`,v:Number(c.custo)}));
  (E.realT||[]).forEach(r=>{const b=bemDe(r.bem_id);const u=r.estabelecimento_id||b.estabelecimento_id;if(r.custo&&per.ok(r.realizado_em)&&ok({estabelecimento_id:u}))L.push({d:r.realizado_em,o:TIPOS_M[r.tipo]||"Serviço",u,t:(b.nome||"")+(r.observacao?" · "+r.observacao:""),v:Number(r.custo)})});
  (E.estMov||[]).filter(m=>m.tipo=="saida"&&ok(m)&&per.ok(m.em)).forEach(m=>L.push({d:m.em,o:"Peça",u:m.estabelecimento_id,t:`${nomePeca(m.peca_id)} × ${num(m.quantidade)}`,v:m.quantidade*(m.custo_unitario||0)}));
  L.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  const ch=L.filter(l=>l.o=="Chamado").reduce((s,l)=>s+l.v,0),pc=L.filter(l=>l.o=="Peça").reduce((s,l)=>s+l.v,0),sv=L.reduce((s,l)=>s+l.v,0)-ch-pc;
  const ct=(E.emps||[]).filter(e=>ok(e.estabelecimento_id?e:{estabelecimento_id:null})||!e.estabelecimento_id).reduce((s,e)=>s+(Number(e.valor_mensal)||0),0);
  const inv=E.bens.filter(b=>ok(b)&&b.data_aquisicao&&per.ok(b.data_aquisicao)).reduce((s,b)=>s+(Number(b.valor)||0),0);
  const us=E.est.filter(u=>uk?(!E[uk]||u.id==E[uk]):(!E.ru||u.id==E.ru));
  const porU=us.map(u=>{const X=L.filter(l=>l.u==u.id),f=o=>X.filter(l=>o(l.o)).reduce((s,l)=>s+l.v,0);return {nome:u.nome,ch:f(o=>o=="Chamado"),pc:f(o=>o=="Peça"),sv:f(o=>o!="Chamado"&&o!="Peça"),tot:X.reduce((s,l)=>s+l.v,0),parque:E.bens.filter(b=>b.estabelecimento_id==u.id).reduce((s,b)=>s+(Number(b.valor)||0),0)}});
  return {lanc:L,ch,pc,sv,ct,inv,total:ch+pc+sv,porU}}
function pgCustos(){const n=new Date(),z=d=>d.toISOString().slice(0,10),de12=z(new Date(n.getFullYear(),n.getMonth()-11,1)),per12={de:de12,ate:z(n),ok:d=>!!d&&String(d).slice(0,10)>=de12};

  <div class="grid g2"><div class="card"><h2>Gasto por mês</h2>${hbar(meses.map(m=>[new Date(m+"-15").toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}),C.lanc.filter(l=>String(l.d).slice(0,7)==m).reduce((s,l)=>s+l.v,0)]),brl)}</div>
   <div class="card"><h2>Por unidade</h2>${hbar(C.porU.map(x=>[x.nome,x.tot]),brl)}<div class="tbl" style="margin-top:8px"><table><tr><th>Unidade</th><th>Gasto</th><th>Parque</th><th>Gasto / parque</th></tr>${C.porU.map(x=>`<tr><td>${esc(x.nome)}</td><td>${brl(x.tot)}</td><td>${brl(x.parque)}</td><td>${x.parque?(x.tot/x.parque*100).toFixed(1).replace(".",",")+"%":"—"}</td></tr>`).join("")}</table></div></div></div>

/* ---- Apoio à substituição ---- */
function analiseSubst(){const ano=365.25*864e5,d12=new Date(Date.now()-ano).toISOString(),custoBem={};
  (E.ch||[]).forEach(c=>{if(c.bem_id&&c.custo)custoBem[c.bem_id]=(custoBem[c.bem_id]||0)+Number(c.custo)});
  (E.realT||[]).forEach(r=>{if(r.custo&&r.tipo=="corretiva")custoBem[r.bem_id]=(custoBem[r.bem_id]||0)+Number(r.custo)});
  (E.estMov||[]).forEach(m=>{if(m.tipo=="saida"){const bid=m.bem_id||((E.ch||[]).find(c=>c.id==m.chamado_id)||{}).bem_id;if(bid)custoBem[bid]=(custoBem[bid]||0)+m.quantidade*(m.custo_unitario||0)}});
  return E.bens.filter(b=>b.tipo||b.valor||b.data_aquisicao).map(b=>{const idade=b.data_aquisicao?(Date.now()-Date.parse(b.data_aquisicao))/ano:null,vu=Number(b.vida_util_anos)||10,vida=idade==null?null:idade/vu*100,ch12=(E.ch||[]).filter(c=>c.bem_id==b.id&&c.aberto_em>=d12).length,custo=custoBem[b.id]||0,pcv=b.valor?custo/b.valor*100:null,tv=(E.tecnoL||[]).filter(t=>t.bem_id==b.id).length;
    let pts=0;const mot=[];if(vida!=null&&vida>=100){pts+=2;mot.push("passou da vida útil")}else if(vida!=null&&vida>=80){pts+=1;mot.push("perto do fim da vida útil")}
    if(ch12>=4){pts+=2;mot.push(ch12+" chamados em 12 meses")}else if(ch12>=2){pts+=1;mot.push(ch12+" chamados em 12 meses")}
    if(pcv!=null&&pcv>=50){pts+=2;mot.push("manutenção já custou "+Math.round(pcv)+"% do valor")}else if(pcv!=null&&pcv>=30){pts+=1;mot.push("manutenção já custou "+Math.round(pcv)+"% do valor")}
    if(["ruim","em manutenção"].includes(b.estado)){pts+=1;mot.push("estado "+b.estado)}if(tv){pts+=1;mot.push(tv+" registro(s) de tecnovigilância")}
    return {b,idade,vida,ch12,custo,pcv,tv,pts,mot,rec:pts>=4?"Substituir":pts>=2?"Avaliar":"Manter"}}).sort((a,b)=>b.pts-a.pts)}
function pgSubst(){const L=analiseSubst().filter(x=>okU(x.b,"fuS")&&(!E.recS||x.rec==E.recS)),T=analiseSubst().filter(x=>okU(x.b,"fuS")),cor={Substituir:"atraso",Avaliar:"pri media",Manter:"noprazo"};
  return `<div class="top"><div><h1>Substituição de equipamentos</h1><p class="sub">Apoio à decisão: cada equipamento ganha pontos pela idade em relação à vida útil, pelos chamados nos últimos 12 meses, pelo custo de manutenção em relação ao valor, pelo estado e pelos registros de tecnovigilância.</p></div><button class="btn ghost" onclick="E.pag='rel';E.rk='subst';render()">Relatório (PDF e Excel)</button></div>
  <div class="grid g3">${["Substituir","Avaliar","Manter"].map(r=>`<button class="card" style="text-align:left;cursor:pointer;font:inherit;color:inherit;${E.recS==r?"border:2px solid var(--ink)":""}" onclick="E.recS=E.recS=='${r}'?'':'${r}';render()"><span class="${cor[r]}">${r}</span><div style="font-size:2rem;font-weight:800">${T.filter(x=>x.rec==r).length}</div><span class="note">${r=="Substituir"?"4 pontos ou mais":r=="Avaliar"?"2 ou 3 pontos":"0 ou 1 ponto"}</span></button>`).join("")}</div>
  <div class="card"><div class="filters">${filtroUni("fuS")}${E.recS?`<button class="btn ghost sm" onclick="E.recS='';render()">Mostrar todos</button>`:""}</div><div class="tbl"><table><tr><th>Equipamento</th><th>Unidade</th><th>Idade</th><th>Vida útil usada</th><th>Chamados 12 m</th><th>Custo manutenção</th><th>Custo / valor</th><th>Por quê</th><th>Recomendação</th></tr>${L.map(x=>`<tr class="click" onclick="abrirBem('${x.b.id}')"><td><b>${esc((x.b.patrimonio?x.b.patrimonio+" · ":"")+x.b.nome)}</b></td><td>${esc(nomeUni(x.b.estabelecimento_id))}</td><td>${x.idade==null?"—":x.idade.toFixed(1).replace(".",",")+" anos"}</td><td>${x.vida==null?"—":`<span class="${x.vida>=100?"atraso":""}">${Math.round(x.vida)}%</span>`}</td><td>${x.ch12}</td><td>${brl(x.custo)}</td><td>${x.pcv==null||!veValor()?"—":Math.round(x.pcv)+"%"}</td><td class="note">${esc(x.mot.join(" · ")||"—")}</td><td><span class="${cor[x.rec]}">${x.rec}</span> <span class="note">(${x.pts})</span></td></tr>`).join("")||`<tr><td colspan="9" class="note">Nenhum equipamento.</td></tr>`}</table></div>
  <p class="note">Sem vida útil informada, o sistema usa 10 anos. É um apoio: a decisão final considera também a segurança do paciente, a disponibilidade de peças e o orçamento.</p></div>`}

async function gLer(k){const x=await gGet(k);if(x&&typeof x=="object"&&"em" in x&&"v" in x){GOFF.quando=GOFF.quando&&GOFF.quando>x.em?GOFF.quando:x.em;return x.v}return undefined}
const gck=(k,a)=>GOFF.uid+"|"+k+"|"+JSON.stringify(a);
function gEmbrulhar(){Object.keys(DB).forEach(k=>{const f=DB[k];if(typeof f!="function"||f._g)return;let g;
  if(GOFF_LER.includes(k))g=async(...a)=>{const key=gck(k,a);if(gSemRede()){const v=await gLer(key);if(v!==undefined){gBarra();return v}throw new Error("Sem internet e sem dados guardados desta parte. Abra com internet uma vez.")}
    try{const r=await f.apply(DB,a);if(r!==undefined)gPut(key,r);return r}catch(e){if(gErroRede(e)){const v=await gLer(key);if(v!==undefined){gBarra(true);return v}}throw e}};
  else if(k=="sessao")g=async(...a)=>{const s=await f.apply(DB,a);if(s&&s.user)GOFF.uid=s.user.id||s.user.email||"anon";return s};
  else if(k=="entrar")g=async(...a)=>{const r=await f.apply(DB,a);try{const s=await DB.sessao();if(s&&s.user)GOFF.uid=s.user.id||s.user.email}catch(e){}return r};
  else if(k=="sair"||k=="sairTodos")g=async(...a)=>{GOFF.mem={};try{await gTx("readwrite",s=>s.clear())}catch(e){}return f.apply(DB,a)};
  else if(GOFF_LIVRE.includes(k))g=async(...a)=>{if(gSemRede()&&(k=="registrar"||k=="lerAviso"))return null;if(gSemRede()&&k=="urlFoto")return null;return f.apply(DB,a)};
  else g=async(...a)=>{if(gSemRede())throw new Error("Sem internet: o painel está só para consulta. Para alterar, conecte-se à internet.");try{return await f.apply(DB,a)}catch(e){if(gErroRede(e))throw new Error("Sem internet: o painel está só para consulta. Para alterar, conecte-se à internet.");throw e}};
  g._g=1;DB[k]=g})}
function gBarra(forcar){let el=document.getElementById("gofbar");const off=gSemRede()||forcar===true;
  if(!el){el=document.createElement("div");el.id="gofbar";el.setAttribute("role","status");document.body.appendChild(el)}
  if(!off){el.style.display="none";return}
  el.style.cssText="display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:80;background:#5b6470;color:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.9rem;max-width:calc(100% - 24px)";
  el.innerHTML=`📶 <b>Sem internet · só consulta.</b> Mostrando os dados salvos${GOFF.quando?" em "+new Date(GOFF.quando).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}. Para alterar, conecte-se à internet.`}
gEmbrulhar();
addEventListener("offline",()=>{gBarra();toast("Sem internet: o painel continua aberto só para consulta.")});
addEventListener("online",()=>{gBarra();toast("Internet de volta. Atualizando os dados…");if(E.v&&typeof recarregar=="function")recarregar().catch(()=>{})});
if("serviceWorker" in navigator&&(location.protocol=="https:"||location.hostname=="localhost"))navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{});
iniciar();

async function sairTodos(){if(!confirm("Sair de todos os aparelhos? Você e qualquer outro computador, tablet ou celular conectado com a sua conta precisarão entrar de novo."))return;
  try{await DB.registrar(E.v.contratante_id,"saiu de todos os aparelhos",null)}catch(e){}try{await DB.sairTodos()}catch(e){}Object.assign(E,{tela:"login",v:null,msg:["ok","Você saiu de todos os aparelhos. Em até 1 hora, nenhum outro aparelho continua com acesso."],pag:"inicio",rascunho:null});aplicarDesign({});render()}
</script>
